exp:"<p>A young adult with a movement disorder, psychiatric symptoms, and liver abnormalities should be evaluated for <b>Wilson disease</b>: low ceruloplasmin, elevated 24-h urine copper, and Kayser-Fleischer rings on slit lamp. The wing-beating tremor is characteristic. Treatment is chelation (penicillamine or trientine) and zinc.</p>"},
{t:"hyperkinetic",stem:"A 72-year-old man with hypertension and diabetes has sudden onset of violent, flinging movements of his left arm and leg that persist while awake. He is otherwise neurologically intact. Glucose is 140 mg/dL. Where is the most likely lesion?",
opts:["Left subthalamic nucleus","Right subthalamic nucleus","Right cerebellar hemisphere","Left caudate nucleus","Right substantia nigra"],a:1,
exp:"<p><b>Hemiballismus</b> results from a lesion of the <b>contralateral subthalamic nucleus</b>, usually a small vessel stroke. It often improves over weeks; antipsychotics or tetrabenazine help if needed. Nonketotic hyperglycemia is another cause, which is why glucose is checked.</p>"},
{t:"infections",stem:"A 19-year-old college student is admitted with fever, headache, neck stiffness, and a petechial rash on her legs. CSF Gram stain shows gram-negative diplococci. She is treated with ceftriaxone. Her roommate is well. Which of the following is most appropriate for the roommate?",
opts:["No action unless symptoms develop","Meningococcal vaccination only","A single dose of ciprofloxacin","IV ceftriaxone for 7 days","Lumbar puncture"],a:2,
exp:"<p>Close contacts of a patient with <b>meningococcal meningitis</b> (household, roommates, daycare, direct exposure to oral secretions) should receive chemoprophylaxis: single-dose ciprofloxacin, rifampin for 2 days, or single-dose IM ceftriaxone. Vaccination alone is not sufficient for immediate protection.</p>"},
{t:"infections",stem:"A 34-year-old man has 3 days of fever, headache, and strange behavior, and today he reported smelling burning rubber before a seizure. Temperature is 38.9°C (102°F). He is confused and has word-finding difficulty. MRI shows T2 hyperintensity in the left medial temporal lobe. CSF shows 180 lymphocytes/μL, 400 RBCs/μL, elevated protein, and normal glucose. Which is the most appropriate next step?",
opts:["IV acyclovir now","Await CSF HSV PCR results before treatment","IV ganciclovir","High-dose glucocorticoids","Vancomycin and ceftriaxone alone"],a:0,
exp:"<p>Fever, behavioral change, seizures, aphasia, and temporal lobe involvement with lymphocytic, RBC-containing CSF indicate <b>HSV encephalitis</b>. Start <b>IV acyclovir immediately</b> on suspicion; untreated mortality is very high and delay worsens outcome. Send HSV PCR but don't wait for it. Monitor renal function.</p>"},
{t:"infections",stem:"A 38-year-old man with HIV who is not taking antiretroviral therapy has 1 week of headache, fever, and right-sided weakness. CD4 count is 45/μL. MRI shows multiple ring-enhancing lesions in the basal ganglia and at the gray-white junction. Serum Toxoplasma IgG is positive. Which of the following is the most appropriate next step?",
opts:["Stereotactic brain biopsy","Whole-brain radiation","Pyrimethamine, sulfadiazine, and leucovorin","Amphotericin B and flucytosine","Start antiretroviral therapy alone"],a:2,
exp:"<p>Multiple ring-enhancing basal ganglia lesions in a patient with CD4 &lt;100 and positive Toxoplasma serology are presumed <b>cerebral toxoplasmosis</b>. Treat empirically; clinical and radiographic improvement in about 2 weeks confirms the diagnosis. Biopsy is reserved for nonresponse or a solitary lesion suggestive of primary CNS lymphoma.</p>"},
{t:"infections",stem:"A 48-year-old woman with HIV and a CD4 count of 60/μL has 2 weeks of worsening headache, low-grade fever, and mild confusion. There are no focal deficits. CT of the head is normal. Lumbar puncture opening pressure is 38 cm H₂O; India ink stain shows encapsulated yeast. Which is the most appropriate treatment?",
opts:["Oral fluconazole alone","Ceftriaxone","IV acyclovir","Pyrimethamine and sulfadiazine","Liposomal amphotericin B plus flucytosine, with serial lumbar punctures"],a:4,
exp:"<p><b>Cryptococcal meningitis</b> is treated with induction amphotericin B plus flucytosine, then fluconazole consolidation and maintenance. Markedly raised opening pressure causes much of the morbidity and is managed with <b>repeated therapeutic LPs</b>. Antiretroviral therapy is delayed several weeks to reduce the risk of immune reconstitution syndrome.</p>"},
{t:"demyelinating",stem:"A 29-year-old woman has 3 days of blurred vision in the left eye with pain on eye movement. Visual acuity is 20/200 on the left. Colors look washed out. There is a left relative afferent pupillary defect; the optic disc looks normal. MRI of the brain shows three periventricular white-matter lesions. Which treatment is most appropriate to speed her visual recovery?",
opts:["Oral prednisone 1 mg/kg/day","IV methylprednisolone","IV immunoglobulin","Natalizumab","Acetazolamide"],a:1,
exp:"<p>This is <b>optic neuritis</b>; the MRI lesions mean high risk for multiple sclerosis. High-dose <b>IV methylprednisolone</b> speeds recovery (final acuity is similar either way). Standard-dose oral prednisone alone was associated with more recurrences in the Optic Neuritis Treatment Trial. Disease-modifying therapy should then be discussed.</p>"},
{t:"demyelinating",stem:"A 34-year-old woman has had two episodes of severe vision loss, one in each eye, and now has paraparesis with a T4 sensory level. MRI of the spine shows a lesion extending from C6 to T5. Before the myelitis, she had a week of intractable hiccups and vomiting. Brain MRI shows no typical periventricular lesions. Which antibody is most likely positive?",
opts:["Anti-NMDA receptor","Anti-GQ1b","Anti-MOG","Anti-aquaporin-4","Anti-Hu"],a:3,
exp:"<p>Severe optic neuritis, <b>longitudinally extensive transverse myelitis</b> (≥3 segments), and an area postrema syndrome (hiccups, vomiting) define <b>neuromyelitis optica spectrum disorder</b> with aquaporin-4 IgG. Some MS therapies (interferon, natalizumab, fingolimod) can worsen NMOSD, so the distinction matters. MOG antibody disease is the main alternative but area postrema syndrome favors AQP4.</p>"},
{t:"demyelinating",stem:"A 41-year-old woman with relapsing MS has been treated with natalizumab for 3 years. JC virus antibody testing has been positive. Over 6 weeks she develops progressive right-sided weakness, difficulty finding words, and confusion. MRI shows large, asymmetric, non-enhancing subcortical white-matter lesions without mass effect. Which is the most likely diagnosis?",
opts:["Progressive multifocal leukoencephalopathy","MS relapse","Primary CNS lymphoma","Toxoplasmosis","Acute disseminated encephalomyelitis"],a:0,
exp:"<p><b>PML</b> is JC virus infection of oligodendrocytes in immunosuppressed patients; natalizumab risk rises with duration of therapy, prior immunosuppressants, and JC antibody positivity. Lesions are non-enhancing and subcortical without mass effect. Confirm with CSF JC virus PCR, stop natalizumab, and consider plasma exchange to remove the drug.</p>"}
);

</script>
<script>/* questions-3.js */
NEURO.questions.push(
{t:"tumors",stem:"A 58-year-old woman with metastatic breast cancer has 2 weeks of headache and mild left arm weakness. MRI shows two enhancing lesions in the right hemisphere with extensive surrounding vasogenic edema and 4 mm of midline shift. She has never had a seizure. Which is the most appropriate initial treatment?",
opts:["Levetiracetam for seizure prophylaxis","Dexamethasone","IV mannitol","Whole-brain radiation today","Lumbar puncture for cytology"],a:1,
exp:"<p><b>Dexamethasone</b> reduces vasogenic edema around tumors and improves symptoms within days. Definitive therapy (surgery or stereotactic radiosurgery for limited metastases) follows. Seizure prophylaxis is not recommended in patients with brain tumors who have never seized. Mannitol is for impending herniation. LP risks herniation with mass effect.</p>"},
{t:"tumors",stem:"A 6-year-old boy has 1 month of morning headaches with vomiting and increasing clumsiness when walking. He sways when sitting. Fundoscopy shows bilateral papilledema. MRI shows a solid enhancing mass arising from the cerebellar vermis that compresses the fourth ventricle, with hydrocephalus. Which is the most likely diagnosis?",
opts:["Craniopharyngioma","Pilocytic astrocytoma","Ependymoma","Medulloblastoma","Diffuse midline glioma"],a:3,
exp:"<p>A solid midline <b>vermian</b> mass with truncal ataxia and hydrocephalus in a child is most likely <b>medulloblastoma</b>, a malignant embryonal tumor that can seed the CSF (drop metastases), so the whole spine is imaged. Pilocytic astrocytoma is usually a cystic hemispheric mass with a mural nodule. Ependymoma arises from the floor of the fourth ventricle. Craniopharyngioma is suprasellar. Diffuse midline glioma expands the pons.</p>"},
{t:"tumors",stem:"A 66-year-old woman has 2 months of rapidly progressive unsteadiness, slurred speech, and double vision. She cannot walk unassisted. MRI of the brain is normal. Serum testing shows anti-Yo (PCA-1) antibodies. Which evaluation is most likely to find the underlying cause?",
opts:["Colonoscopy","Thyroid ultrasound","Transvaginal ultrasound and mammography","MRI of the cervical spine","Bone marrow biopsy"],a:2,
exp:"<p>Subacute <b>paraneoplastic cerebellar degeneration</b> with anti-Yo antibodies is associated with <b>ovarian and breast cancer</b>. Search with pelvic imaging and mammography (and CT or PET if negative). Anti-Hu and VGCC antibodies point to small cell lung cancer instead. Neurologic symptoms often precede the cancer diagnosis.</p>"},
{t:"cord",stem:"A 70-year-old man trips and falls forward, striking his chin. He has severe weakness of both hands and arms, with relatively mild leg weakness, and burning pain in both arms. He has urinary retention. CT of the cervical spine shows degenerative spondylosis without fracture. Which is the most likely diagnosis?",
opts:["Anterior cord syndrome","Brown-Séquard syndrome","Posterior cord syndrome","Complete cord transection","Central cord syndrome"],a:4,
exp:"<p><b>Central cord syndrome</b> follows neck hyperextension in an older patient with cervical spondylosis. Corticospinal fibers for the arms lie more medially and are damaged most, so arms are weaker than legs. Anterior cord syndrome causes bilateral weakness and pain/temperature loss with preserved proprioception; Brown-Séquard causes a hemicord pattern.</p>"},
{t:"cord",stem:"A 67-year-old man with metastatic prostate cancer has had 3 weeks of mid-back pain that is worse at night and when lying down. Over 2 days he has developed leg weakness and difficulty urinating. Exam shows bilateral leg weakness, a sensory level at T10, and brisk leg reflexes. Which of the following is the most appropriate next step?",
opts:["Obtain MRI and wait for the result before any treatment","IV dexamethasone and emergent MRI of the entire spine","Bone scan","Lumbar puncture","Outpatient radiation oncology referral"],a:1,
exp:"<p>This is <b>malignant epidural spinal cord compression</b>, a neurologic emergency. Give high-dose <b>dexamethasone</b> immediately and obtain <b>MRI of the whole spine</b> (multiple levels are common), then definitive radiation and/or surgical decompression. Ambulatory function at the start of treatment predicts outcome.</p>"},
{t:"cord",stem:"A 44-year-old man who injects heroin has 5 days of severe low back pain and fever, and since this morning he cannot lift his legs. Temperature is 39°C (102.2°F). There is focal tenderness over the lumbar spine. ESR is 98 mm/h. Which organism is most likely responsible?",
opts:["Staphylococcus aureus","Mycobacterium tuberculosis","Pseudomonas aeruginosa","Escherichia coli","Candida albicans"],a:0,
exp:"<p>Fever, back pain, and a new neurologic deficit in a person who injects drugs indicate a <b>spinal epidural abscess</b>, most often from <b>S. aureus</b> (including MRSA). Obtain an emergent MRI with gadolinium and blood cultures, start vancomycin plus ceftriaxone or cefepime, and consult neurosurgery for decompression.</p>"},
{t:"back",stem:"A 40-year-old man has low back pain that started while lifting a heavy box and now radiates down the back of his right thigh and calf to the outer edge of his foot. He cannot stand on his right toes. The right ankle reflex is absent; the knee reflex is normal. Which nerve root is most likely compressed?",
opts:["L3","L4","L5","S1","S2"],a:3,
exp:"<p>Weak plantarflexion, an absent Achilles reflex, and sensory loss along the lateral foot localize to <b>S1</b>, usually from an L5–S1 disc herniation. L5 radiculopathy weakens great toe extension, foot dorsiflexion, and hip abduction with numbness over the dorsum of the foot and no reliable reflex change. L4 affects the patellar reflex.</p>"},
{t:"back",stem:"A 35-year-old woman has had low back pain for 5 days after moving furniture. The pain does not radiate. She has no fever, weight loss, cancer history, trauma, or bladder or bowel symptoms. Strength, sensation, and reflexes are normal, and straight leg raise is negative. Which of the following is the most appropriate management?",
opts:["MRI of the lumbar spine","NSAIDs and continuing normal activity as tolerated","Strict bed rest for 1 week","Oxycodone","Epidural glucocorticoid injection"],a:1,
exp:"<p>Acute low back pain without red flags is usually mechanical and improves within weeks. Recommend <b>staying active</b>, heat, and <b>NSAIDs</b>; short-term muscle relaxants are an option. Imaging in the first 6 weeks without red flags does not improve outcomes. Bed rest delays recovery, and opioids are not first-line.</p>"},
{t:"back",stem:"A 72-year-old man has 1 year of aching and numbness in his buttocks and thighs that begins after he walks about one block and is relieved within a few minutes by sitting or bending forward. He can walk much farther in the grocery store while leaning on the cart. Standing still does not relieve the pain. Dorsalis pedis and posterior tibial pulses are normal. Which is the most likely diagnosis?",
opts:["Lumbar spinal stenosis","Peripheral artery disease","Osteoarthritis of the hip","Diabetic lumbosacral radiculoplexus neuropathy","Cauda equina syndrome"],a:0,
exp:"<p><b>Neurogenic claudication</b> from <b>lumbar spinal stenosis</b> is provoked by standing and walking (lumbar extension narrows the canal) and relieved by sitting or flexion (the shopping cart sign). Vascular claudication is relieved by standing still and has diminished pulses. MRI confirms; treat with PT and analgesics, and consider decompression if refractory.</p>"},
{t:"cranial",stem:"A 34-year-old woman woke up with drooping of the right side of her face. She cannot wrinkle her right forehead or fully close her right eye, sounds seem louder in the right ear, and food tastes different. Symptoms began 18 hours ago. The rest of the neurologic exam is normal, and there are no ear vesicles. Which of the following is the most appropriate management?",
opts:["Noncontrast CT of the head","MRI of the brain with gadolinium","Aspirin and stroke evaluation","Oral prednisone and eye protection","Observation only"],a:3,
exp:"<p>Acute unilateral facial weakness including the forehead is a <b>peripheral (LMN) CN VII palsy</b>. With no other findings this is <b>Bell palsy</b>: treat with oral glucocorticoids within 72 h (± an antiviral for severe cases) and protect the cornea with lubricants and nighttime taping. Forehead involvement argues against stroke. Imaging is reserved for atypical features or no improvement after several months.</p>"},
{t:"cranial",stem:"A 62-year-old man with long-standing type 2 diabetes has sudden double vision and aching around the right eye. The right upper eyelid droops completely, and the right eye is deviated down and out. Both pupils are 3 mm and briskly reactive. Which is the most likely cause?",
opts:["Posterior communicating artery aneurysm","Microvascular ischemia of the oculomotor nerve","Uncal herniation","Myasthenia gravis","Cavernous sinus thrombosis"],a:1,
exp:"<p>A complete motor CN III palsy with a <b>normal pupil</b> in a patient with vascular risk factors is most often <b>microvascular ischemia</b>, which spares the superficial pupillomotor fibers; it typically resolves over 2–3 months. Compression (PComm aneurysm, herniation) affects the pupil early. Pupil involvement, partial palsy, or age under 50 warrants urgent vascular imaging.</p>"},
{t:"cranial",stem:"A 46-year-old woman has left-sided neck pain and headache that began 2 days after chiropractic manipulation. Her husband notes her left eyelid is drooping. Exam shows mild left ptosis and a smaller left pupil, with greater asymmetry in dim light. Facial sweating is normal. Which is the most appropriate next step?",
opts:["Noncontrast CT of the head","Chest X-ray","Apraclonidine eye drops and outpatient follow-up","Lumbar puncture","CT angiography of the head and neck"],a:4,
exp:"<p>An acute <b>painful Horner syndrome</b> after neck manipulation is <b>carotid artery dissection</b> until proven otherwise; the postganglionic sympathetic fibers travel on the internal carotid (facial sweating is spared because those fibers follow the external carotid). Get CTA or MRA of the neck; treat with antithrombotic therapy to prevent stroke.</p>"},
{t:"neuropathy",stem:"A 28-year-old man had diarrhea 2 weeks ago. Five days ago his feet began tingling, followed by progressive leg and then arm weakness. He now has difficulty swallowing. Reflexes are absent throughout. Forced vital capacity is 18 mL/kg and has fallen over 6 hours. Which of the following is the most appropriate next step?",
opts:["Oral prednisone","IV methylprednisolone","ICU admission, intubation, and IV immunoglobulin or plasma exchange","Outpatient EMG and follow-up","Pyridostigmine"],a:2,
exp:"<p>Ascending weakness and areflexia after <i>Campylobacter</i> infection is <b>Guillain-Barré syndrome</b>. FVC under 20 mL/kg with bulbar weakness meets criteria for elective intubation. Treat with <b>IVIG or plasma exchange</b>; glucocorticoids are ineffective. Monitor for autonomic instability with telemetry.</p>"},
{t:"neuropathy",stem:"A 55-year-old man with type 2 diabetes has burning pain and tingling in both feet that is worse at night and keeps him awake. Exam shows decreased pinprick and vibration sensation in a stocking distribution and absent ankle reflexes. Strength is normal. A1c is 8.2%. In addition to improving glycemic control, which medication is most appropriate?",
opts:["Oxycodone","Prednisone","IV immunoglobulin","Duloxetine","Carbamazepine"],a:3,
exp:"<p>First-line drugs for painful diabetic neuropathy are <b>duloxetine</b>, pregabalin or gabapentin, and TCAs. Opioids are not first-line because of limited long-term benefit and harms. Immunotherapy has no role in length-dependent diabetic neuropathy. Daily foot inspection and annual monofilament testing prevent ulcers.</p>"},
{t:"neuropathy",stem:"A 32-year-old woman at 34 weeks' gestation has numbness and tingling in the thumb, index, and middle fingers of both hands that wakes her at night; shaking her hands relieves it. Holding her wrists flexed for 60 seconds reproduces the symptoms. Thenar strength and bulk are normal. Which is the most appropriate initial management?",
opts:["Carpal tunnel release surgery","Nighttime wrist splinting in a neutral position","MRI of the cervical spine","Gabapentin","Ulnar nerve transposition"],a:1,
exp:"<p><b>Carpal tunnel syndrome</b> is common in pregnancy from fluid retention and often resolves after delivery. Initial treatment is <b>nighttime neutral wrist splinting</b>; a local glucocorticoid injection is another option. Surgery is for thenar weakness or atrophy, or symptoms refractory to conservative care.</p>"},
{t:"neuropathy",stem:"A 50-year-old man has lost 30 kg (66 lb) since bariatric surgery. He often sits with his legs crossed. He now has a right foot drop. Exam shows weak ankle dorsiflexion and eversion, normal inversion, and numbness on the dorsum of the right foot. Hip abduction and ankle reflexes are normal. Which is the most likely site of the lesion?",
opts:["Common peroneal nerve at the fibular neck","L5 nerve root","Sciatic nerve","Tibial nerve","Lumbosacral plexus"],a:0,
exp:"<p>Foot drop with weak eversion but <b>preserved inversion</b> and hip abduction localizes to the <b>common peroneal (fibular) nerve</b> at the fibular head, compressed by leg crossing, especially after rapid weight loss reduces the fat padding. L5 radiculopathy also weakens inversion (tibialis posterior) and hip abduction. Treatment is avoiding pressure and an ankle-foot orthosis.</p>"},
{t:"nmj",stem:"A 32-year-old woman has 3 months of double vision and drooping eyelids that are worse in the evening, and her jaw tires when chewing steak. Pupils are normal. Ptosis improves after an ice pack is placed over the eyelid for 2 minutes. Acetylcholine receptor antibodies are positive. Which of the following is the most appropriate next step?",
opts:["MRI of the brain","Muscle biopsy","CT of the chest","Lumbar puncture","Serum creatine kinase"],a:2,
exp:"<p>Confirmed <b>myasthenia gravis</b> requires a <b>CT of the chest</b> to look for thymoma (found in about 10–15%). Thymectomy is indicated for thymoma and also benefits adults with generalized AChR-positive MG. Start pyridostigmine for symptoms.</p>"},
{t:"nmj",stem:"A 44-year-old woman with myasthenia gravis controlled on pyridostigmine is admitted with community-acquired pneumonia. Twenty-four hours after starting antibiotics, she has worsening ptosis, nasal speech, difficulty swallowing, and shortness of breath. Which medication most likely precipitated her decline?",
opts:["Ceftriaxone","Levofloxacin","Acetaminophen","Subcutaneous heparin","Pantoprazole"],a:1,
exp:"<p><b>Fluoroquinolones</b>, aminoglycosides, and macrolides impair neuromuscular transmission and can precipitate <b>myasthenic crisis</b>. Stop the drug, follow FVC and negative inspiratory force, intubate if needed, and treat with IVIG or plasma exchange. Beta-lactams such as ceftriaxone are preferred for infections in MG.</p>"},
{t:"nmj",stem:"A 64-year-old man who smokes has 6 months of difficulty rising from chairs and climbing stairs, a dry mouth, constipation, and erectile dysfunction. Reflexes are absent at rest but become elicitable after 10 seconds of maximal muscle contraction. Strength briefly improves with repeated effort. What is the underlying mechanism?",
opts:["Antibodies against postsynaptic acetylcholine receptors","Antibodies against muscle-specific kinase","Degeneration of anterior horn cells","Antibodies against presynaptic P/Q-type voltage-gated calcium channels","A toxin that cleaves SNARE proteins"],a:3,
exp:"<p><b>Lambert-Eaton myasthenic syndrome</b>: antibodies against presynaptic voltage-gated calcium channels reduce ACh release. Proximal weakness, autonomic symptoms, and facilitation of strength and reflexes after exercise are characteristic. About half have <b>small cell lung cancer</b>, so CT chest is needed. Amifampridine is symptomatic therapy. Botulinum toxin cleaves SNARE proteins.</p>"},
{t:"muscle",stem:"A 58-year-old man has 1 year of progressive weakness that began in his right hand and now involves both arms and his speech. Exam shows atrophy of the intrinsic hand muscles, fasciculations in the arms and tongue, brisk reflexes, and bilateral Babinski signs. Sensation and eye movements are normal. Which medication has been shown to prolong survival in this condition?",
opts:["IV immunoglobulin","Prednisone","Pyridostigmine","Plasma exchange","Riluzole"],a:4,
exp:"<p>Combined UMN and LMN signs in multiple regions with normal sensation indicate <b>ALS</b>. <b>Riluzole</b> modestly extends survival; edaravone and, for SOD1 mutations, tofersen are other options. Noninvasive ventilation provides the largest survival and quality-of-life benefit once respiratory insufficiency develops. Immunotherapies do not help.</p>"},
{t:"muscle",stem:"A 52-year-old woman has 3 months of difficulty lifting her arms to brush her hair and climbing stairs. She has a violaceous rash on her upper eyelids and scaly red papules over her knuckles. Serum CK is 3,500 U/L. In addition to glucocorticoids, which of the following is most appropriate?",
opts:["Age-appropriate cancer screening plus CT of the chest, abdomen, and pelvis","Stop any statin and recheck CK in 3 months without other evaluation","Dystrophin gene testing","Thymectomy","Repetitive nerve stimulation"],a:0,
exp:"<p>Heliotrope rash and Gottron papules with proximal weakness indicate <b>dermatomyositis</b>, which is associated with malignancy (ovarian, lung, gastrointestinal, breast, lymphoma), especially in the first years after diagnosis. Screen with age-appropriate tests and cross-sectional imaging (and pelvic ultrasound in women). Also evaluate for interstitial lung disease.</p>"},
{t:"muscle",stem:"A 4-year-old boy has trouble keeping up with friends and climbing stairs. To stand up from the floor, he pushes on his thighs with his hands. His calves are enlarged and firm. CK is 15,000 U/L. Which genetic abnormality is most likely?",
opts:["In-frame deletion in the dystrophin gene","Frameshift deletion in the dystrophin gene","CTG repeat expansion in DMPK","Homozygous deletion of SMN1","GAA repeat expansion in the frataxin gene"],a:1,
exp:"<p><b>Duchenne muscular dystrophy</b> (Gowers sign, calf pseudohypertrophy, very high CK in a young boy) results from <b>frameshift deletions</b> in dystrophin, eliminating the protein. In-frame deletions produce a partly functional protein and the milder Becker phenotype. Glucocorticoids slow progression; monitor for cardiomyopathy and respiratory failure.</p>"},
{t:"sleep",stem:"A 19-year-old college student falls asleep in class and while driving despite 8 hours of sleep at night. When she laughs hard, her knees buckle and she sometimes slumps to the floor while fully aware. She sees vivid figures as she falls asleep. Which is the most appropriate diagnostic test?",
opts:["EEG","MRI of the brain","Overnight polysomnography followed by a multiple sleep latency test","Actigraphy for 2 weeks","Serum ferritin"],a:2,
exp:"<p>Excessive sleepiness with <b>cataplexy</b> and hypnagogic hallucinations indicates <b>narcolepsy type 1</b>. Diagnosis is polysomnography (to exclude other causes and ensure adequate sleep) followed the next day by an <b>MSLT</b>: mean sleep latency ≤8 minutes with ≥2 sleep-onset REM periods. Low CSF hypocretin is also diagnostic but not first-line.</p>"},
{t:"sleep",stem:"A 66-year-old woman has an uncomfortable crawling feeling in her legs every evening and an irresistible urge to move them; walking around relieves it. It delays her sleep. Neurologic exam is normal. Serum ferritin is 30 ng/mL. Which is the most appropriate initial treatment?",
opts:["Pramipexole","Iron supplementation","Clonazepam","Diphenhydramine at bedtime","Haloperidol"],a:1,
exp:"<p>In <b>restless legs syndrome</b>, check iron studies and give <b>iron</b> when ferritin is ≤75 ng/mL; this alone can relieve symptoms. If medication is still needed, α2δ ligands are preferred; dopamine agonists cause augmentation over time. Antihistamines and dopamine antagonists worsen RLS.</p>"},
{t:"sleep",stem:"A 68-year-old man's wife reports that for 2 years he has shouted, punched, and kicked during his sleep, once injuring her. When she wakes him, he describes a dream of fighting off an attacker. Neurologic exam is normal. Polysomnography shows REM sleep without atonia. This patient has the greatest risk of later developing which condition?",
opts:["Alzheimer disease","Amyotrophic lateral sclerosis","Huntington disease","Parkinson disease","Narcolepsy"],a:3,
exp:"<p><b>REM sleep behavior disorder</b> is a strong prodromal marker of <b>synucleinopathies</b>: most patients eventually develop Parkinson disease, dementia with Lewy bodies, or multiple system atrophy. Make the bedroom safe and treat with melatonin or clonazepam.</p>"}
);

</script>
<script>/* questions-4.js */
NEURO.questions.push(
{t:"tbi",stem:"A 22-year-old man is struck on the left side of the head with a baseball bat. He briefly loses consciousness, then is alert and talking in the emergency department. One hour later he becomes difficult to arouse and his left pupil is dilated. CT shows a biconvex hyperdense collection over the left temporal lobe with a skull fracture. Injury to which vessel most likely caused this?",
opts:["Bridging cortical veins","Anterior communicating artery","Middle meningeal artery","Superior sagittal sinus","Lenticulostriate arteries"],a:2,
exp:"<p>A <b>lucid interval</b> followed by rapid decline with a lens-shaped collection that does not cross sutures is an <b>epidural hematoma</b>, usually from a temporal bone fracture tearing the <b>middle meningeal artery</b>. It needs emergent surgical evacuation. Bridging veins cause subdural hematomas; lenticulostriate arteries cause hypertensive putaminal hemorrhage.</p>"},
{t:"tbi",stem:"An 81-year-old woman taking apixaban for atrial fibrillation fell and hit her head 3 weeks ago without losing consciousness. Since then, her family reports headaches and confusion that come and go, and today she is drowsy with mild left arm weakness. CT shows a crescent-shaped hypodense collection over the right convexity. Which is the most likely diagnosis?",
opts:["Epidural hematoma","Normal pressure hydrocephalus","Diffuse axonal injury","Cerebral contusion","Chronic subdural hematoma"],a:4,
exp:"<p><b>Chronic subdural hematoma</b> follows minor trauma in older adults (brain atrophy stretches bridging veins) and anticoagulant use. Symptoms develop over weeks and fluctuate. On CT, chronic blood is hypodense and crescent-shaped, crossing suture lines. Reverse anticoagulation; symptomatic collections are drained, and middle meningeal artery embolization lowers recurrence.</p>"},
{t:"tbi",stem:"A 16-year-old football player is tackled and briefly appears dazed. On the sideline he has a headache and cannot remember the score, though he never lost consciousness. Fifteen minutes later he says he feels fine and asks to return to the game. Neurologic exam is normal. Which is the most appropriate management?",
opts:["Allow return to play because he is now asymptomatic","Noncontrast CT of the head before deciding","No return to play today; stepwise return after symptoms resolve","MRI of the brain","Two weeks of strict bed rest in a dark room"],a:2,
exp:"<p>This is a <b>concussion</b>; loss of consciousness is not required. An athlete with a suspected concussion must <b>never return to play the same day</b>. After a brief period of relative rest, he returns to school first, then follows a graduated return-to-play protocol with at least 24 h per step once symptom-free. Imaging is only for red flags. Prolonged strict rest delays recovery.</p>"},
{t:"icp",stem:"A 45-year-old man with a known right temporal glioblastoma becomes increasingly drowsy over several hours. His right pupil is now dilated and sluggish, and his left-sided weakness has worsened. BP is 150/80 mm Hg. He is being prepared for intubation and neurosurgery has been called. Which of the following is the most appropriate immediate treatment?",
opts:["IV hypertonic saline or mannitol","Lumbar puncture to lower pressure","Lowering the head of the bed to flat","Bolus of 0.45% saline","Hyperventilation to a PaCO₂ of 20 mm Hg for 24 hours"],a:0,
exp:"<p>Ipsilateral pupil dilation with worsening contralateral hemiparesis indicates <b>uncal herniation</b>. Give <b>osmotic therapy</b> (hypertonic saline or mannitol), elevate the head of the bed to 30°, and use brief hyperventilation (PaCO₂ 30–35) only as a bridge to definitive decompression. LP could precipitate fatal herniation; hypotonic fluids worsen edema; prolonged deep hyperventilation causes ischemia.</p>"},
{t:"icp",stem:"A 30-year-old man is in the ICU after a severe traumatic brain injury. Over 30 minutes his BP rises from 130/80 to 210/110 mm Hg, his heart rate falls from 90 to 44/min, and his breathing becomes irregular with pauses. Which is the most likely explanation?",
opts:["Autonomic dysreflexia","Neurogenic shock","β-blocker toxicity","Rising intracranial pressure with brainstem compression","Primary hypertensive emergency"],a:3,
exp:"<p>Hypertension with bradycardia and irregular respirations is the <b>Cushing triad</b>, a late sign of elevated ICP and impending herniation. Treat the ICP urgently (osmotic therapy, CSF drainage, sedation, surgical decompression); do not simply lower the BP, which drives cerebral perfusion. Neurogenic shock causes hypotension with bradycardia.</p>"},
{t:"icp",stem:"A 16-year-old girl has been taking minocycline for acne for 4 months. She now has daily headaches, horizontal double vision when looking into the distance, and bilateral optic disc swelling. Neurologic exam shows bilateral abduction deficits only. Which of the following is the most appropriate next step?",
opts:["Sumatriptan as needed","Lumbar puncture before imaging","MRI of the brain with MR venography","Reassurance","EEG"],a:2,
exp:"<p>Papilledema with CN VI palsies suggests raised ICP; tetracyclines are a recognized cause of <b>intracranial hypertension</b>. Always <b>image before LP</b> to exclude a mass and venous sinus thrombosis, then measure opening pressure. Stop minocycline, monitor visual fields, and treat with acetazolamide if needed.</p>"},
{t:"peds",stem:"An 8-month-old girl has had clusters of sudden flexion of the neck, trunk, and arms shortly after waking for 3 weeks. She has stopped sitting without support. Exam shows several hypopigmented oval macules on her trunk that fluoresce under a Wood lamp. EEG shows hypsarrhythmia. Which is the most appropriate treatment?",
opts:["Ethosuximide","Phenytoin","Vigabatrin","Carbamazepine","Observation; spasms resolve with age"],a:2,
exp:"<p><b>Infantile spasms</b> with developmental regression and hypsarrhythmia in a child with ash-leaf macules suggests <b>tuberous sclerosis</b>. <b>Vigabatrin</b> is first-line for spasms in TSC (ACTH or high-dose steroids for other causes). Monitor for vigabatrin-related visual field loss. Delayed treatment worsens developmental outcome.</p>"},
{t:"peds",stem:"A 3-year-old girl developed normally until about 15 months of age. Since then she has lost the few words she had and no longer uses her hands to pick up toys; instead she makes repetitive hand-wringing movements. Her head circumference has fallen from the 50th to below the 5th percentile. She has episodes of breath-holding while awake. Mutation of which gene is most likely?",
opts:["FMR1","SMN1","TSC2","Dystrophin","MECP2"],a:4,
exp:"<p><b>Rett syndrome</b> (MECP2, X-linked dominant, almost all girls): normal early development, then regression with loss of purposeful hand use, stereotyped hand-wringing, acquired microcephaly, breathing irregularities, and seizures. Fragile X (FMR1) causes intellectual disability in boys without regression.</p>"},
{t:"peds",stem:"A 7-year-old boy has seven light-brown macules larger than 5 mm on his trunk and freckling in both axillae. His mother has similar skin findings and several soft skin nodules. This child is at increased risk for which tumor?",
opts:["Optic pathway glioma","Bilateral vestibular schwannomas","Subependymal giant cell astrocytoma","Cerebellar hemangioblastoma","Medulloblastoma"],a:0,
exp:"<p>Six or more café-au-lait macules with axillary freckling and an affected parent indicates <b>neurofibromatosis type 1</b>. Children with NF1 develop <b>optic pathway gliomas</b> (annual eye exams), plexiform neurofibromas, and learning disabilities. Bilateral vestibular schwannomas define NF2; SEGA occurs in tuberous sclerosis; hemangioblastoma in von Hippel-Lindau.</p>"},
{t:"peds",stem:"A 3-year-old boy born at 27 weeks' gestation walks on his toes. His legs are stiff with scissoring and brisk reflexes, while his arms are only mildly affected. His cognition and language are age-appropriate, and he has not lost any skills. Which imaging finding is most likely?",
opts:["Tram-track cortical calcifications","Periventricular leukomalacia","Bilateral globus pallidus injury","Cerebellar hypoplasia","Cortical tubers"],a:1,
exp:"<p>Prematurity predisposes to <b>periventricular leukomalacia</b>, which damages the descending corticospinal fibers to the legs (they run closest to the ventricles), producing <b>spastic diplegic cerebral palsy</b>. Globus pallidus injury from kernicterus causes dyskinetic CP. CP is nonprogressive; regression suggests another diagnosis.</p>"},
{t:"drugs",stem:"A 22-year-old man receives IV prochlorperazine in the emergency department for a migraine. Two hours later his neck is twisted to the right, his eyes are forced upward, and he is frightened. Vital signs are normal. Which is the most appropriate treatment?",
opts:["Dantrolene","IV diphenhydramine","Cyproheptadine","Propranolol","Valbenazine"],a:1,
exp:"<p><b>Acute dystonia</b> (torticollis, oculogyric crisis) occurs hours to days after a dopamine blocker, especially in young men. Treat with IV or IM <b>diphenhydramine or benztropine</b>; co-administering diphenhydramine with antiemetics prevents it. Propranolol treats akathisia; valbenazine treats tardive dyskinesia; dantrolene treats NMS or malignant hyperthermia.</p>"},
{t:"drugs",stem:"A 34-year-old woman taking sertraline for depression started tramadol for back pain this morning. Eight hours later she is agitated and diaphoretic, with temperature 38.6°C (101.5°F), tremor, diarrhea, hyperreflexia, and sustained clonus at both ankles. Pupils are dilated. In addition to stopping both drugs and giving benzodiazepines, which treatment is most appropriate?",
opts:["Dantrolene","Bromocriptine","Cyproheptadine","Physostigmine","Haloperidol"],a:2,
exp:"<p>Rapid onset after adding a serotonergic drug, with <b>clonus and hyperreflexia</b>, autonomic instability, and GI symptoms, is <b>serotonin syndrome</b>. Treat with supportive care, benzodiazepines, and the 5-HT2A antagonist <b>cyproheptadine</b>. NMS has slower onset with lead-pipe rigidity and bradyreflexia; antipsychotics would worsen serotonin syndrome.</p>"},
{t:"drugs",stem:"A 45-year-old man with schizophrenia was started on haloperidol 5 days ago. He is now confused, with temperature 40°C (104°F), BP fluctuating between 100/60 and 180/100 mm Hg, profuse sweating, and diffuse 'lead-pipe' rigidity. Reflexes are diminished. CK is 12,000 U/L. Which is the most likely diagnosis?",
opts:["Serotonin syndrome","Malignant hyperthermia","Anticholinergic toxicity","Neuroleptic malignant syndrome","Exertional heat stroke"],a:3,
exp:"<p><b>Neuroleptic malignant syndrome</b>: days after a dopamine antagonist, with fever, lead-pipe rigidity, altered mental status, autonomic instability, and high CK. Stop the drug; give cooling, fluids, and benzodiazepines; consider dantrolene or bromocriptine. Monitor for rhabdomyolysis and renal failure. Anticholinergic toxicity causes dry skin without rigidity.</p>"},
{t:"neuroophth",stem:"A 48-year-old woman has headaches and keeps bumping into door frames on both sides. Visual field testing shows loss of the temporal half of the visual field in each eye. Where is the lesion?",
opts:["Optic chiasm","Left optic tract","Right optic nerve","Bilateral occipital lobes","Right Meyer loop"],a:0,
exp:"<p><b>Bitemporal hemianopia</b> results from compression of the crossing nasal retinal fibers at the <b>optic chiasm</b>, most often by a pituitary adenoma (also craniopharyngioma or meningioma). Get MRI of the sella and pituitary hormone levels. Optic tract and occipital lesions cause homonymous defects.</p>"},
{t:"neuroophth",stem:"A 71-year-old man with hypertension and hyperlipidemia had sudden, painless loss of vision in his right eye 1 hour ago. Visual acuity is counting fingers. There is a right relative afferent pupillary defect. Fundoscopy shows a pale, whitened retina with a cherry-red spot at the fovea. Which is the most appropriate next step?",
opts:["Outpatient ophthalmology appointment within 1 week","Timolol eye drops","Oral prednisone","Immediate stroke center evaluation, including consideration of thrombolysis","Outpatient MRI of the orbits"],a:3,
exp:"<p><b>Central retinal artery occlusion</b> is an ocular stroke and should be handled like an acute ischemic stroke: emergent evaluation at a stroke center, where thrombolysis may be considered within the window, followed by an embolic source workup (carotids, cardiac rhythm, echo). In an older patient, also check ESR and CRP immediately to exclude giant cell arteritis.</p>"},
{t:"neuroophth",stem:"A 30-year-old woman has double vision when looking to the right. On right gaze, her left eye does not move past the midline, and her right eye shows horizontal nystagmus. Both eyes converge normally when she looks at a near target. Where is the lesion?",
opts:["Right medial longitudinal fasciculus","Left abducens nucleus","Left medial longitudinal fasciculus","Right paramedian pontine reticular formation","Left oculomotor nerve"],a:2,
exp:"<p>Failure of adduction with nystagmus of the abducting eye and <b>intact convergence</b> is an <b>internuclear ophthalmoplegia</b>, named for the side of the adduction failure: the <b>left MLF</b>. Convergence proves the CN III and medial rectus work. In a young woman, MS is the most likely cause; in older adults, a brainstem stroke.</p>"},
{t:"vertigo",stem:"A 64-year-old woman has brief spells of intense spinning, each lasting about 30 seconds, when she rolls over in bed or looks up to a high shelf. Hearing is normal. When she is moved quickly from sitting to lying with her head turned right and extended, upbeating torsional nystagmus begins after a 5-second delay and fades within 30 seconds. Which is the most appropriate treatment?",
opts:["Canalith repositioning (Epley) maneuver","Daily meclizine","MRI of the brain","Prednisone","Sodium restriction and hydrochlorothiazide"],a:0,
exp:"<p>Positional vertigo lasting seconds with a positive Dix-Hallpike test (latency, upbeat-torsional nystagmus toward the down ear, fatigability) is <b>posterior canal BPPV</b>. The <b>Epley maneuver</b> is curative in most patients. Vestibular suppressants don't treat the cause. Sodium restriction is for Ménière disease.</p>"},
{t:"vertigo",stem:"A 66-year-old man with hypertension and diabetes has had continuous vertigo, nausea, and vomiting for 6 hours. He cannot walk without falling. Nystagmus beats to the left on left gaze and to the right on right gaze. A rapid head impulse test shows no corrective saccade in either direction. Alternate cover testing shows a small vertical skew deviation. Which is the most appropriate next step?",
opts:["Epley maneuver","Meclizine and discharge home","MRI of the brain with diffusion-weighted imaging and stroke evaluation","Prednisone for vestibular neuritis","Audiometry"],a:2,
exp:"<p>In acute continuous vertigo, <b>HINTS</b> distinguishes peripheral from central causes. A <b>normal head impulse</b>, <b>direction-changing nystagmus</b>, and <b>skew deviation</b> are each central signs, and together strongly indicate a <b>posterior circulation stroke</b>. Inability to walk also points to cerebellar involvement. Admit for stroke workup; early MRI may miss small infarcts.</p>"},
{t:"vertigo",stem:"A 45-year-old woman has had four episodes over 6 months of severe spinning vertigo lasting 2 to 4 hours, with roaring tinnitus and a feeling of fullness in her left ear. Between attacks, her hearing on the left seems muffled. Audiometry shows low-frequency sensorineural hearing loss on the left. Which is the most appropriate initial management?",
opts:["Labyrinthectomy","Epley maneuver","Intratympanic gentamicin","Daily meclizine indefinitely","Sodium restriction and a diuretic"],a:4,
exp:"<p>Episodic vertigo for hours with fluctuating low-frequency sensorineural loss, tinnitus, and aural fullness is <b>Ménière disease</b> (endolymphatic hydrops). Initial management is <b>dietary sodium restriction and a diuretic</b> (often with betahistine), with vestibular suppressants only during acute attacks. Ablative options (intratympanic gentamicin, labyrinthectomy) are reserved for refractory disease.</p>"},
{t:"vertigo",stem:"A 30-year-old man reports decreased hearing in his right ear. A 512-Hz tuning fork placed on his forehead is heard louder in the right ear. When the fork is held next to the right ear and then on the right mastoid, he hears it longer on the mastoid. Which type of hearing loss does he have?",
opts:["Left sensorineural","Right conductive","Right sensorineural","Left conductive","Bilateral sensorineural"],a:1,
exp:"<p>In <b>conductive</b> loss, Weber lateralizes <b>toward</b> the affected ear and Rinne shows bone conduction greater than air conduction on that side. In sensorineural loss, Weber lateralizes to the normal ear and air conduction remains greater than bone. Causes of conductive loss include cerumen, effusion, perforation, and otosclerosis.</p>"},
{t:"neuropsych",stem:"A 28-year-old woman cannot move her left leg after an argument with her partner 2 days ago. She lies with the leg motionless and cannot lift it on command. When she pushes her right heel down into the examiner's hand, her left hip extension becomes strong. Reflexes are symmetric with flexor plantar responses. MRI of the brain and spine is normal. Which is the most appropriate next step?",
opts:["Tell her nothing is wrong and discharge her","Explain functional neurological disorder using the positive exam findings and refer for physical therapy and CBT","Repeat MRI with contrast in 1 week","Lumbar puncture","IV methylprednisolone"],a:1,
exp:"<p>A positive <b>Hoover sign</b> with normal reflexes and imaging indicates <b>functional limb weakness</b>. The diagnosis is made on positive signs, not by exclusion. Explain it clearly and without blame (demonstrating the sign can help), avoid further unnecessary testing, and refer for <b>physical therapy and CBT</b>. Dismissing the symptoms worsens outcomes.</p>"},
{t:"neuropsych",stem:"A 72-year-old man is brought by his daughter for memory problems over 3 months. His wife died 4 months ago. He sleeps poorly, has lost 5 kg (11 lb), and has stopped attending church. On cognitive testing he often answers 'I don't know' and gives up quickly. He is independent in daily activities. TSH, B12, and CT of the head are normal. Which is the most appropriate treatment?",
opts:["Donepezil","Memantine","Lorazepam","Sertraline","Quetiapine"],a:3,
exp:"<p>Cognitive complaints with poor effort, 'I don't know' answers, and prominent mood and neurovegetative symptoms after a loss suggest <b>depression with cognitive impairment</b> (pseudodementia). Treat the depression with an SSRI such as <b>sertraline</b> and reassess cognition. Benzodiazepines worsen cognition in older adults. Follow over time because some patients later develop dementia.</p>"},
{t:"ethics",stem:"A 34-year-old man has a catastrophic traumatic brain injury. He has no response to pain and absent pupillary, corneal, cough, and gag reflexes. His core temperature is 34.5°C, and a propofol infusion was stopped 1 hour ago. The team is considering brain death determination. Which is the most appropriate next step?",
opts:["Declare brain death now based on the exam","Proceed with the apnea test now","Rewarm to at least 36°C and allow sedation to clear before repeating the exam","Obtain an EEG as the definitive test","Ask the family whether the exam should be performed"],a:2,
exp:"<p>Brain death determination requires excluding confounders: <b>hypothermia</b> (core temperature &lt;36°C), recent sedatives or paralytics, severe metabolic derangement, and hypotension. Rewarm and wait for sedative clearance, then perform the full clinical exam and apnea test. Ancillary tests are used only when the exam cannot be completed. Family consent is not required to determine death, though families should be informed and supported.</p>"},
{t:"ethics",stem:"An 86-year-old woman with advanced Alzheimer disease is bedbound, does not speak, and needs help with all care. She has been eating less and was recently treated for aspiration pneumonia. Her daughter, the health care proxy, asks whether a feeding tube will help her live longer. Which is the most appropriate recommendation?",
opts:["Careful hand feeding focused on comfort","Percutaneous endoscopic gastrostomy","Nasogastric tube feeding","Total parenteral nutrition","Indefinite IV fluids"],a:0,
exp:"<p>In <b>advanced dementia</b>, tube feeding does <b>not</b> prolong survival, prevent aspiration, improve function, or heal pressure ulcers, and it often leads to restraints and agitation. Recommend <b>careful hand feeding</b> as tolerated, aligned with comfort-focused goals, and discuss hospice eligibility.</p>"},
{t:"ethics",stem:"A 72-year-old woman with expressive aphasia after a stroke declines a gastrostomy tube. Using yes/no responses and a picture board, she consistently shows that she understands the procedure, the risk of aspiration and malnutrition without it, and the alternatives, and she explains with gestures that she does not want 'tubes.' Her daughter insists the tube be placed. Which is the most appropriate action?",
opts:["Defer to the daughter's wishes","Seek a court-appointed guardian","Respect the patient's decision","Require a psychiatry consultation before any decision can be made","Place the tube because aphasia prevents informed refusal"],a:2,
exp:"<p>Capacity is decision-specific and can be assessed by any physician. Aphasia does not remove capacity if, with appropriate communication aids, the patient shows she can <b>understand, appreciate, reason, and express a consistent choice</b>. A capacitated patient's informed refusal must be respected; surrogates decide only when the patient lacks capacity. Psychiatry consultation can help in difficult cases but is not required.</p>"}
);

{id:"neuroscience",cat:"found",title:"Neuroanatomy & drug mechanisms",
summary:"The foundational science the shelf tests through clinical vignettes: transmitter sources, circuits, CSF flow, and how each neurologic drug works and why its side effects follow.",
sections:[
{h:"Transmitter sources",html:`
<table><thead><tr><th>Transmitter</th><th>Main source</th><th>Clinical tie-in</th></tr></thead><tbody>
<tr><td>Dopamine</td><td>Substantia nigra pars compacta; ventral tegmental area; arcuate nucleus</td><td>Parkinson disease (nigrostriatal loss); psychosis and reward (mesolimbic); prolactin inhibition (tuberoinfundibular)</td></tr>
<tr><td>Norepinephrine</td><td>Locus coeruleus (pons)</td><td>Arousal; overactive in anxiety and opioid or alcohol withdrawal</td></tr>
<tr><td>Serotonin</td><td>Raphe nuclei (brainstem)</td><td>Mood, sleep, pain modulation; serotonin syndrome</td></tr>
<tr><td>Acetylcholine</td><td>Nucleus basalis of Meynert</td><td>Lost early in Alzheimer disease → cholinesterase inhibitors</td></tr>
<tr><td>Histamine</td><td>Tuberomammillary nucleus (hypothalamus)</td><td>Wakefulness; why H1 blockers sedate</td></tr>
<tr><td>Hypocretin (orexin)</td><td>Lateral hypothalamus</td><td>Lost in narcolepsy type 1</td></tr>
<tr><td>GABA</td><td>Striatum, cerebellar Purkinje cells, interneurons</td><td>Lost in Huntington disease (striatum)</td></tr>
<tr><td>Melatonin</td><td>Pineal gland, driven by the suprachiasmatic nucleus</td><td>Circadian rhythm disorders</td></tr></tbody></table>`},
{h:"Basal ganglia and cerebellum",html:`
<p>The cerebellum works on the same side of the body: its output crosses once (superior cerebellar peduncle to the opposite red nucleus and thalamus), and the corticospinal tract crosses back. <b>Hemispheres</b> coordinate the ipsilateral limbs; the <b>vermis</b> controls trunk and gait. Inputs arrive through the middle (pontine) and inferior (spinal, vestibular, olivary) peduncles; output leaves from the deep nuclei (dentate) through the superior peduncle.</p>
<table><thead><tr><th>Thalamic nucleus</th><th>Relays</th></tr></thead><tbody>
<tr><td>VPL</td><td>Body sensation (spinothalamic, dorsal columns)</td></tr><tr><td>VPM</td><td>Face sensation and taste</td></tr>
<tr><td>LGN / MGN</td><td>Vision / hearing</td></tr><tr><td>VL / VA</td><td>Motor loops from basal ganglia and cerebellum (VIM is the essential tremor target)</td></tr>
<tr><td>Anterior, dorsomedial</td><td>Memory (Papez circuit); damaged in Korsakoff syndrome</td></tr></tbody></table>`},
{h:"CSF and the blood-brain barrier",html:`
<p>Choroid plexus makes about 500 mL of CSF a day. Flow: <b>lateral ventricles → foramina of Monro → third ventricle → cerebral aqueduct → fourth ventricle → foramina of Luschka and Magendie → subarachnoid space → arachnoid granulations → dural venous sinuses</b>. A block anywhere inside this path enlarges only the ventricles upstream (aqueductal stenosis: lateral and third enlarged, fourth normal). Failed absorption at the granulations (after meningitis or SAH) enlarges all four.</p>
<ul><li>The blood-brain barrier is endothelial tight junctions. <b>Area postrema</b> (vomiting center), OVLT, and posterior pituitary lack it.</li>
<li><b>Levodopa</b> crosses on the large neutral amino acid transporter (protein meals compete); dopamine does not. <b>Carbidopa</b> stays outside the brain and blocks peripheral conversion, which allows lower doses and less nausea.</li>
<li>Vasogenic edema is barrier breakdown (tumor, abscess) and responds to steroids; cytotoxic edema is cell swelling (ischemia) and does not.</li></ul>`},
{h:"Antiseizure drug mechanisms",html:`
<table><thead><tr><th>Mechanism</th><th>Drugs</th><th>Why it matters</th></tr></thead><tbody>
<tr><td>Sodium channel inactivation</td><td>Phenytoin, carbamazepine, oxcarbazepine, lamotrigine, lacosamide</td><td>Good for focal seizures; can worsen absence and myoclonic seizures and Dravet syndrome</td></tr>
<tr><td>T-type Ca²⁺ channel (thalamus)</td><td>Ethosuximide (valproate also)</td><td>Thalamocortical rhythm drives absence seizures</td></tr>
<tr><td>GABA-A receptor</td><td>Benzodiazepines (↑ opening frequency), barbiturates (↑ opening duration)</td><td>Status epilepticus; withdrawal seizures if stopped abruptly</td></tr>
<tr><td>GABA metabolism and reuptake</td><td>Vigabatrin (irreversible GABA transaminase inhibitor), tiagabine (GAT-1 reuptake)</td><td>Vigabatrin for infantile spasms in tuberous sclerosis; visual field loss</td></tr>
<tr><td>Synaptic vesicle protein SV2A</td><td>Levetiracetam, brivaracetam</td><td>Few interactions; mood and irritability effects</td></tr>
<tr><td>α2δ subunit of Ca²⁺ channels</td><td>Gabapentin, pregabalin</td><td>Mainly neuropathic pain and RLS</td></tr>
<tr><td>Several at once</td><td>Valproate (Na⁺, T-type Ca²⁺, ↑GABA); topiramate (Na⁺, GABA, AMPA, carbonic anhydrase)</td><td>Broad spectrum; topiramate's carbonic anhydrase block causes stones and acidosis</td></tr></tbody></table>`},
{h:"Movement, dementia and migraine drugs",html:`
<table><thead><tr><th>Drug</th><th>Mechanism</th></tr></thead><tbody>
<tr><td>Levodopa + carbidopa</td><td>Dopamine precursor + peripheral DOPA decarboxylase inhibitor</td></tr>
<tr><td>Pramipexole, ropinirole</td><td>Direct D2/D3 agonists (impulse control disorders)</td></tr>
<tr><td>Selegiline, rasagiline</td><td>MAO-B inhibitors: slow dopamine breakdown</td></tr>
<tr><td>Entacapone, opicapone (tolcapone)</td><td>COMT inhibitors: prolong each levodopa dose (tolcapone is hepatotoxic)</td></tr>
<tr><td>Amantadine</td><td>NMDA antagonist and dopamine release; treats dyskinesia</td></tr>
<tr><td>Benztropine, trihexyphenidyl</td><td>Muscarinic antagonists: tremor, acute dystonia</td></tr>
<tr><td>Tetrabenazine, deutetrabenazine, valbenazine</td><td>VMAT2 inhibitors deplete presynaptic dopamine: chorea, tardive dyskinesia</td></tr>
<tr><td>Donepezil, rivastigmine, galantamine</td><td>Acetylcholinesterase inhibitors (bradycardia, GI effects)</td></tr>
<tr><td>Memantine</td><td>NMDA receptor antagonist</td></tr>
<tr><td>Lecanemab, donanemab</td><td>Antibodies that clear amyloid plaque (ARIA risk)</td></tr>
<tr><td>Triptans</td><td>5-HT1B/1D agonists: cranial vasoconstriction and less CGRP release</td></tr>
<tr><td>Lasmiditan</td><td>5-HT1F agonist without vasoconstriction</td></tr>
<tr><td>Gepants; CGRP monoclonals</td><td>Block the CGRP receptor or its ligand</td></tr></tbody></table>`},
{h:"Neuromuscular, spasticity and MS drugs",html:`
<table><thead><tr><th>Drug</th><th>Mechanism</th></tr></thead><tbody>
<tr><td>Pyridostigmine</td><td>Reversible acetylcholinesterase inhibitor (no CNS entry)</td></tr>
<tr><td>Amifampridine</td><td>Presynaptic K⁺ channel blocker → longer depolarization → more ACh release</td></tr>
<tr><td>Botulinum toxin</td><td>Cleaves SNARE proteins → blocks ACh release (dystonia, spasticity, migraine, sialorrhea)</td></tr>
<tr><td>Baclofen</td><td>GABA-B agonist; abrupt intrathecal withdrawal → seizures, hyperthermia, rigidity</td></tr>
<tr><td>Tizanidine</td><td>Central α2 agonist (hypotension, liver injury)</td></tr>
<tr><td>Dantrolene</td><td>Blocks ryanodine receptor Ca²⁺ release in muscle</td></tr>
<tr><td>Riluzole</td><td>Reduces glutamate release (ALS)</td></tr>
<tr><td>Nusinersen; risdiplam; onasemnogene</td><td>Antisense oligonucleotide and small molecule that fix SMN2 splicing; gene replacement of SMN1</td></tr>
<tr><td>Eculizumab, ravulizumab</td><td>Complement C5 inhibitors (MG, NMOSD); require meningococcal vaccination</td></tr>
<tr><td>Efgartigimod</td><td>FcRn blocker: lowers IgG including pathogenic antibodies</td></tr>
<tr><td>Natalizumab</td><td>Anti-α4 integrin: lymphocytes can't cross into the CNS (PML)</td></tr>
<tr><td>Fingolimod, siponimod</td><td>S1P receptor modulators: lymphocytes trapped in nodes (first-dose bradycardia)</td></tr>
<tr><td>Ocrelizumab, ofatumumab</td><td>Anti-CD20 B-cell depletion</td></tr>
<tr><td>Glatiramer acetate</td><td>Myelin basic protein mimic that shifts T cells toward a regulatory response</td></tr>
<tr><td>Teriflunomide</td><td>Blocks dihydroorotate dehydrogenase (pyrimidine synthesis); teratogenic</td></tr></tbody></table>`},
{h:"Receptor side-effect patterns",html:`
<ul><li><b>Muscarinic blockade</b> (TCAs, diphenhydramine, oxybutynin, benztropine): dry mouth, urinary retention, constipation, tachycardia, mydriasis, confusion in older adults.</li>
<li><b>D2 blockade</b> (antipsychotics, metoclopramide): parkinsonism, acute dystonia, akathisia, tardive dyskinesia, hyperprolactinemia, NMS.</li>
<li><b>H1 blockade</b>: sedation, weight gain. <b>α1 blockade</b>: orthostatic hypotension.</li></ul>`}],
pearls:[
["Nucleus that loses cholinergic neurons in Alzheimer disease","Nucleus basalis of Meynert"],["Source of norepinephrine","Locus coeruleus"],["Hypothalamic neurons lost in narcolepsy","Lateral hypothalamic hypocretin (orexin) neurons"],
["Why the cerebellum controls the same side","Its output crosses, then the corticospinal tract crosses back"],["Aqueductal stenosis: which ventricles enlarge","Lateral and third; fourth is normal"],
["Brain area without a blood-brain barrier that triggers vomiting","Area postrema"],["Why carbidopa is given with levodopa","Blocks peripheral DOPA decarboxylase: more levodopa reaches the brain, less nausea"],
["Ethosuximide mechanism","Blocks thalamic T-type calcium channels"],["Benzodiazepines vs barbiturates at GABA-A","Increase opening frequency vs duration"],
["Vigabatrin mechanism","Irreversibly inhibits GABA transaminase"],["Levetiracetam target","SV2A synaptic vesicle protein"],["Natalizumab mechanism","Blocks α4 integrin so lymphocytes can't enter the CNS"],
["Drug class for tardive dyskinesia","VMAT2 inhibitors"],["Amifampridine mechanism","Blocks presynaptic K⁺ channels → more ACh release"]]},

{id:"prevention",cat:"found",title:"Prevention, screening & well care",
summary:"The well-care share of the outline: stroke prevention, pregnancy planning, vaccines with neurologic payoffs, injury and fall prevention, and the developmental and newborn screens.",
sections:[
{h:"Stroke prevention",html:`
<ul><li><b>Hypertension</b> is the largest modifiable risk factor; also smoking, diabetes, lipids (statin by cardiovascular risk), inactivity, obesity, heavy alcohol.</li>
<li><b>Atrial fibrillation</b>: anticoagulate by CHA₂DS₂-VASc (score ≥2 in men or ≥3 in women); DOAC preferred unless mechanical valve or moderate-severe mitral stenosis.</li>
<li><b>Aspirin for primary prevention</b> is no longer routine; don't start it in adults ≥60 for primary prevention, and decide individually in younger adults at high cardiovascular risk.</li>
<li><b>Do not screen</b> asymptomatic adults in the general population for carotid stenosis.</li>
<li><b>Sickle cell disease</b>: annual transcranial Doppler from age 2 to 16; chronic transfusion if velocities are high.</li></ul>`},
{h:"Pregnancy planning",html:`
<ul><li><b>Folic acid</b> 0.4–0.8 mg daily for anyone who could become pregnant; 4 mg after a prior neural tube defect.</li>
<li>Epilepsy: switch from valproate before conception (lamotrigine or levetiracetam), monitor lamotrigine levels, discuss contraception interactions with enzyme inducers.</li>
<li>Migraine with aura: avoid estrogen-containing contraception. MS: plan disease-modifying therapy around pregnancy; relapses fall during pregnancy and rise postpartum.</li></ul>`},
{h:"Vaccines with neurologic payoffs",html:`
<table><thead><tr><th>Vaccine</th><th>Prevents</th></tr></thead><tbody>
<tr><td>Hib, pneumococcal</td><td>Bacterial meningitis in children (and older adults for pneumococcal)</td></tr>
<tr><td>Meningococcal (MenACWY at 11–12 with a booster at 16; MenB by shared decision)</td><td>Meningococcal disease; also required for asplenia, complement deficiency, and <b>before eculizumab or ravulizumab</b></td></tr>
<tr><td>Recombinant zoster (adults ≥50)</td><td>Shingles and postherpetic neuralgia</td></tr>
<tr><td>Measles</td><td>Measles encephalitis and later SSPE</td></tr>
<tr><td>Polio</td><td>Paralytic poliomyelitis</td></tr>
<tr><td>Tetanus (Td/Tdap every 10 years; booster for a dirty wound if &gt;5 years)</td><td>Tetanus</td></tr>
<tr><td>Rabies post-exposure (immune globulin + vaccine)</td><td>Rabies after a bat or high-risk animal exposure</td></tr></tbody></table>`},
{h:"Injury and fall prevention",html:`
<ul><li>Helmets for bicycles and motorcycles, seat belts, age-appropriate car seats, safe firearm storage, water safety for people with epilepsy.</li>
<li><b>Falls in older adults</b>: ask about falls every year; check gait (timed up and go), orthostatic vitals, vision, feet, cognition, and medications (sedatives, anticholinergics, antihypertensives). <b>Exercise and physical therapy</b> have the best evidence. Vitamin D helps only when deficient.</li>
<li>Concussion: education, rule enforcement, and no same-day return to play.</li></ul>`},
{h:"Screening and surveillance",html:`
<ul><li><b>Newborn</b>: hearing screen; metabolic screen (PKU and others); SMA and, in many states, X-linked adrenoleukodystrophy.</li>
<li><b>Development</b>: surveillance at every visit, standardized screening at 9, 18 and 30 months, and <b>autism-specific screening at 18 and 24 months</b>. Refer to early intervention without waiting for a diagnosis.</li>
<li>Lead screening at 12 and 24 months for children at risk or on Medicaid.</li>
<li>Diabetes: annual monofilament foot exam.</li>
<li>Older adults: routine cognitive screening of people without symptoms isn't supported by evidence, but evaluate any concern from the patient, family, or clinician. Correct hearing loss; it is a modifiable dementia risk factor.</li></ul>`},
{h:"Normal aging",html:`<p>See <b>Lesion localization &amp; the exam</b> for exam findings that are normal in older adults (reduced toe vibration and ankle reflexes, mild upgaze limitation, slower processing with preserved function).</p>`}],

["Vaccine that prevents postherpetic neuralgia","Recombinant zoster vaccine (adults ≥50)"],["Autism-specific screening ages","18 and 24 months"],

{id:"syncope",cat:"parox",title:"Syncope, dizziness & gait",
summary:"Transient loss of consciousness that isn't a seizure, orthostatic hypotension and POTS, sorting the dizzy patient, and reading a gait from across the room.",
sections:[
{h:"Types of syncope",html:`
<table><thead><tr><th>Type</th><th>Clues</th></tr></thead><tbody>
<tr><td><b>Reflex</b>: vasovagal, situational, carotid sinus</td><td>Trigger (standing, pain, blood, micturition, cough, head turning or shaving in an older man), prodrome of warmth, nausea, sweating, pallor; quick recovery</td></tr>
<tr><td><b>Orthostatic</b></td><td>On standing; volume loss, drugs (antihypertensives, diuretics, α-blockers, nitrates, TCAs), or <b>autonomic failure</b> (Parkinson disease, MSA, Lewy body dementia, diabetes, amyloidosis)</td></tr>
<tr><td><b>Cardiac</b></td><td>No prodrome, during exertion or supine, palpitations, chest pain, structural heart disease, abnormal ECG, family history of sudden death (long QT, Brugada, HCM, WPW, aortic stenosis, heart block)</td></tr></tbody></table>
<div class="hy"><p>Everyone gets a history, exam, <b>orthostatic vitals and an ECG</b>. Echo for a murmur or suspected structural disease; ambulatory rhythm monitoring matched to how often events happen; tilt table for recurrent unexplained reflex syncope. Head CT, carotid ultrasound, and EEG are not routine without neurologic features.</p></div>
<div class="warn"><p>Admit with telemetry for exertional or supine syncope, chest pain, heart failure or structural disease, an abnormal ECG, no prodrome, or family history of sudden death.</p></div>`},
{h:"Orthostatic hypotension and POTS",html:`
<ul><li><b>Orthostatic hypotension</b>: fall of ≥20 mm Hg systolic or ≥10 diastolic within 3 minutes of standing. Neurogenic if heart rate rises less than about 15 beats/min.</li>
<li>Management: stop offending drugs, fluids and salt, compression stockings, head-of-bed elevation, rise slowly, counter-maneuvers. Drugs: fludrocortisone, midodrine (supine hypertension), droxidopa.</li>
<li><b>POTS</b>: sustained heart-rate rise ≥30 beats/min (≥40 in adolescents) within 10 minutes of standing, without orthostatic hypotension, for ≥3 months; usually young women, often after a viral illness. Fluids, salt, compression, graded recumbent exercise; low-dose β-blocker, fludrocortisone, midodrine, or ivabradine.</li>
<li>Reflex syncope: education, counterpressure maneuvers (leg crossing, hand gripping), hydration. Pacing for cardioinhibitory carotid sinus syncope.</li></ul>`},
{h:"The dizzy patient",html:`
<table><thead><tr><th>Complaint</th><th>Means</th><th>Think of</th></tr></thead><tbody>
<tr><td>Vertigo</td><td>Illusion of motion</td><td>BPPV, vestibular neuritis, Ménière, posterior circulation stroke (see Vertigo &amp; hearing loss)</td></tr>
<tr><td>Presyncope</td><td>About to faint</td><td>Orthostatic hypotension, arrhythmia, reflex syncope</td></tr>
<tr><td>Disequilibrium</td><td>Unsteady on the feet, not in the head</td><td>Neuropathy, cerebellar disease, multisensory loss in older adults, parkinsonism</td></tr>
<tr><td>Nonspecific lightheadedness</td><td>Vague, often with anxiety</td><td>Hyperventilation, medications, mood disorders</td></tr></tbody></table>
<p>Timing and triggers are more reliable than the patient's choice of words.</p>`},
{h:"Gait disorders",html:`
<table><thead><tr><th>Gait</th><th>Looks like</th><th>Localization and causes</th></tr></thead><tbody>
<tr><td>Hemiparetic</td><td>Leg circumducts, arm held flexed</td><td>Contralateral corticospinal: stroke</td></tr>
<tr><td>Spastic diplegic</td><td>Stiff legs, scissoring, toe walking</td><td>Bilateral corticospinal: cerebral palsy, myelopathy</td></tr>
<tr><td>Parkinsonian</td><td>Shuffling, festination, reduced arm swing, turns en bloc, freezing</td><td>Basal ganglia</td></tr>
<tr><td>Magnetic (apraxic)</td><td>Feet seem stuck to the floor; start hesitation</td><td>Frontal lobes: NPH, vascular disease</td></tr>
<tr><td>Cerebellar</td><td>Wide-based, staggering, can't tandem walk with eyes open</td><td>Cerebellum: alcohol, stroke, MS, degeneration</td></tr>
<tr><td>Sensory ataxic</td><td>Stomping, watches the ground, worse in the dark, Romberg positive</td><td>Dorsal columns or large-fiber nerves: B12, tabes, neuropathy</td></tr>
<tr><td>Steppage</td><td>High stepping to clear a dropped foot, foot slaps</td><td>Peroneal nerve, L5 root, CMT</td></tr>
<tr><td>Waddling (Trendelenburg)</td><td>Pelvis drops with each step</td><td>Hip girdle weakness: myopathy, muscular dystrophy</td></tr>
<tr><td>Functional</td><td>Bizarre, inconsistent, improves with distraction</td><td>Functional neurological disorder</td></tr></tbody></table>`}],
pearls:[
["Tests every syncope patient gets","Orthostatic vitals and an ECG"],["Syncope during exertion with a systolic murmur","Aortic stenosis or HCM: echocardiogram"],
["Syncope while shaving or turning the head in an older man","Carotid sinus hypersensitivity"],["Orthostatic BP drop with almost no heart rate rise","Neurogenic orthostatic hypotension (autonomic failure)"],
["Young woman, HR rises 40 on standing, BP stable","POTS"],["Head CT for a simple faint with a normal exam?","No"],
["Feet seem glued to the floor","Magnetic gait: NPH or frontal disease"],["Stomping gait, worse in the dark","Sensory ataxia (dorsal columns or neuropathy)"],
["High-stepping gait with foot slap","Foot drop (peroneal neuropathy, L5, CMT)"],["Waddling gait in a boy with big calves","Duchenne muscular dystrophy"]]}
);
