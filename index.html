<script>/* topics-11.js */
// Additions to existing topics, filling gaps found in the coverage audit.
(function(){
const T=id=>NEURO.topics.find(t=>t.id===id);
const add=(id,sections,pearls)=>{const t=T(id);if(!t)return;t.sections.push(...sections);(t.pearls||(t.pearls=[])).push(...(pearls||[]))};

T("hyperkinetic").title="Tremor, chorea, dystonia, tics & ataxia";
add("hyperkinetic",[{h:"Ataxia",html:`
<p>First decide whether the ataxia is <b>cerebellar</b> (present with eyes open, dysmetria, nystagmus, dysarthria) or <b>sensory</b> (Romberg positive, lost proprioception). Then sort cerebellar ataxia by tempo.</p>
<table><thead><tr><th>Tempo</th><th>Causes</th></tr></thead><tbody>
<tr><td>Acute (minutes to days)</td><td>Cerebellar stroke or hemorrhage; intoxication (alcohol, phenytoin, carbamazepine, lithium, benzodiazepines); Wernicke; Miller Fisher; MS; acute cerebellar ataxia of childhood (post-varicella)</td></tr>
<tr><td>Subacute (weeks to months)</td><td>Posterior fossa tumor; paraneoplastic (anti-Yo, anti-Hu, anti-Tr); CJD; hypothyroidism; vitamin E or B1 deficiency; celiac disease</td></tr>
<tr><td>Chronic progressive</td><td>Alcoholic cerebellar degeneration (anterior vermis: wide-based gait, legs &gt; arms); multiple system atrophy (cerebellar type, with autonomic failure); spinocerebellar ataxias (autosomal dominant CAG repeats); Friedreich ataxia (autosomal recessive); ataxia-telangiectasia; fragile X tremor-ataxia syndrome (older male premutation carriers)</td></tr>
<tr><td>Episodic</td><td>Episodic ataxias (channelopathies, acetazolamide-responsive), basilar migraine, intermittent metabolic disorders</td></tr></tbody></table>
<p>Workup: MRI; drug levels; B12, vitamin E, TSH, celiac serology; alcohol history; paraneoplastic panel if subacute; genetic testing for a progressive familial pattern.</p>`}],
[["Wide-based gait with legs worse than arms in a man who drinks heavily","Alcoholic cerebellar (anterior vermis) degeneration"],["Grandfather of a boy with fragile X develops tremor and ataxia","Fragile X tremor-ataxia syndrome (premutation)"]]);

add("peds",[{h:"Neonatal neurology",html:`
<table><thead><tr><th>Problem</th><th>Key features</th></tr></thead><tbody>
<tr><td>Germinal matrix / intraventricular hemorrhage</td><td>Preterm (&lt;32 weeks or &lt;1500 g), usually in the first 72 hours; screening cranial ultrasound. Complications: posthemorrhagic hydrocephalus, periventricular hemorrhagic infarction. Antenatal steroids and delayed cord clamping lower the risk</td></tr>
<tr><td>Hypoxic-ischemic encephalopathy</td><td>Term or near-term infant after a sentinel event: low Apgars, severe acidosis, encephalopathy, seizures. <b>Therapeutic hypothermia started within 6 hours</b> (≥36 weeks) for 72 hours</td></tr>
<tr><td>Neonatal seizures</td><td>Often subtle (lip smacking, bicycling, eye deviation, apnea). Causes: HIE (most common), stroke, hemorrhage, hypoglycemia, hypocalcemia, hypomagnesemia, infection, inborn errors, pyridoxine dependency. Confirm with EEG; phenobarbital first-line</td></tr>
<tr><td>Jitteriness (not a seizure)</td><td>Stimulus-sensitive tremor that stops when the limb is held, no eye deviation or autonomic change</td></tr></tbody></table>
<table><thead><tr><th>Congenital infection</th><th>Neurologic signature</th></tr></thead><tbody>
<tr><td>CMV (most common)</td><td><b>Periventricular</b> calcifications, microcephaly, sensorineural hearing loss, chorioretinitis</td></tr>
<tr><td>Toxoplasmosis</td><td><b>Diffuse</b> parenchymal calcifications, hydrocephalus, chorioretinitis</td></tr>
<tr><td>Rubella</td><td>Cataracts, deafness, PDA, microcephaly</td></tr>
<tr><td>Zika</td><td>Severe microcephaly, subcortical calcifications</td></tr>
<tr><td>Neonatal HSV</td><td>Encephalitis at 1–3 weeks, ± vesicles; IV acyclovir</td></tr></tbody></table>`},
{h:"Developmental delay and autism",html:`
<ul><li><b>Global developmental delay</b> (≥2 domains, under age 5): hearing and vision testing, <b>chromosomal microarray</b> and <b>fragile X</b> testing first; MRI for an abnormal exam, abnormal head size, or seizures; metabolic studies and lead level as indicated. Refer to early intervention at once.</li>
<li><b>Autism spectrum disorder</b>: persistent social-communication deficits plus restricted, repetitive behaviors from early development. Red flags: no babbling, pointing or gesturing by 12 months; no single words by 16 months; no spontaneous two-word phrases by 24 months; <b>any loss of language or social skills</b>.</li>
<li>Autism workup: audiology, microarray, fragile X. Treatment: applied behavior analysis, speech and occupational therapy, educational support; risperidone or aripiprazole for severe irritability.</li>
<li>Regression in any domain is never benign; also consider Rett syndrome, Landau-Kleffner syndrome (acquired aphasia with epileptiform EEG), and leukodystrophies.</li></ul>`}],
[["Term infant, pH 6.8, encephalopathic at 2 hours","Therapeutic hypothermia within 6 hours"],["Periventricular calcifications + hearing loss in a newborn","Congenital CMV"],["Diffuse intracranial calcifications + hydrocephalus","Congenital toxoplasmosis"],["First genetic tests for global developmental delay","Chromosomal microarray and fragile X testing"],["Preterm infant screening for intraventricular hemorrhage","Cranial ultrasound"]]);

add("tumors",[{h:"Leptomeningeal disease and treatment effects",html:`
<ul><li><b>Leptomeningeal metastasis</b> (breast, lung, melanoma, leukemia, lymphoma): headache, <b>several cranial neuropathies at once</b>, radicular pain or cauda equina symptoms, hydrocephalus. MRI of the brain and whole spine with gadolinium; CSF cytology (repeat if negative). Poor prognosis; intrathecal or systemic therapy, radiation.</li>
<li><b>Radiation injury</b>: early edema; delayed <b>radiation necrosis</b> months to years later that mimics recurrence (perfusion MRI or PET to tell apart; steroids or bevacizumab); vasculopathy with strokes; cognitive decline; secondary meningiomas. Pseudoprogression can appear soon after chemoradiation for glioblastoma.</li>
<li><b>Immune checkpoint inhibitors</b>: myasthenia, myositis (often with myocarditis), Guillain-Barré, encephalitis. <b>CAR-T</b>: ICANS (aphasia, encephalopathy, seizures) treated with steroids.</li></ul>`}],
[["Breast cancer patient with facial numbness, diplopia, and leg radicular pain","Leptomeningeal metastasis: MRI brain and spine with contrast, CSF cytology"],["Enhancing lesion at the old radiation site a year later","Radiation necrosis vs recurrence (perfusion MRI or PET)"]]);

add("stroke",[{h:"Less common causes",html:`
<table><thead><tr><th>Cause</th><th>Clues</th><th>Note</th></tr></thead><tbody>
<tr><td>Infective endocarditis</td><td>Fever, murmur, injection drug use, multiple embolic infarcts, mycotic aneurysms</td><td><b>No thrombolysis or anticoagulation</b> for the emboli; blood cultures and antibiotics; thrombectomy can be considered</td></tr>
<tr><td>CADASIL (NOTCH3)</td><td>Migraine with aura, recurrent subcortical strokes, mood change, dementia; anterior temporal and external capsule white-matter lesions; family history</td><td>Autosomal dominant</td></tr>
<tr><td>Fibromuscular dysplasia</td><td>Young or middle-aged woman, renovascular hypertension, dissection, "string of beads"</td><td>Antiplatelet; screen renal arteries</td></tr>
<tr><td>Primary CNS vasculitis</td><td>Subacute headache, encephalopathy, multifocal infarcts of different ages; inflammatory CSF</td><td>Biopsy; steroids and cyclophosphamide</td></tr>
<tr><td>Antiphospholipid syndrome</td><td>Young stroke, miscarriages, livedo, thrombocytopenia</td><td><b>Warfarin</b>, not a DOAC</td></tr>
<tr><td>Cancer-associated (Trousseau)</td><td>Multiple territories, adenocarcinoma, high D-dimer</td><td>Treat the cancer; LMWH or DOAC</td></tr>
<tr><td>Sickle cell disease</td><td>Child or young adult; moyamoya pattern</td><td>Acute exchange transfusion</td></tr>
<tr><td>Fabry disease</td><td>Young adult with burning hand and foot pain, angiokeratomas, kidney disease, posterior circulation strokes</td><td>X-linked; enzyme replacement</td></tr></tbody></table>`},
{h:"Recovery and rehabilitation",html:`<ul><li>Mobilize once stable (very early intensive mobilization in the first 24 hours is not beneficial); PT, OT, and speech therapy; inpatient rehabilitation for those who can tolerate it.</li><li>Spasticity: stretching, splints, botulinum toxin, oral baclofen. Shoulder subluxation: support the arm.</li><li>Screen for depression (SSRIs), dysphagia, falls, and driving safety; continue secondary prevention.</li></ul>`}],
[["Sudden aphasia in a febrile injection drug user with a murmur","Septic embolism from endocarditis: no thrombolysis; cultures and antibiotics"],["Stroke with antiphospholipid syndrome: anticoagulant","Warfarin (not a DOAC)"],["Migraine with aura, subcortical strokes, early dementia, family history","CADASIL (NOTCH3)"]]);

add("muscle",[{h:"Myopathy mimics and rhabdomyolysis",html:`
<ul><li><b>Polymyalgia rheumatica</b>: age &gt;50, bilateral shoulder and hip girdle aching with morning stiffness, elevated ESR and CRP, <b>normal CK</b>, strength limited only by pain. Dramatic response to low-dose prednisone. Ask every patient about headache, jaw claudication, and vision (giant cell arteritis overlap).</li>
<li><b>Fibromyalgia</b>: widespread pain, normal strength and CK.</li>
<li><b>Rhabdomyolysis</b>: CK above about 5 times normal (often far higher), muscle pain, tea-colored urine positive for blood on dipstick without red cells. Causes: crush, extreme exertion, seizures, hyperthermia syndromes, drugs (statins, cocaine), hypokalemia, metabolic myopathies. Aggressive IV fluids; watch potassium and kidney function.</li></ul>`}],
[["Shoulder and hip stiffness, ESR 70, normal CK, age 72","Polymyalgia rheumatica: low-dose prednisone; ask about GCA symptoms"],["Dipstick positive for blood, no RBCs on microscopy, CK 40,000","Rhabdomyolysis (myoglobinuria): IV fluids"]]);

add("infections",[{h:"Other infections to know",html:`
<ul><li><b>Herpes zoster ophthalmicus</b>: V1 rash; vesicles on the nasal tip (<b>Hutchinson sign</b>) predict eye involvement → oral antivirals and urgent ophthalmology. VZV vasculopathy can cause stroke weeks later.</li>
<li><b>HTLV-1</b>: slowly progressive spastic paraparesis with bladder symptoms in someone from the Caribbean, Japan, or South America.</li>
<li><b>Spinal tuberculosis (Pott disease)</b>: thoracic vertebral destruction with gibbus deformity and cord compression.</li>
<li><b>Leprosy</b>: thickened peripheral nerves (ulnar, peroneal), hypopigmented anesthetic skin patches; a leading cause of neuropathy worldwide.</li>
<li><b>Whipple disease</b>: dementia, supranuclear gaze palsy, oculomasticatory myorhythmia, with diarrhea, weight loss, arthralgia; PAS-positive macrophages.</li>
<li><b>Trichinosis</b>: myositis, periorbital edema, eosinophilia after undercooked pork or game.</li>
<li><b>Tick paralysis</b>: ascending paralysis in a child; remove the tick.</li></ul>`}],
[["Shingles rash on the forehead with vesicles on the nose tip","Hutchinson sign: zoster ophthalmicus likely to involve the eye"],["Slowly progressive spastic paraparesis in a woman from Jamaica","HTLV-1 myelopathy"]]);

add("cord",[{h:"Other myelopathies",html:`
<ul><li><b>Spinal dural arteriovenous fistula</b>: older man with progressive or stepwise leg weakness, sensory loss, and bladder symptoms worse with exertion; cord edema and dilated surface veins (flow voids) on MRI. Spinal angiography; endovascular or surgical closure. Steroids can worsen it.</li>
<li><b>Hereditary spastic paraplegia</b>: slowly progressive spastic legs with family history, little sensory loss.</li>
<li><b>Tethered cord</b>: back pain, leg weakness, bladder dysfunction, foot deformity; skin markers over the lower spine; worsens with growth spurts.</li>
<li><b>Radiation myelopathy</b>, <b>HTLV-1</b>, <b>copper deficiency</b>, <b>MS and NMOSD</b> (see their topics).</li></ul>`}],
[["Older man with myelopathy worse after walking, MRI cord edema with flow voids","Spinal dural arteriovenous fistula"]]);
})();

</script>
<script>/* questions-5.js */
NEURO.questions.push(
{t:"neuroscience",stem:"A 7-year-old girl with childhood absence epilepsy is started on ethosuximide, and her staring spells stop. Blockade of which target most directly explains the drug's effect?",
opts:["Voltage-gated sodium channels in cortical neurons","T-type calcium channels in thalamic neurons","GABA-A receptor chloride channels","Synaptic vesicle protein SV2A","GABA transaminase"],a:1,
exp:"<p>Absence seizures arise from thalamocortical oscillations driven by <b>T-type calcium currents in thalamic relay neurons</b>; ethosuximide blocks them. Sodium channel blockers (carbamazepine, phenytoin) can worsen absence seizures. Benzodiazepines act at GABA-A, levetiracetam at SV2A, vigabatrin on GABA transaminase.</p>"},
{t:"neuroscience",stem:"A 68-year-old man with Parkinson disease is switched from levodopa alone to carbidopa-levodopa. His nausea resolves and he needs a much lower levodopa dose. What is the mechanism of carbidopa?",
opts:["Inhibits MAO-B in the striatum","Inhibits catechol-O-methyltransferase in the brain","Directly stimulates D2 receptors","Inhibits peripheral aromatic L-amino acid (DOPA) decarboxylase","Increases levodopa transport across the blood-brain barrier"],a:3,
exp:"<p>Carbidopa does not cross the blood-brain barrier. It blocks <b>peripheral DOPA decarboxylase</b>, so less levodopa is converted to dopamine outside the brain (less nausea and hypotension from area postrema and vascular effects) and more reaches the CNS. Entacapone inhibits COMT; selegiline and rasagiline inhibit MAO-B.</p>"},
{t:"neuroscience",stem:"A 6-month-old boy has an enlarging head circumference, a bulging fontanelle, and impaired upgaze. MRI shows marked enlargement of the lateral and third ventricles; the fourth ventricle is normal in size. Where is the obstruction most likely located?",
opts:["Foramina of Monro","Cerebral aqueduct","Foramina of Luschka and Magendie","Arachnoid granulations","Choroid plexus"],a:1,
exp:"<p>Ventricles upstream of a block enlarge and downstream ones do not. Large lateral and third ventricles with a normal fourth ventricle place the block at the <b>cerebral aqueduct</b> (aqueductal stenosis), the most common cause of congenital obstructive hydrocephalus. Dilation of the aqueduct region compresses the dorsal midbrain, causing upgaze palsy. Failed absorption at the arachnoid granulations would enlarge all four ventricles.</p>"},
{t:"prevention",stem:"A healthy 70-year-old man asks whether he should have a carotid ultrasound because his neighbor had a stroke. He has never had neurologic symptoms. BP is 128/78 mm Hg on lisinopril, and he takes a statin. There is no carotid bruit. Which is the most appropriate recommendation?",
opts:["Carotid duplex ultrasound now","CT angiography of the head and neck","Carotid duplex every 5 years","No carotid screening; continue risk factor management","Start aspirin and clopidogrel"],a:3,
exp:"<p>Screening asymptomatic adults in the general population for carotid stenosis is <b>not recommended</b>: the yield is low, and false positives lead to procedures with stroke and death risks. Focus on blood pressure, lipids, smoking, diabetes, and exercise. Dual antiplatelet therapy is for minor stroke or high-risk TIA.</p>"},
{t:"prevention",stem:"A 41-year-old woman with generalized AChR-antibody-positive myasthenia gravis that is refractory to prednisone and azathioprine is going to start eculizumab. Which of the following must be done before the first dose if possible?",
opts:["Tuberculosis skin test","Meningococcal vaccination","Hepatitis B vaccination","Pneumocystis prophylaxis","Varicella antibody testing"],a:1,
exp:"<p>Eculizumab and ravulizumab block complement C5, the step that forms the membrane attack complex needed to kill <i>Neisseria</i>. Patients have a markedly higher risk of meningococcal infection and must receive <b>meningococcal vaccines</b> (ACWY and B) ideally at least 2 weeks before the first dose, with antibiotic prophylaxis if treatment can't wait.</p>"},
{t:"syncope",stem:"A 22-year-old woman faints while having blood drawn. She felt warm, nauseated and lightheaded, her vision grayed, and she slumped to the floor. Bystanders saw a few jerks of her arms lasting several seconds. She was fully oriented within a minute. Exam, orthostatic vital signs, and ECG are normal. Which is the most appropriate next step?",
opts:["Echocardiography","EEG","CT of the head","48-hour Holter monitor","Reassurance and education about triggers and counterpressure maneuvers"],a:4,
exp:"<p>A clear trigger, typical prodrome, and immediate recovery indicate <b>vasovagal syncope</b>. Brief myoclonic jerks are common with syncope and don't indicate a seizure. With a normal exam and ECG, no further testing is needed. Teach hydration, trigger avoidance, and counterpressure maneuvers (leg crossing, hand gripping).</p>"},
{t:"syncope",stem:"A 74-year-old man passed out while carrying groceries up the stairs, without warning. He has had exertional chest tightness for months. There is a harsh crescendo-decrescendo systolic murmur at the right upper sternal border radiating to the carotids, and the carotid upstroke is delayed. Which is the most appropriate next step?",
opts:["Tilt-table testing","Transthoracic echocardiography","Carotid duplex ultrasound","EEG","MRI of the brain"],a:1,
exp:"<p>Exertional syncope without prodrome, angina, and the murmur of <b>aortic stenosis</b> indicate cardiac syncope, a high-risk feature. Get an <b>echocardiogram</b> (and admit with telemetry); symptomatic severe aortic stenosis needs valve replacement. Carotid imaging and EEG are not part of a syncope workup without neurologic features.</p>"},
{t:"syncope",stem:"A 70-year-old man with Parkinson disease for 6 years reports lightheadedness and blurred vision within a minute of standing, especially after meals. Supine BP is 148/86 mm Hg with heart rate 68/min; after 3 minutes standing it is 108/70 mm Hg with heart rate 72/min. Which is the most likely mechanism?",
opts:["Vasovagal reflex","Volume depletion","Neurogenic orthostatic hypotension from autonomic failure","Postural orthostatic tachycardia syndrome","Paroxysmal arrhythmia"],a:2,
exp:"<p>A 40-mm Hg systolic drop with almost no compensatory heart-rate rise points to <b>neurogenic orthostatic hypotension</b>: failure of sympathetic vasoconstriction from autonomic involvement in synucleinopathies. Volume depletion would produce a brisk tachycardia. Management: review drugs (including levodopa and antihypertensives), fluids and salt, compression, then fludrocortisone, midodrine, or droxidopa.</p>"},
{t:"hyperkinetic",stem:"A 56-year-old man who has drunk heavily for 30 years has a slowly worsening, wide-based, unsteady gait. He cannot walk heel to toe. Finger-to-nose testing is nearly normal, but heel-to-shin testing is clumsy. Eye movements, mental status, and vibration sense are normal. Which is the most likely diagnosis?",
opts:["Wernicke encephalopathy","Alcoholic cerebellar degeneration","Subacute combined degeneration","Normal pressure hydrocephalus","Multiple system atrophy"],a:1,
exp:"<p>Chronic alcohol use damages the <b>anterior superior vermis</b>, producing gait and leg ataxia with relatively spared arms, speech, and eye movements. Wernicke encephalopathy is acute with confusion and ophthalmoplegia. Subacute combined degeneration is a sensory ataxia with lost vibration sense. NPH causes a magnetic gait with incontinence and cognitive change.</p>"},
{t:"peds",stem:"A term boy is born after a prolonged second stage with a nonreassuring fetal heart rate. Apgar scores are 2 and 4 at 1 and 5 minutes. Umbilical artery pH is 6.85. At 2 hours of age he is lethargic and hypotonic with weak suck and absent Moro reflex. Which is the most appropriate management?",
opts:["Therapeutic hypothermia started within 6 hours of birth","Phenobarbital prophylaxis","High-dose dexamethasone","IV mannitol","Observation; most infants recover fully"],a:0,
exp:"<p>Severe acidosis, low Apgars, and moderate to severe encephalopathy in an infant ≥36 weeks meet criteria for <b>hypoxic-ischemic encephalopathy</b>. <b>Therapeutic hypothermia</b> for 72 hours, started within 6 hours, reduces death and disability. Treat seizures if they occur (confirmed by EEG), but prophylactic antiseizure drugs, steroids, and mannitol do not help.</p>"},
{t:"muscle",stem:"A 72-year-old woman has 2 months of aching and stiffness in both shoulders and hips, worst in the morning for over an hour. She has trouble getting out of bed. Strength is normal when pain is accounted for. ESR is 70 mm/h; CK is normal. She has no headache, jaw pain, or visual symptoms. Which is the most appropriate treatment?",
opts:["High-dose prednisone 1 mg/kg","Low-dose prednisone (about 15 mg daily)","Methotrexate alone","IV immunoglobulin","Stop her statin and recheck CK"],a:1,
exp:"<p>This is <b>polymyalgia rheumatica</b>: proximal pain and stiffness, high inflammatory markers, normal CK. It responds dramatically to <b>low-dose prednisone</b>, then a slow taper. High doses are for giant cell arteritis, which occurs in a minority of PMR patients, so ask about headache, jaw claudication, and vision at every visit. Inflammatory myopathy would cause true weakness and an elevated CK.</p>"},
{t:"tumors",stem:"A 52-year-old woman with metastatic breast cancer has 3 weeks of headache, numbness of the left chin, double vision on right gaze, and shooting pain down the back of both legs. Strength is mildly reduced at both ankles. CT of the head is normal. Which is the most appropriate next step?",
opts:["MRI of the brain and entire spine with gadolinium, then lumbar puncture for cytology","Bone scan","Oral prednisone and follow-up in 2 weeks","EMG and nerve conduction studies","PET-CT only"],a:0,
exp:"<p>Several cranial neuropathies plus radicular pain in a patient with cancer suggest <b>leptomeningeal metastasis</b>. Image the brain and whole spine with contrast to look for leptomeningeal enhancement, then send CSF for cytology (repeat if negative, since a single sample misses many cases). Numb chin syndrome alone also warrants a search for metastatic disease.</p>"},
{t:"stroke",stem:"A 34-year-old man who injects heroin has had fevers for a week. He develops sudden right arm weakness and difficulty speaking 1 hour ago. Temperature is 38.9°C (102°F). There is a new holosystolic murmur and splinter hemorrhages. Noncontrast CT of the head shows no hemorrhage. Which is the most appropriate next step?",
opts:["IV alteplase","Heparin infusion","Blood cultures and empiric IV antibiotics, without thrombolysis","Aspirin 325 mg","Warfarin"],a:2,
exp:"<p>Stroke from <b>septic emboli in infective endocarditis</b> carries a high risk of hemorrhage (mycotic aneurysms, septic arteritis). Thrombolysis is contraindicated, and anticoagulation or antiplatelets are not given for the emboli. Draw blood cultures, start vancomycin plus a β-lactam, and evaluate the vessels; mechanical thrombectomy can be considered for a large-vessel occlusion.</p>"},
{t:"infections",stem:"A 68-year-old man has 2 days of burning pain over his right forehead and now a vesicular rash on the forehead and upper eyelid, plus several vesicles on the tip of his nose. His vision is normal. Which is the most appropriate management?",
opts:["Topical acyclovir alone","Oral prednisone alone","Reassurance; the rash will resolve","Oral valacyclovir and urgent ophthalmology evaluation","Recombinant zoster vaccine now"],a:3,
exp:"<p>Zoster in V1 is <b>herpes zoster ophthalmicus</b>. Vesicles on the nasal tip (<b>Hutchinson sign</b>, nasociliary branch) predict ocular involvement such as keratitis and uveitis. Start oral antivirals within 72 hours and arrange urgent slit-lamp examination. The vaccine prevents future episodes but is not treatment.</p>"}
);

<script>/* diagrams-1.js */
(function(){
const N=window.NEURO;

/* ---------- figure framework ---------- */
// Each figure: {place:[{t:topicId,s:sectionHeading}], html(), opts?:[{id,label,on:[regions],detail}], initial?, onPick?}
N.figsFor=(t,s)=>Object.keys(N.FIGS).filter(id=>(N.FIGS[id].place||[]).some(p=>p.t===t&&p.s===s));
N.figTag=id=>`<figure class="fig" data-fig="${id}"></figure>`;
N.mountFigures=root=>root.querySelectorAll("figure[data-fig]").forEach(el=>{
  if(el.dataset.ready)return; const f=N.FIGS[el.dataset.fig]; if(!f)return;
  el.innerHTML=f.html(); el.dataset.ready="1"; if(f.opts)chooser(el,f); if(f.mount)f.mount(el);
});
function chooser(el,f){
  const box=el.querySelector(".chips");
  box.innerHTML=f.opts.map(o=>`<button class="chip" data-opt="${o.id}">${o.label}</button>`).join("");
  const det=el.querySelector(".fig-detail");
  const show=o=>{const on=new Set(o.on||[]);
    el.querySelectorAll("[data-r]").forEach(n=>n.classList.toggle("on",n.dataset.r.split(" ").some(r=>on.has(r))));
    if(f.onPick)f.onPick(el,o);};
  // Quiz mode: the figure highlights a random option and the learner names it.
  let quiz=null;
  const pool=f.opts.filter(o=>(o.on&&o.on.length)||f.onPick);
  const bar=document.createElement("div");bar.className="fig-quiz";
  bar.innerHTML=`<button class="btn" data-q="start">Quiz me on this diagram</button><span class="fq-prompt"></span><span class="fq-score"></span><button class="btn primary" data-q="next" hidden>Next</button><button class="btn" data-q="stop" hidden>Exit quiz</button>`;
  if(pool.length>2)el.insertBefore(bar,box);
  const q=s=>bar.querySelector(s);
  const ask=()=>{let t;do{t=pool[Math.floor(Math.random()*pool.length)]}while(quiz.target&&t.id===quiz.target.id);
    quiz.target=t;quiz.answered=false;
    box.querySelectorAll("[data-opt]").forEach(b=>{b.classList.remove("ok","bad");b.setAttribute("aria-pressed","false")});
    show(t);if(det)det.innerHTML="";q(".fq-prompt").textContent="What does the diagram show? Choose a button below.";q("[data-q=next]").hidden=true;};
  const pick=id=>{const o=f.opts.find(x=>x.id===id); if(!o)return;
    if(quiz){if(quiz.answered)return;quiz.answered=true;quiz.total++;const ok=id===quiz.target.id;if(ok)quiz.right++;
      box.querySelectorAll("[data-opt]").forEach(b=>{b.classList.toggle("ok",b.dataset.opt===quiz.target.id);b.classList.toggle("bad",!ok&&b.dataset.opt===id)});
      if(det)det.innerHTML=`<p class="ck-fb ${ok?"ok":"bad"}" style="margin:0 0 6px">${ok?"Correct":"Not quite"}: ${quiz.target.label}</p>${quiz.target.detail||""}`;
      q(".fq-prompt").textContent="";q(".fq-score").textContent=`${quiz.right}/${quiz.total} correct`;q("[data-q=next]").hidden=false;return;}
    box.querySelectorAll("[data-opt]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.opt===id));
    show(o);if(det)det.innerHTML=o.detail||"";};
  bar.addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(!b)return;
    if(b.dataset.q==="start"){quiz={right:0,total:0,target:null};q("[data-q=start]").hidden=true;q("[data-q=stop]").hidden=false;ask();}
    else if(b.dataset.q==="next")ask();
    else{quiz=null;q("[data-q=start]").hidden=false;q("[data-q=stop]").hidden=true;q("[data-q=next]").hidden=true;q(".fq-prompt").textContent="";q(".fq-score").textContent="";
      box.querySelectorAll("[data-opt]").forEach(x=>x.classList.remove("ok","bad"));pick(f.initial||f.opts[0].id);}});
  box.addEventListener("click",e=>{const b=e.target.closest("[data-opt]");if(b)pick(b.dataset.opt)});
  el.querySelectorAll("[data-pick]").forEach(n=>{n.setAttribute("tabindex","0");n.setAttribute("role","button");
    n.addEventListener("click",()=>pick(n.dataset.pick));
    n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(n.dataset.pick)}})});
  pick(f.initial||f.opts[0].id);
}

/* ---------- neuromuscular junction ---------- */
N.fig("nmj",{place:[{t:"nmj",s:"Myasthenia gravis"}],

${B("cx",250,14,140,"Cortex")}${B("snc",24,98,110,"SNc")}${B("d1",170,98,140,"Striatum D1")}${B("d2",390,98,140,"Striatum D2")}
${B("gpe",390,180,140,"GPe")}${B("stn",390,262,140,"STN")}${B("gpi",170,262,140,"GPi / SNr")}${B("thal",170,330,140,"Thalamus")}
<g class="ts"><text x="248" y="204">direct</text><text x="470" y="160">indirect</text><text x="140" y="108">D1</text><text x="300" y="176">D2</text><text x="20" y="200" transform="rotate(-90 20 200)" text-anchor="middle">thalamocortical drive</text></g>

opts:[

<script>/* diagrams-3.js */

svg:`<svg viewBox="0 0 640 310" role="img" aria-label="Horizontal gaze circuit for looking right: left frontal eye field to right PPRF, right abducens nucleus to the right lateral rectus, and interneurons crossing into the left MLF to the left oculomotor nucleus and left medial rectus">

<circle cx="292" cy="128" r="12" class="bx"/><circle cx="348" cy="128" r="12" class="bx"/><circle cx="276" cy="212" r="12" class="bx"/><circle cx="364" cy="212" r="12" class="bx" data-r="r6"/>

caption:"<b>The abducens nucleus drives both eyes.</b> It holds motor neurons for the same-side lateral rectus and interneurons that cross and climb the opposite MLF to the medial rectus subnucleus of CN III. Cutting the MLF disconnects only adduction on that side; destroying the nucleus abolishes gaze to that side in both eyes."}),
opts:[
{id:"n",label:"Normal right gaze",on:[],detail:"<p>Left frontal eye field → right PPRF → right VI nucleus → right lateral rectus (abducts) and, via the left MLF, left medial rectus (adducts).</p>"},
{id:"ino",label:"Left INO",on:["xmlf","lmr"],detail:N.list("Left MLF lesion (MS in the young, stroke in the old).",[["Looking right","left eye fails to adduct; right eye abducts with nystagmus"],["Convergence","intact, because CN III and the medial rectus work"]])},
{id:"r6",label:"Right VI nucleus",on:["xr6","rlr","lmr"],detail:N.list("",[["Right horizontal gaze palsy","neither eye moves right, even with doll's eyes or calorics"],["Neighbors","often an ipsilateral LMN facial palsy (the VII fascicle loops around the nucleus)"]])},
{id:"r6n",label:"Right CN VI nerve",on:["xr6n","rlr"],detail:N.list("",[["Right eye only","fails to abduct; horizontal diplopia worse looking right and at distance"],["Causes","microvascular, raised ICP (false localizing), cavernous sinus, Gradenigo"]])},

{id:"oah",label:"One-and-a-half",on:["xr6","xrmlf","rlr","lmr","rmr"],detail:N.list("Right VI nucleus (or PPRF) plus right MLF.",[["Looking right","neither eye moves (the 'one')"],["Looking left","right eye can't adduct (the 'half')"],["Only movement left","left eye abduction, with nystagmus"]])},

<script>/* diagrams-4.js */
(function(){

/* ---------- EEG renderings (synthetic, drawn from formulas) ---------- */

const g=(p,m,s)=>Math.exp(-((p-m)**2)/(2*s*s));
const TAU=Math.PI*2;
const EEG={
 normal:{labels:["Frontal","Central","Parietal","Occipital"],f:(t,c,r)=>(c>=2?0.95:0.25)*Math.sin(TAU*10*t+c)+0.18*Math.sin(TAU*19*t+c*2)+0.12*(r()-.5)},
 absence:{labels:["Frontal","Central","Temporal","Occipital"],f:(t,c,r)=>{const bg=0.3*Math.sin(TAU*9*t+c)+0.15*(r()-.5);if(t<1.5||t>4.5)return bg;const p=((t-1.5)*3)%1,a=[1.25,1.1,0.95,0.8][c];return a*(2.1*g(p,0.05,0.018)-1.5*Math.sin(Math.PI*Math.min(1,Math.max(0,(p-0.14)/0.8))))+0.08*(r()-.5)}},
 hyps:{labels:["Frontal","Central","Temporal","Occipital"],seed:7,f:(t,c,r,S)=>{let v=0;S[c].w.forEach(([fr,ph,a])=>v+=a*Math.sin(TAU*fr*t+ph));S[c].sp.forEach(ts=>v+=2.4*g(t,ts,0.018)-1.2*g(t,ts+0.06,0.04));return 0.75*v+0.2*(r()-.5)}},
 triph:{labels:["Frontal","Central","Parietal","Occipital"],f:(t,c,r)=>{const p=((t-c*0.03)/0.55)%1;return 0.2*Math.sin(TAU*6*t+c)-0.5*g(p,0.08,0.03)+1.9*g(p,0.16,0.045)-0.9*g(p,0.32,0.08)+0.08*(r()-.5)}},
 cjd:{labels:["Frontal","Central","Parietal","Occipital"],f:(t,c,r)=>{const p=(t%1.0);return 0.18*Math.sin(TAU*3*t+c)+1.7*g(p,0.06,0.022)-0.7*g(p,0.14,0.045)+0.08*(r()-.5)}},
 pleds:{labels:["L frontotemporal","L temporal","R temporal","R frontotemporal"],f:(t,c,r)=>{const bg=0.35*Math.sin(TAU*4*t+c*1.7)+0.15*(r()-.5);if(c>1)return bg*0.8+0.2*Math.sin(TAU*9*t);const p=(t%1.4)/1.4,a=c?1.9:1.2;return bg+a*(1.6*g(p,0.04,0.016)-0.8*g(p,0.1,0.035))}}

    else ctl=`<input class="bl" data-k="${k}" value="${esc(val)}" size="${Math.min(30,Math.max(6,b.ans.length+1))}" ${ok?"readonly":""} aria-label="Missing term" autocomplete="off" spellcheck="false">`;
    const mark=done?`<button class="mk ${ok?"ok":"bad"}" data-mk="${k}" title="${ok?"Counted correct. Click to mark it wrong":"Counted wrong. Click if your answer means the same thing"}">${ok?"✓":"✗"}</button>`:"";
    return `<span class="slot ${done?(ok?"ok":"bad"):""}">${ctl}${mark}${done&&!ok?`<span class="bl-ans">${esc(b.ans)}</span>`:""}</span>`;
  }
  function drawTest(){
    const si=Math.min(M.si,t.sections.length-1),R=rec(M,si),T=buildTest(t,si),box=stage.querySelector("#rx");
    const right=R.res?Object.values(R.res).filter(Boolean).length:0,total=T.blanks.length;
    if(!total){ // nothing to blank: free recall, then compare
      box.innerHTML=`<p><b>Recall this section.</b> Write the key points from memory, then compare.</p><textarea class="rc-in" id="free" rows="5">${esc(R.free||"")}</textarea>
      ${R.first?`<div class="sec-body" style="margin-top:12px">${wrapTables(t.sections[si].html)}</div><p class="ck-fb ${R.first[0]?"ok":"bad"}">${R.first[0]?"You recalled most of it.":"Marked for review."}</p>`:
      '<div class="topic-actions"><button class="btn primary" id="cmp">Compare with the section</button></div>'}<div id="selfBox"></div>`;
      box.querySelector("#free").oninput=e=>{R.free=e.target.value;saveSoon()};
      const c=box.querySelector("#cmp");if(c)c.onclick=()=>{box.querySelector("#selfBox").innerHTML=`<div class="sec-body" style="margin-top:12px">${wrapTables(t.sections[si].html)}</div><div class="topic-actions"><button class="btn" data-self="0">I missed a lot</button><button class="btn primary" data-self="1">I got most of it</button></div>`;
        c.remove();box.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{R.first=R.last=[+b.dataset.self,1];R.checks=1;save();drawTest()})};
      nav(si,R);return;
    }
    const html=T.html.replace(/<span data-slot="([^"]+)"><\/span>/g,(m,k)=>slot(T,R,k));
    box.innerHTML=`<div class="rx-head"><span><b>Fill in every blank from memory</b>${T.tables.length?". In tables, the first column is given.":"."}</span><span class="rx-score">${R.res?`${right} of ${total} correct${R.first&&R.checks>1?` · first try ${pct(R.first)}%`:""}`:`${total} blanks`}</span></div>
    <div class="sec-body">${html}</div>
    <div class="topic-actions" style="margin-top:14px"><button class="btn primary" id="rxCheck">${R.res?"Check again":"Check answers"}</button>${R.res&&right<total?'<button class="btn" id="rxRetry">Clear the ones I missed</button>':""}<button class="btn" id="rxRead">Reread the section</button></div>
    ${R.res?'<p class="muted" style="font-size:13px;margin:8px 0 0">Wrong marks show the expected answer in green. If yours means the same thing, click its ✗ to count it.</p>':""}`;
    box.querySelectorAll(".tq-bar").forEach(bar=>{const ti=+bar.dataset.ti,mode=R.mode[ti]||"type";
      bar.innerHTML=`<span>Answer this table by</span><button class="chip" data-mode="type" aria-pressed="${mode==="type"}">typing</button><button class="chip" data-mode="pick" aria-pressed="${mode==="pick"}">picking from the column</button>`;
      bar.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{R.mode[ti]=b.dataset.mode;save();drawTest()});});
    box.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;
      const grow=()=>{if(el.tagName==="TEXTAREA"){el.style.height="auto";el.style.height=el.scrollHeight+"px"}};grow();
      el.addEventListener("input",()=>{R.ans[k]=el.value;grow();saveSoon()});el.addEventListener("change",()=>{R.ans[k]=el.value;saveSoon()});
      if(el.tagName==="INPUT")el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const all=[...box.querySelectorAll("[data-k]:not([readonly]):not([disabled])")];const n=all[all.indexOf(el)+1];n?n.focus():box.querySelector("#rxCheck").click()}});});
    box.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{const k=b.dataset.mk;R.res[k]=!R.res[k];R.ovr[k]=R.res[k];tally(R,T);save();drawTest()});
    box.querySelector("#rxCheck").onclick=()=>{const res={},lv=R.lastVal||{};
      T.blanks.forEach(b=>{const v=R.ans[b.k]||"";
        res[b.k]=(b.k in R.ovr&&v===lv[b.k])?R.ovr[b.k]:(b.cell&&R.mode[b.ti]==="pick"?v===b.ans:grade(v,b.ans))});
      R.res=res;R.lastVal=Object.assign({},R.ans);R.checks++;tally(R,T);save();drawTest();
      const first=box.querySelector(".slot.bad");if(first)first.scrollIntoView({block:"center",behavior:"smooth"})};
    const rt=box.querySelector("#rxRetry");if(rt)rt.onclick=()=>{Object.keys(R.res).forEach(k=>{if(!R.res[k]){delete R.ans[k];delete R.res[k];delete R.ovr[k]}});save();drawTest();const f=box.querySelector("[data-k]:not([readonly])");if(f)f.focus()};
    box.querySelector("#rxRead").onclick=()=>{R.ph="read";save();learn();window.scrollTo(0,0)};
    nav(si,R);
  }
  function tally(R,T){const r=[Object.values(R.res).filter(Boolean).length,T.blanks.length];R.last=r;if(!R.first||R.checks<=1)R.first=r}
  function nav(si,R){
    const last=si===t.sections.length-1,done=!!R.first;
    stage.querySelector("#navBox").innerHTML=`<div class="qnav"><button class="btn" id="prevS" ${si?"":"disabled"}>← Previous section</button><button class="btn primary" id="nextS" ${done?"":"disabled"}>${last?"Finish this unit →":"Next section →"}</button></div>${done?"":'<p class="muted" style="text-align:right;font-size:13px">Check your answers to unlock the next section.</p>'}`;
    stage.querySelector("#prevS").onclick=()=>{M.si=si-1;save();learn();window.scrollTo(0,0)};
    stage.querySelector("#nextS").onclick=()=>{if(last){M.sreach=si;advance();return}M.si=si+1;M.sreach=Math.max(M.sreach,si+1);const n=rec(M,si+1);n.ph=n.first?"test":"read";save();steps();learn();window.scrollTo(0,0)};
  }

  /* ----- apply: vignettes ----- */
  function apply(){
    const i=Math.min(M.qi,qs.length-1),q=qs[i],r=M.q[q.id],n=qs.filter(x=>M.q[x.id]).length;
    stage.innerHTML=`<section class="sec"><h2>Apply</h2><p class="muted">Shelf-style cases on this unit. ${n}/${qs.length} answered; these also count in the question bank.</p>
    <div class="qbar"><span class="mono" style="font-size:13px">${i+1} / ${qs.length}</span><div class="qprog"><i style="width:${n/qs.length*100}%"></i></div></div>
    <div class="stem">${q.stem}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt ${r?(k===q.a?"ok":k===r.p?"bad":""):""}" data-qa="${k}" ${r?"disabled":""}><span class="l">${L[k]}</span><span>${o}</span></button>`).join("")}</div>
    ${r?`<div class="exp"><div class="verdict ${r.c?"ok":"bad"}">${r.c?"Correct":"Incorrect"}: the answer is ${L[q.a]}.</div>${q.exp}</div>`:""}
    <div class="qnav"><button class="btn" id="qp" ${i?"":"disabled"}>← Previous</button>${r?`<button class="btn primary" id="qn">${i<qs.length-1?"Next case →":"Continue →"}</button>`:""}</div></section>`;
    stage.querySelectorAll("[data-qa]").forEach(b=>b.onclick=()=>{const k=+b.dataset.qa;M.q[q.id]={p:k,c:k===q.a};S.answers[q.id]={c:k===q.a,p:k};save();apply()});
    stage.querySelector("#qp").onclick=()=>{M.qi=i-1;save();apply();window.scrollTo(0,0)};
    const nx=stage.querySelector("#qn");if(nx)nx.onclick=()=>{if(i<qs.length-1){M.qi=i+1;save();apply();window.scrollTo(0,0)}else advance()};
  }

  /* ----- recall: rapid-recall cards ----- */
  function recall(){
    const i=Math.min(M.ri,ps.length-1),p=ps[i],g=M.rc[i],shown=g||rev.has(ns+"r"+i),n=ps.filter((_,k)=>M.rc[k]).length;
    stage.innerHTML=`<section class="sec"><h2>Recall</h2><p class="muted">Pull each answer from memory before revealing it.</p>
    <div class="learn-top"><span class="mono">${i+1} / ${ps.length}</span><div class="qprog"><i style="width:${n/ps.length*100}%"></i></div></div>
    <div class="ck"><p class="ck-q" style="font:500 19px/1.4 var(--f-display)">${p[0]}</p>
    ${shown?`${typed.get(ns+i)?`<p class="muted" style="margin:0;font-size:13px">You wrote: ${esc(typed.get(ns+i))}</p>`:""}<div class="ck-ans">${p[1]}</div>
      ${g?`<p class="ck-fb ${g==="k"?"ok":"bad"}">${g==="k"?"Marked known.":"Marked for review; it comes up first in Flashcards."}</p>`:'<div class="topic-actions"><button class="btn" data-g="a">Missed it</button><button class="btn primary" data-g="k">Got it</button></div>'}`
    :'<label for="rcIn" class="muted" style="font-size:13px">Your answer</label><textarea id="rcIn" class="rc-in" rows="2"></textarea><div class="topic-actions"><button class="btn primary" id="rcShow">Show answer</button></div>'}</div>
    <div class="qnav"><button class="btn" id="rp" ${i?"":"disabled"}>← Previous</button>${g?`<button class="btn primary" id="rn">${i<ps.length-1?"Next →":"See summary →"}</button>`:""}</div></section>`;
    const sw=stage.querySelector("#rcShow");if(sw){const ta=stage.querySelector("#rcIn");ta.focus({preventScroll:true});
      ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sw.click()}});
      sw.onclick=()=>{typed.set(ns+i,ta.value.trim());rev.add(ns+"r"+i);recall()}}
    stage.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{M.rc[i]=b.dataset.g;S.cards[`${t.id}-${i}`]=b.dataset.g;save();recall()});
    stage.querySelector("#rp").onclick=()=>{M.ri=i-1;save();recall()};
    const nx=stage.querySelector("#rn");if(nx)nx.onclick=()=>{if(i<ps.length-1){M.ri=i+1;save();recall()}else advance()};
  }

  /* ----- summary ----- */
  function summary(){
    M.done=true;S.reviewed[id]=true;
    const secs=t.sections.map((s,si)=>({s,si,R:M.rx[si]})),tested=secs.filter(x=>x.R&&x.R.first);
    const blanks=tested.reduce((a,x)=>[a[0]+x.R.first[0],a[1]+x.R.first[1]],[0,0]);
    const qR=qs.filter(q=>M.q[q.id]&&M.q[q.id].c).length,rK=ps.filter((_,i)=>M.rc[i]==="k").length;
    const parts=[blanks[1]&&blanks,qs.length&&[qR,qs.length],ps.length&&[rK,ps.length]].filter(Boolean);
    M.score=parts.length?Math.round(parts.reduce((a,[x,y])=>a+x/y,0)/parts.length*100):0;save();
    const row=(label,x,y)=>`<div class="sum-row"><span>${label}</span><span class="mono">${y?Math.round(x/y*100)+"%":"—"}</span><div class="sum-bar"><i style="width:${y?x/y*100:0}%"></i></div></div>`;
    const weak=secs.filter(x=>x.R&&x.R.first&&pct(x.R.first)<80).sort((a,b)=>pct(a.R.first)-pct(b.R.first));
    const ti=N.topics.indexOf(t),next=N.topics[ti+1];
    stage.innerHTML=`<section class="sec"><h2>Summary</h2>
    <p class="lede" style="margin-bottom:12px">Mastery <b>${M.score}%</b>${M.score>=85?". Solid. Revisit in a few days to keep it.":M.score>=60?". Redo the weakest sections below.":". Worth another pass through the sections below."}</p>
    <div class="panel"><h3 style="margin-top:0">Sections recalled, first try</h3>${secs.map(x=>row(esc(x.s.h),x.R&&x.R.first?x.R.first[0]:0,x.R&&x.R.first?x.R.first[1]:0)).join("")}
    <h3>Other parts</h3>${qs.length?row("Cases",qR,qs.length):""}${ps.length?row("Recall cards",rK,ps.length):""}</div>
    ${weak.length?`<h3 style="margin-top:20px">Redo these</h3>${weak.map(x=>`<a class="miss" href="#" data-sec="${x.si}"><b>${esc(x.s.h)}</b>: ${pct(x.R.first)}% on first try. Clear it and recall again →</a>`).join("")}`:""}
    <div class="topic-actions" style="margin-top:18px"><button class="btn" id="restart">Start the unit over</button>${next?`<a class="btn primary" href="#topic-${next.id}" data-go="topic-${next.id}">Next unit: ${esc(next.title)} →</a>`:""}</div></section>`;
    stage.querySelectorAll("[data-sec]").forEach(a=>a.onclick=e=>{e.preventDefault();const si=+a.dataset.sec;M.rx[si]={ph:"read",ans:{},res:null,ovr:{},mode:(M.rx[si]||{}).mode||{},first:null,last:null,checks:0,free:""};M.si=si;go(idx("learn"))});
    stage.querySelector("#restart").onclick=()=>{S.mod[id]=fresh();S.mod[id].done=true;save();N.renderModule(id);window.scrollTo(0,0)};
  }

};
})();

<script>/* sync.js */
// Cross-device progress: the whole progress object is mirrored to one private gist on the learner's GitHub account.
(function(){
const N=window.NEURO;
const TK="nsa.gh",GK="nsa.gist",DESC="Neuro Shelf Atlas progress",FILE="neuro-shelf-atlas-progress.json";
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

async function api(path,opt={}){
  const r=await fetch("https://api.github.com"+path,Object.assign({},opt,{headers:Object.assign({Accept:"application/vnd.github+json",Authorization:"Bearer "+get(TK),"X-GitHub-Api-Version":"2022-11-28"},opt.body?{"Content-Type":"application/json"}:{})}));
  if(r.status===401)throw new Error("GitHub rejected the token. Check it hasn't expired and has Gists read and write access.");
  if(r.status===403||r.status===404)throw new Error("The token can't reach your gists. Give it Gists read and write access.");
  if(!r.ok)throw new Error("GitHub returned an error ("+r.status+"). Try again in a minute.");
  return r.json();
}
async function findGist(){
  const id=get(GK);
  if(id){try{return await api("/gists/"+id)}catch(e){set(GK,null)}}
  const g=(await api("/gists?per_page=100")).find(x=>x.description===DESC&&x.files&&x.files[FILE]);
  if(!g)return null;set(GK,g.id);return api("/gists/"+g.id);
}
async function pull(){
  const g=await findGist();if(!g)return null;
  const f=g.files[FILE];const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content;
  try{return JSON.parse(txt)}catch(e){return null}
}
async function push(state){
  const files={[FILE]:{content:JSON.stringify(state)}},id=get(GK);
  if(id)return api("/gists/"+id,{method:"PATCH",body:JSON.stringify({files})});
  const g=await api("/gists",{method:"POST",body:JSON.stringify({description:DESC,public:false,files})});set(GK,g.id);
}
// Merge so nothing done on either device is lost: union of answers, cards and reviewed topics; per unit, keep the copy touched last.
function merge(local,remote){
  if(!remote)return local;
  const m=Object.assign({},remote,local);
  for(const k of ["reviewed","answers","cards"]){
    // A deliberate reset ("clear history") wins over older entries from the other device.
    const rk="reset_"+k,lr=local[rk]||0,rr=remote[rk]||0;
    if(lr>(remote.updatedAt||0)&&lr>rr)m[k]=Object.assign({},local[k]||{});
    else if(rr>(local.updatedAt||0)&&rr>lr)m[k]=Object.assign({},remote[k]||{});
    else m[k]=Object.assign({},remote[k]||{},local[k]||{});
    if(lr||rr)m[rk]=Math.max(lr,rr);
  }
  m.mod=Object.assign({},remote.mod||{});
  for(const [id,v] of Object.entries(local.mod||{})){const r=m.mod[id];if(!r||(v.u||0)>=(r.u||0))m.mod[id]=v;}
  m.updatedAt=Math.max(local.updatedAt||0,remote.updatedAt||0);
  return m;
}

let status={state:get(TK)?"idle":"off",msg:""},timer=null,running=null;
const subs=new Set(),emit=s=>{status=Object.assign({},status,s);subs.forEach(f=>f(status))};
async function syncNow(){
  if(!get(TK))return;
  if(running)return running;
  running=(async()=>{
    emit({state:"busy",msg:"Syncing…"});
    try{
      const local=JSON.parse(JSON.stringify(N.app.S)),merged=merge(local,await pull());
      if(JSON.stringify(merged)!==JSON.stringify(local))N.app.applyState(merged);
      await push(merged);
      emit({state:"ok",msg:"",at:Date.now()});
    }catch(e){emit({state:"error",msg:e.message==="Failed to fetch"?"Can't reach GitHub from here. Check your connection; sync doesn't run inside Claude.":e.message})}
    running=null;
  })();
  return running;
}
N.sync={
  available:()=>/github\.io$/.test(location.hostname)||location.protocol==="file:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname),
  enabled:()=>!!get(TK),
  status:()=>status,
  on:f=>{subs.add(f);return()=>subs.delete(f)},
  async connect(token){
    set(TK,token.trim());set(GK,null);emit({state:"busy",msg:"Connecting…"});
    try{await api("/gists?per_page=1")}catch(e){set(TK,null);emit({state:"off",msg:e.message==="Failed to fetch"?"Can't reach GitHub. Check your connection.":e.message});throw e}
    await syncNow();
  },
  disconnect(){set(TK,null);set(GK,null);emit({state:"off",msg:"",at:null})},
  syncNow,
  schedule(){if(!get(TK))return;clearTimeout(timer);timer=setTimeout(syncNow,4000)},
  merge
};
})();

</script>
<script>/* app.js */
(function(){

const topicsIn=cid=>N.topics.filter(t=>t.cat===cid);

const BLUEPRINT=[
 ["System",[["Nervous system & special senses",60,65],["Other systems, incl. multisystem",15,20],["Musculoskeletal system",10,15],["Behavioral health",3,7],["General principles, normal aging, well care",1,5],["Social sciences, death & dying, palliative care",1,5]]],

];

// Each NBME outline area mapped to the topics that cover it (the coverage audit, shown on the home page).
const COVERAGE=[
 ["System","Nervous system: infectious, immunologic, inflammatory",["infections","demyelinating","systemic"]],
 ["System","Nervous system: neoplasms (cerebral, spinal, peripheral)",["tumors","cord","neuropathy"]],
 ["System","Nervous system: cerebrovascular disease",["stroke","syndromes","hemorrhage"]],

 ["System","Nervous system: cranial and peripheral nerves",["cranial","neuropathy"]],
 ["System","Nervous system: neurologic pain syndromes",["neuropain","headache"]],
 ["System","Nervous system: degenerative and amnestic",["dementia","parkinson"]],

 ["System","Nervous system: neuromuscular",["nmj","muscle","neuropathy"]],
 ["System","Nervous system: movement disorders",["parkinson","hyperkinetic"]],
 ["System","Nervous system: paroxysmal disorders",["seizures","headache","syncope"]],
 ["System","Nervous system: sleep disorders",["sleep"]],

 ["System","Behavioral health",["neuropsych","encephalopathy","drugs"]],
 ["System","General principles, normal aging, well care",["localization","prevention"]],

 ["Task","Applying foundational science",["neuroscience","localization","diagnostics"]],
 ["Task","Diagnosis: history, exam, studies, outcomes",["localization","diagnostics","syncope"]],
 ["Task","Health maintenance, pharmacotherapy, management",["prevention","drugs","neuroscience"]]];
function coverage(){
  const figIn=ids=>Object.keys(N.FIGS||{}).filter(f=>(N.FIGS[f].place||[]).some(p=>ids.includes(p.t))).length;
  return `<h2 style="margin-top:32px">Coverage check</h2>
  <p class="muted" style="margin-bottom:10px">Every area of the NBME outline mapped to the topics that teach it, with the practice questions and diagrams attached to those topics.</p>

function drawSync(){

  if(!sy||!sy.available()){box.innerHTML=`<p class="muted" style="font-size:13.5px;margin:0">To keep progress across devices, use the GitHub version of this site, <a href="https://mjogodnik22.github.io/neuro-shelf-atlas/">mjogodnik22.github.io/neuro-shelf-atlas</a>, and turn on sync there. Or move progress with a backup code.</p>`;return}
  const st=sy.status();

    const when=st.at?new Date(st.at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";
    box.innerHTML=`<p style="margin:0"><b>Synced to your GitHub account.</b> <span class="muted">${st.state==="busy"?esc(st.msg):st.state==="error"?"":when?"Last synced "+when+".":""}</span></p>
    ${st.state==="error"?`<p class="ck-fb bad" style="margin:6px 0 0">${esc(st.msg)}</p>`:""}

  }else{
    box.innerHTML=`<p style="margin:0 0 6px"><b>Sync across devices with GitHub.</b> Progress saves to a private gist in your GitHub account, so it follows you between phone and laptop and survives a cleared browser.</p>
    <ol class="sync-steps"><li>Create a token: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>. Name it, pick an expiration, then under <b>Account permissions</b> set <b>Gists</b> to <b>Read and write</b>. Generate and copy it.</li><li>Paste it here and connect. Do this once on each device.</li></ol>
    <div class="topic-actions" style="margin-top:8px"><input id="ghTok" type="password" class="tok-in" placeholder="github_pat_…" autocomplete="off" aria-label="GitHub token"><button class="btn primary" id="syOn">Connect</button></div>
    <p class="muted" style="font-size:12.5px;margin:6px 0 0">The token stays in this browser and is sent only to GitHub. It can read and write your gists and nothing else.</p>
    ${st.msg?`<p class="ck-fb bad" style="margin:6px 0 0">${esc(st.msg)}</p>`:""}`;
    $("#syOn").onclick=async()=>{const v=$("#ghTok").value.trim();if(!v){$("#ghTok").focus();return}

  }
}
function wireProgress(){
  drawSync();
  if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{const el=$("#persistNote");if(el)el.textContent=p?"Saved in this browser, which has agreed not to clear it automatically.":"Saved in this browser. Browsers can clear site data when storage runs low, and Safari after about a week without a visit, so turn on GitHub sync or keep a backup code."}).catch(()=>{});
  const enc=()=>btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $("#bkCopy").onclick=()=>{const code=enc();
    const done=()=>$("#bkMsg").textContent="Copied. Paste it into another browser's restore box.";
    const fallback=()=>{$("#bkIn").value=code;$("#bkIn").select();$("#bkMsg").textContent="Couldn't copy automatically. The code is selected in the box below; copy it from there."};
    try{navigator.clipboard.writeText(code).then(done,fallback)}catch(e){fallback()}};
  $("#bkRestore").onclick=()=>{try{const data=JSON.parse(decodeURIComponent(escape(atob($("#bkIn").value.trim()))));

    catch(e){$("#bkMsg").textContent="That code isn't a valid backup. Copy the whole code and try again."}};
}
function applyState(next){
  Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,next);S.mod=S.mod||{};

function startQuiz(list){Q={list:shuffle(list),i:0,picks:{}};location.hash="quiz";setNav("quiz");drawQ()}
function drawQ(){
  const q=Q.list[Q.i], pick=Q.picks[Q.i], done=pick!==undefined, t=byId[q.t];

  ${done?`<div class="exp"><div class="verdict ${pick===q.a?"ok":"bad"}">${pick===q.a?"Correct":"Incorrect"}: the answer is ${L[q.a]}.</div>${q.exp}<p class="muted" style="margin:8px 0 0;font-size:13px">Topic: <a href="#topic-${t.id}" data-go="topic-${t.id}">${esc(t.title)}</a></p></div>`:""}
  <div class="qnav"><button class="btn" id="prevQ" ${Q.i?"":"disabled"}>← Previous</button>${done?`<button class="btn primary" id="nextQ">${Q.i<Q.list.length-1?"Next question →":"See results"}</button>`:`<span class="muted" style="font-size:13px;align-self:center">Keys 1–${q.opts.length} or A–${L[q.opts.length-1]}</span>`}</div>
  </div>`;

}
function answer(i){const q=Q.list[Q.i];if(Q.picks[Q.i]!==undefined)return;Q.picks[Q.i]=i;S.answers[q.id]={c:i===q.a,p:i};save();drawQ()}
function nextQ(){if(Q.i<Q.list.length-1){Q.i++;drawQ()}else results()}

/* ---------- flashcards ---------- */

  <p class="muted" style="font-size:13px">Space flips · 1 again · 2 got it · arrows move</p>`:`<p>No cards in this deck.</p>`}</div>`;

}
function move(d){C.i=Math.min(Math.max(0,C.i+d),C.deck.length-1);C.flip=false;cardsView()}

/* ---------- search ---------- */
const IDX=[]; N.topics.forEach(t=>{IDX.push({t,sec:-1,h:t.title,txt:strip(t.summary)});t.sections.forEach((s,i)=>IDX.push({t,sec:i,h:s.h,txt:strip(s.html)}));(t.pearls||[]).forEach(p=>IDX.push({t,sec:"rc",h:"Rapid recall",txt:strip(p[0]+" — "+p[1])}))});
function search(term){
  const words=term.toLowerCase().split(/\s+/).filter(Boolean); if(!words.length){route();return}
  const hits=IDX.map(e=>{const hay=(e.h+" "+e.txt).toLowerCase();if(!words.every(w=>hay.includes(w)))return null;let sc=words.reduce((a,w)=>a+(e.t.title.toLowerCase().includes(w)?5:0)+(e.h.toLowerCase().includes(w)?3:0),0);return{e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,60);
  const re=new RegExp("("+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  const snip=txt=>{const l=txt.toLowerCase(),p=Math.max(0,l.indexOf(words[0])-70);return esc((p?"…":"")+txt.slice(p,p+220)+"…").replace(re,"<mark>$1</mark>")};
  main.innerHTML=`<div class="col"><div class="eyebrow">Search</div><h1>${hits.length} result${hits.length===1?"":"s"} for “${esc(term)}”</h1>${hits.map(({e})=>{const anchor=e.sec===-1?"":e.sec==="rc"?`rc-${e.t.id}`:`s-${e.t.id}-${e.sec}`;return`<a class="result" href="#topic-${e.t.id}" data-go="topic-${e.t.id}" data-anchor="${anchor}"><b>${esc(e.t.title)} <span class="muted">· ${esc(e.h)}</span></b><span>${snip(e.txt)}</span></a>`}).join("")||"<p>No matches. Try a shorter term or a drug or eponym.</p>"}</div>`;
}

/* ---------- routing ---------- */
function setNav(v){document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===v))}
function route(anchor){
  const h=(location.hash||"#home").slice(1);
  document.body.classList.remove("nav-open");
  if(h.startsWith("topic-")){const id=h.slice(6);setNav("");renderRail(id);topic(id,anchor);if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView();return}}window.scrollTo(0,0);return}
  if(h.startsWith("s-")||h.startsWith("rc-"))return;
  renderRail(); setNav(h);
  if(h==="quiz"){Q?drawQ():quizSetup()}
  else if(h==="cards")cardsView();
  else if(h==="localize"){main.innerHTML='<div class="wide" id="locRoot"></div>';N.renderLocalize&&N.renderLocalize($("#locRoot"))}
  else home();
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]"); if(j){e.preventDefault();const el=document.getElementById(j.dataset.jump);el&&el.scrollIntoView({behavior:"smooth"});return}
  const g=e.target.closest("[data-go]"); if(!g)return; e.preventDefault();
  const to=g.dataset.go, anchor=g.dataset.anchor;
  if(to==="quiz")Q=null;
  $("#q").value="";
  if(location.hash.slice(1)===to)route(anchor); else{pendingAnchor=anchor;location.hash=to}
});
let pendingAnchor=null;
window.addEventListener("hashchange",()=>{const a=pendingAnchor;pendingAnchor=null;route(a)});
let st; $("#q").addEventListener("input",e=>{clearTimeout(st);st=setTimeout(()=>search(e.target.value.trim()),140)});
$("#menuBtn").onclick=()=>document.body.classList.toggle("nav-open");
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea"))return;
  const h=location.hash.slice(1);
  if(h==="quiz"&&Q){const q=Q.list[Q.i];const k=e.key.toUpperCase();let i=L.indexOf(k);if(i<0&&/^[1-8]$/.test(k))i=+k-1;
    if(i>=0&&i<q.opts.length&&Q.picks[Q.i]===undefined){answer(i);return}
    if((e.key==="Enter"||e.key==="ArrowRight")&&Q.picks[Q.i]!==undefined){nextQ()}}
  if(h==="cards"&&C&&C.deck.length){
    if(e.key===" "){e.preventDefault();C.flip=!C.flip;cardsView()}
    else if(e.key==="ArrowRight")move(1); else if(e.key==="ArrowLeft")move(-1);
    else if(C.flip&&(e.key==="1"||e.key==="2")){S.cards[C.deck[C.i].id]=e.key==="2"?"k":"a";save();move(1)}}
});
N.app={S,save,esc,strip,shuffle,byId,catName,renderRail,readTopic,cards,applyState};
route();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if(N.sync){N.sync.on(()=>drawSync());if(N.sync.enabled()){N.sync.syncNow();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")N.sync.syncNow()})}}
})();

</script>
