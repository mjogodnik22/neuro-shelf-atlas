{id:"encephalopathy",cat:"global",title:"Delirium, coma & encephalopathy",
summary:"Delirium recognition and management, a structured coma exam, prognosis after cardiac arrest, and toxidromes that present as altered mental status.",
sections:[
{h:"Delirium",html:`
<p>Acute, fluctuating disturbance of <b>attention</b> and awareness with disorganized thinking or altered level of consciousness (Confusion Assessment Method). The hypoactive form is common and frequently missed.</p>
<p>Causes: infection (UTI, pneumonia), medications (anticholinergics, benzodiazepines, opioids, sedative hypnotics), withdrawal, electrolyte or glucose derangement, hypoxia, urinary retention, constipation, pain, sleep deprivation, new environment.</p>
<div class="hy"><ul><li>Workup: vitals, glucose, metabolic panel, CBC, urinalysis, chest X-ray, medication review. Head imaging only with focal signs, a fall, or anticoagulation; LP with fever or meningismus.</li>
<li>Management: treat the cause; reorientation, glasses and hearing aids, sleep hygiene, daytime mobilization, family presence, remove lines and restraints.</li>
<li>Low-dose haloperidol or quetiapine only for severe agitation that endangers the patient. <b>Avoid benzodiazepines</b> except for alcohol or benzodiazepine withdrawal.</li></ul></div>
<table><thead><tr><th></th><th>Delirium</th><th>Dementia</th><th>Depression</th></tr></thead><tbody>
<tr><td>Onset</td><td>Hours–days</td><td>Months–years</td><td>Weeks–months</td></tr><tr><td>Course</td><td>Fluctuating</td><td>Slowly progressive</td><td>Persistent low mood</td></tr>
<tr><td>Attention</td><td>Impaired</td><td>Intact early</td><td>Poor effort, "I don't know" answers</td></tr><tr><td>Consciousness</td><td>Altered</td><td>Normal</td><td>Normal</td></tr></tbody></table>`},
{h:"Coma exam",html:`
<p>First: ABCs, glucose, <b>thiamine before dextrose</b>, naloxone if opioid toxidrome. Then GCS and a brainstem exam.</p>
<table><thead><tr><th>Finding</th><th>Meaning</th></tr></thead><tbody>
<tr><td>Pinpoint reactive pupils</td><td>Opioids or pontine hemorrhage</td></tr>
<tr><td>Unilateral fixed dilated pupil</td><td>CN III compression from uncal herniation</td></tr>
<tr><td>Midposition fixed pupils</td><td>Midbrain lesion</td></tr>
<tr><td>Reactive pupils with absent eye movements</td><td>Toxic-metabolic coma (pupils are usually spared)</td></tr>
<tr><td>Cold water calorics: tonic deviation toward the irrigated ear</td><td>Intact brainstem in a comatose patient. Awake: nystagmus fast phase away (COWS). No response: brainstem dysfunction</td></tr>
<tr><td>Decorticate (arm flexion)</td><td>Lesion above the red nucleus</td></tr>
<tr><td>Decerebrate (arm extension)</td><td>Midbrain or upper pons; worse prognosis</td></tr>
<tr><td>Cheyne-Stokes respiration</td><td>Bilateral hemispheric or diencephalic dysfunction, heart failure</td></tr>
<tr><td>Central neurogenic hyperventilation / apneustic / ataxic</td><td>Midbrain / pons / medulla</td></tr></tbody></table>
<p><b>Look-alikes:</b> locked-in syndrome (awake, vertical eye movements), psychogenic unresponsiveness (eyelids resist opening, hand dropped over face avoids it, nystagmus on calorics), vegetative state (eyes open, sleep-wake cycles, no awareness), minimally conscious state (inconsistent purposeful responses).</p>`},
{h:"After cardiac arrest",html:`
<ul><li>Targeted temperature management; prevent fever.</li>
<li>Do not prognosticate before <b>72 h after return to normothermia</b>, and only after sedatives clear.</li>
<li>Poor-outcome markers: absent pupillary and corneal reflexes at ≥72 h, myoclonic status early, bilaterally absent N20 somatosensory evoked potentials, very high neuron-specific enolase, diffuse anoxic injury on MRI.</li>
<li>Lance-Adams syndrome: chronic action myoclonus in survivors with preserved cognition.</li></ul>`},
{h:"Toxidromes",html:`
<table><thead><tr><th>Toxidrome</th><th>Findings</th><th>Treatment</th></tr></thead><tbody>
<tr><td>Opioid</td><td>Miosis, respiratory depression, coma</td><td>Naloxone</td></tr>
<tr><td>Anticholinergic</td><td>Mydriasis, hot dry flushed skin, urinary retention, ileus, delirium, tachycardia</td><td>Supportive; physostigmine in selected cases</td></tr>
<tr><td>Sympathomimetic (cocaine, amphetamines)</td><td>Mydriasis, diaphoresis, hypertension, tachycardia, seizures</td><td>Benzodiazepines</td></tr>
<tr><td>Cholinergic (organophosphates)</td><td>Miosis, salivation, lacrimation, urination, diarrhea, bronchorrhea, bradycardia, fasciculations then weakness</td><td>Atropine, pralidoxime</td></tr>
<tr><td>Sedative-hypnotic</td><td>Normal pupils, respiratory depression, ataxia</td><td>Supportive (flumazenil can provoke seizures)</td></tr>
<tr><td>Lithium</td><td>Coarse tremor, ataxia, confusion, seizures</td><td>Fluids; hemodialysis if severe</td></tr>
<tr><td>Carbon monoxide</td><td>Headache, confusion; delayed parkinsonism and cognitive deficits; globus pallidus lesions</td><td>100% O₂; hyperbaric in severe cases</td></tr>
<tr><td>Methanol</td><td>Visual loss ("snowstorm"), anion-gap acidosis, putaminal necrosis</td><td>Fomepizole, dialysis</td></tr></tbody></table>`}],
pearls:[
["Core feature that defines delirium","Inattention, acute and fluctuating"],["Delirium sedation to avoid (except in withdrawal)","Benzodiazepines"],
["Give before dextrose in an unconscious malnourished patient","Thiamine"],["Unilateral blown pupil in coma","Uncal herniation compressing CN III"],
["Comatose with reactive pupils and no focal signs","Toxic-metabolic encephalopathy"],["Pinpoint pupils with coma and quadriparesis","Pontine hemorrhage (or opioids)"],
["Earliest time to prognosticate after cardiac arrest","72 h after normothermia, off sedation"],

{id:"systemic",cat:"global",title:"Metabolic, nutritional & systemic disease",
summary:"Neurologic presentations of nutritional deficiency, electrolyte shifts, organ failure, endocrine disease, and systemic inflammatory disorders. This overlaps the 15–20% multisystem share of the exam.",
sections:[
{h:"Thiamine and Wernicke",html:`
<p>Thiamine deficiency (alcohol use, hyperemesis gravidarum, bariatric surgery, malnutrition, refeeding) causes <b>confusion, ophthalmoplegia</b> (nystagmus, lateral rectus palsy, gaze palsy), and <b>ataxia</b>. The full triad is present in a minority, so treat on suspicion.</p>
<div class="hy"><p><b>IV thiamine before glucose.</b> Untreated Wernicke progresses to Korsakoff syndrome (amnesia, confabulation). MRI: mammillary bodies, medial thalamus, periaqueductal gray.</p></div>`},
{h:"Sodium and osmotic demyelination",html:`
<ul><li>Acute severe <b>hyponatremia</b> with seizures or coma → bolus of 3% saline (100–150 mL), repeat as needed.</li>
<li>Correcting chronic hyponatremia too fast (more than about 8–10 mEq/L in 24 h) causes <b>osmotic demyelination syndrome</b>: days later, dysarthria, dysphagia, spastic quadriparesis, locked-in state. Risk: alcohol use, malnutrition, liver disease, hypokalemia. If overcorrected, re-lower with free water and desmopressin.</li>
<li>Hypernatremia → lethargy, seizures; brain shrinkage can tear bridging veins (subdural).</li></ul>`},
{h:"B12 and other deficiencies",html:`
<table><thead><tr><th>Deficiency</th><th>Neurologic picture</th><th>Clues</th></tr></thead><tbody>
<tr><td>B12</td><td><b>Subacute combined degeneration</b>: dorsal columns (vibration and proprioception loss, Romberg) + lateral corticospinal (spasticity, Babinski) ± neuropathy, cognitive change</td><td>Pernicious anemia, metformin, PPIs, vegan diet, gastric surgery, <b>nitrous oxide</b>; ↑ methylmalonic acid and homocysteine; anemia may be absent. Treat with IM B12</td></tr>
<tr><td>Copper</td><td>Myelopathy identical to B12</td><td>Bariatric surgery, excess zinc (denture cream)</td></tr>
<tr><td>Vitamin E</td><td>Spinocerebellar ataxia, neuropathy, retinopathy</td><td>Fat malabsorption, cystic fibrosis, cholestasis</td></tr>
<tr><td>Niacin (pellagra)</td><td>Dementia, dermatitis, diarrhea</td><td>Alcohol use, isoniazid, carcinoid, Hartnup</td></tr>
<tr><td>B6</td><td>Neuropathy (from deficiency or excess); seizures in infants</td><td>Isoniazid without pyridoxine</td></tr></tbody></table>`},
{h:"Organ failure and endocrine",html:`
<ul><li><b>Hepatic encephalopathy</b>: confusion, asterixis, triphasic waves. Precipitants: GI bleed, infection, constipation, sedatives, hypokalemia, dehydration. Lactulose, then add rifaximin.</li>
<li><b>Uremic encephalopathy</b>: asterixis, myoclonus, seizures; dialysis.</li>
<li><b>Hypoglycemia</b>: confusion, focal deficits, seizures. Hyperosmolar hyperglycemic state can cause focal seizures and hemichorea.</li>
<li><b>Hypothyroidism</b>: slowed cognition, ataxia, carpal tunnel, proximal myopathy with high CK, delayed reflex relaxation. Hashimoto encephalopathy (steroid-responsive) with high anti-TPO.</li>
<li><b>Hyperthyroidism</b>: tremor, proximal myopathy, thyrotoxic periodic paralysis (hypokalemia, Asian men).</li>
<li><b>Hypercalcemia</b>: confusion, weakness. Hypocalcemia: tetany, Chvostek and Trousseau signs, seizures. Hypermagnesemia: areflexia, respiratory depression.</li></ul>`},
{h:"PRES",html:`
<p><b>Posterior reversible encephalopathy syndrome</b>: headache, seizures, visual disturbance (up to cortical blindness), encephalopathy. Triggers: severe hypertension, eclampsia, cyclosporine or tacrolimus, chemotherapy, renal failure. MRI: parieto-occipital vasogenic edema on T2/FLAIR. Lower BP, stop the offending drug, treat seizures; usually reversible.</p>`},
{h:"Systemic inflammatory and other disorders",html:`
<table><thead><tr><th>Disorder</th><th>Neurologic features</th></tr></thead><tbody>
<tr><td>Sarcoidosis</td><td>Facial palsy (often bilateral), optic neuropathy, aseptic meningitis, hypothalamic involvement with diabetes insipidus</td></tr>
<tr><td>Systemic lupus</td><td>Seizures, psychosis, stroke (antiphospholipid antibodies), chorea, transverse myelitis</td></tr>
<tr><td>Sjögren syndrome</td><td>Sensory ganglionopathy (sensory ataxia), small-fiber neuropathy</td></tr>
<tr><td>Vasculitis (PAN, EGPA, granulomatosis with polyangiitis)</td><td>Mononeuritis multiplex</td></tr>
<tr><td>Behçet disease</td><td>Brainstem lesions, venous sinus thrombosis with oral and genital ulcers</td></tr>
<tr><td>Celiac disease</td><td>Gluten ataxia, neuropathy</td></tr>
<tr><td>Acute intermittent porphyria</td><td>Abdominal pain, motor-predominant neuropathy, psychiatric symptoms, hyponatremia, dark urine; triggered by drugs (barbiturates, some antiseizure drugs), fasting. Urine porphobilinogen; IV hemin and glucose</td></tr>
<tr><td>Alcohol</td><td>Cerebellar vermis degeneration (wide-based gait, legs > arms), neuropathy, Wernicke-Korsakoff, Marchiafava-Bignami (corpus callosum)</td></tr>
<tr><td>Lead</td><td>Children: encephalopathy; adults: wrist drop (motor radial neuropathy), anemia with basophilic stippling</td></tr>
<tr><td>Arsenic</td><td>Painful sensorimotor neuropathy, Mees lines on nails</td></tr></tbody></table>`}],

{id:"parkinson",cat:"move",title:"Parkinson disease & parkinsonism",
summary:"Diagnose Parkinson disease clinically, pick first-line therapy by age and symptom, manage motor fluctuations, and recognize the atypical parkinsonisms and drug-induced mimics.",
sections:[
{h:"Diagnosis",html:`
<p><b>Bradykinesia</b> (required) plus rest tremor or rigidity. Asymmetric onset, pill-rolling rest tremor that lessens with action, cogwheel rigidity, micrographia, hypomimia, hypophonia, shuffling gait with reduced arm swing, festination, and later postural instability.</p>
<p>Non-motor features often come first: <b>anosmia, constipation, REM sleep behavior disorder</b>, depression. Later: orthostatic hypotension, urinary urgency, dementia, hallucinations.</p>
<p>Pathology: loss of dopaminergic neurons in the substantia nigra pars compacta with α-synuclein Lewy bodies. Diagnosis is clinical; a clear response to levodopa supports it. DaT scan separates degenerative parkinsonism from essential tremor or drug-induced parkinsonism when unclear.</p>`},
{h:"Treatment",html:`
<table><thead><tr><th>Drug</th><th>Use</th><th>Adverse effects</th></tr></thead><tbody>
<tr><td>Carbidopa-levodopa</td><td>Most effective for all ages; first-line when symptoms are disabling or patient is older</td><td>Nausea, orthostasis, hallucinations; long-term <b>dyskinesias</b> and wearing-off</td></tr>
<tr><td>Dopamine agonists (pramipexole, ropinirole, rotigotine)</td><td>Younger patients with mild symptoms; also RLS</td><td><b>Impulse control disorders</b> (gambling, shopping, hypersexuality), sleep attacks, edema, hallucinations</td></tr>
<tr><td>MAO-B inhibitors (selegiline, rasagiline, safinamide)</td><td>Mild early disease; adjunct for wearing-off</td><td>Insomnia (selegiline); serotonin syndrome with SSRIs or meperidine</td></tr>
<tr><td>COMT inhibitors (entacapone, opicapone)</td><td>Adjunct with levodopa to extend each dose</td><td>Orange urine, diarrhea, dyskinesia</td></tr>
<tr><td>Amantadine</td><td>Early mild disease; <b>levodopa-induced dyskinesia</b></td><td>Livedo reticularis, ankle edema, confusion</td></tr>
<tr><td>Anticholinergics (trihexyphenidyl, benztropine)</td><td>Tremor-predominant, young patients</td><td>Confusion, urinary retention; avoid in older adults</td></tr></tbody></table>
<ul><li><b>Wearing-off</b>: more frequent levodopa doses, add COMT or MAO-B inhibitor or agonist.</li>
<li><b>Peak-dose dyskinesia</b>: lower individual doses, add amantadine.</li>
<li><b>Deep brain stimulation</b> (subthalamic nucleus or GPi): levodopa-responsive disease with motor fluctuations or dyskinesias, without significant dementia.</li>
<li><b>Psychosis</b>: reduce anticholinergics, amantadine, agonists first; then quetiapine, pimavanserin, or clozapine. Avoid haloperidol, risperidone, metoclopramide, prochlorperazine.</li>
<li>Orthostatic hypotension: fluids, salt, compression, fludrocortisone, midodrine, droxidopa. Dementia: rivastigmine.</li>
<li>Abrupt levodopa withdrawal can cause a <b>parkinsonism-hyperpyrexia syndrome</b> resembling NMS.</li></ul>`},
{h:"Atypical parkinsonism",html:`
<table><thead><tr><th>Disorder</th><th>Distinguishing features</th></tr></thead><tbody>
<tr><td>Progressive supranuclear palsy</td><td>Early <b>falls backward</b>, <b>vertical (downgaze) palsy</b>, axial rigidity, surprised stare, pseudobulbar palsy; "hummingbird sign" on MRI (midbrain atrophy); poor levodopa response</td></tr>
<tr><td>Multiple system atrophy</td><td>Parkinsonism or cerebellar ataxia plus early severe <b>autonomic failure</b> (orthostatic hypotension, erectile dysfunction, urinary retention), stridor; "hot cross bun" sign in pons</td></tr>
<tr><td>Corticobasal degeneration</td><td>Markedly asymmetric rigidity and apraxia, <b>alien limb</b>, cortical sensory loss, myoclonus</td></tr>
<tr><td>Dementia with Lewy bodies</td><td>Dementia early, visual hallucinations, fluctuations</td></tr>
<tr><td>Vascular parkinsonism</td><td>Lower-body predominant gait disorder, stepwise, white-matter disease</td></tr>
<tr><td>Normal pressure hydrocephalus</td><td>Magnetic gait, incontinence, dementia</td></tr>
<tr><td>Wilson disease</td><td>Age &lt;40, tremor, dystonia, psychiatric symptoms, liver disease</td></tr></tbody></table>
<div class="hy"><p><b>Drug-induced parkinsonism</b>: symmetric, from dopamine blockers (antipsychotics, <b>metoclopramide, prochlorperazine</b>), reserpine, tetrabenazine, valproate. Stop the drug; may take months to resolve. Normal DaT scan.</p></div>`}],

{id:"hyperkinetic",cat:"move",title:"Tremor, chorea, dystonia & tics",
summary:"Classify the movement first: tremor, chorea, ballism, dystonia, myoclonus, or tics. Then match to the cause and treatment.",
sections:[
{h:"Tremor",html:`
<table><thead><tr><th>Tremor</th><th>Features</th><th>Treatment</th></tr></thead><tbody>
<tr><td>Essential tremor</td><td>Bilateral <b>action/postural</b> tremor of hands, head ("no-no"), voice; family history (autosomal dominant); <b>improves with alcohol</b>; normal otherwise</td><td><b>Propranolol</b> or primidone; topiramate; DBS of thalamic VIM nucleus or focused ultrasound if refractory</td></tr>
<tr><td>Parkinsonian</td><td>Rest tremor, asymmetric, pill-rolling, with bradykinesia</td><td>Dopaminergic therapy</td></tr>
<tr><td>Enhanced physiologic</td><td>Fine postural tremor from anxiety, caffeine, hyperthyroidism, hypoglycemia, β-agonists, lithium, valproate, withdrawal</td><td>Remove the cause</td></tr>
<tr><td>Cerebellar (intention)</td><td>Worsens approaching a target; dysmetria</td><td>Treat cause</td></tr>
<tr><td>Holmes (rubral)</td><td>Rest, postural and intention, after midbrain lesion</td><td>Difficult</td></tr>
<tr><td>Functional</td><td>Variable frequency, entrains to tapping in the other hand, stops with distraction</td><td>Explanation, physical therapy</td></tr></tbody></table>`},
{h:"Huntington disease",html:`
<p>Autosomal dominant <b>CAG repeat</b> in HTT on chromosome 4; anticipation (earlier onset through paternal transmission). Age 30–50: <b>chorea</b>, irritability, depression, psychosis, impulsivity, subcortical dementia, motor impersistence (milkmaid grip), saccade abnormalities. <b>Caudate atrophy</b> with boxcar ventricles. High suicide risk.</p>
<p>Chorea: <b>tetrabenazine, deutetrabenazine, valbenazine</b> (VMAT2 inhibitors; watch depression and suicidality) or antipsychotics. Genetic counseling before testing; presymptomatic testing of minors is generally not done.</p>
<p>Other chorea: Sydenham (after group A strep, with rheumatic fever; usually resolves), SLE/antiphospholipid, pregnancy (chorea gravidarum), oral contraceptives, hyperthyroidism, nonketotic hyperglycemia, polycythemia vera.</p>`},
{h:"Wilson disease",html:`
<p>Autosomal recessive ATP7B defect; copper accumulates in liver and brain (basal ganglia). Under 40: <b>wing-beating tremor</b>, dysarthria, dystonia, parkinsonism, psychiatric change, hepatitis or cirrhosis. <b>Kayser-Fleischer rings</b> are present in nearly all with neurologic disease.</p>
<p>Tests: low ceruloplasmin, high 24-h urine copper, slit-lamp exam, liver biopsy copper. Treatment: chelation with <b>penicillamine or trientine</b>, zinc for maintenance, liver transplant for fulminant failure. Screen siblings.</p>`},
{h:"Dystonia, ballism, myoclonus",html:`
<ul><li><b>Dystonia</b>: sustained twisting contractions and postures. Focal forms (cervical dystonia/torticollis, blepharospasm, writer's cramp) → <b>botulinum toxin</b>. Sensory trick (geste antagoniste) eases it. Young-onset generalized dystonia → trial of levodopa (dopa-responsive dystonia, with diurnal variation) and check for Wilson disease.</li>
<li><b>Hemiballismus</b>: violent flinging of one side; contralateral <b>subthalamic nucleus</b> lesion, usually a lacunar stroke; also nonketotic hyperglycemia. Often improves; antipsychotics or tetrabenazine if needed.</li>
<li><b>Myoclonus</b>: brief shock-like jerks. Causes: metabolic (uremia, hepatic), hypoxic (Lance-Adams), CJD, antiseizure drug toxicity, serotonin syndrome, opioids, physiologic (hypnic jerks). Asterixis is negative myoclonus.</li></ul>`},
{h:"Tics and Tourette syndrome",html:`
<p>Tics: brief, repetitive movements or sounds preceded by a <b>premonitory urge</b>, temporarily suppressible, worse with stress, better with focus. Tourette syndrome: multiple motor tics and at least one vocal tic for &gt;1 year, onset before 18. Coprolalia is uncommon. Comorbid <b>ADHD and OCD</b> are frequent and often more impairing.</p>
<p>Treatment: education; comprehensive behavioral intervention for tics; <b>α2-agonists (guanfacine, clonidine)</b>, especially with ADHD; aripiprazole or other antipsychotics for severe tics; botulinum toxin for focal tics. Stimulants for ADHD are acceptable.</p>`}],

["Bilateral hand tremor with action that improves with a glass of wine","Essential tremor"],["Essential tremor first-line drugs","Propranolol or primidone"],

["Young adult with tremor, psychiatric change, and elevated liver enzymes","Wilson disease: check ceruloplasmin and slit lamp"],["Hemiballismus lesion","Contralateral subthalamic nucleus"],

{id:"infections",cat:"inf",title:"CNS infections",
summary:"Meningitis by age with empiric regimens, HSV and other encephalitis, brain abscess, infections in HIV, neurosyphilis, Lyme, and toxin-mediated disease.",
sections:[
{h:"Bacterial meningitis",html:`
<p>Fever, headache, neck stiffness, altered mental status (all three classic features in under half). Kernig and Brudzinski signs are specific but insensitive. Petechial or purpuric rash suggests meningococcus.</p>
<div class="hy"><p>Do not delay: <b>blood cultures → dexamethasone + antibiotics → CT if indicated → LP</b>. Dexamethasone (before or with the first antibiotic dose) reduces hearing loss and mortality in pneumococcal meningitis.</p></div>
<table><thead><tr><th>Group</th><th>Likely organisms</th><th>Empiric therapy</th></tr></thead><tbody>
<tr><td>&lt;1 month</td><td>Group B strep, E. coli, Listeria</td><td>Ampicillin + cefotaxime (or gentamicin)</td></tr>
<tr><td>1 month–50 years</td><td>S. pneumoniae, N. meningitidis</td><td>Vancomycin + ceftriaxone</td></tr>
<tr><td>&gt;50 years, alcohol use, immunocompromised, pregnant</td><td>Add Listeria</td><td>Vancomycin + ceftriaxone + <b>ampicillin</b></td></tr>
<tr><td>Neurosurgery, shunt, penetrating trauma</td><td>Staph (MRSA), Pseudomonas, gram negatives</td><td>Vancomycin + cefepime, ceftazidime, or meropenem</td></tr></tbody></table>
<ul><li>Meningococcal close contacts: chemoprophylaxis with rifampin, ciprofloxacin, or ceftriaxone. Droplet precautions for the patient for 24 h of therapy.</li>
<li>Complications: hearing loss (check audiology in children), seizures, hydrocephalus, SIADH, Waterhouse-Friderichsen adrenal hemorrhage.</li>
<li>Recurrent meningitis: CSF leak (prior skull fracture) or complement deficiency (Neisseria).</li></ul>`},
{h:"Viral meningitis and encephalitis",html:`
<ul><li><b>Viral meningitis</b>: enteroviruses (summer-fall, most common), HSV-2 (recurrent, Mollaret), HIV seroconversion, mumps. Supportive care.</li>
<li><b>Encephalitis</b> = altered mental status, behavior change, seizures, focal signs.</li></ul>
<div class="hy"><p><b>HSV-1 encephalitis</b>: fever, confusion, personality change, aphasia, seizures, olfactory hallucinations. MRI: <b>temporal lobe</b> (often unilateral) T2 hyperintensity and hemorrhage; EEG: temporal periodic discharges; CSF lymphocytes with RBCs; HSV PCR. Start <b>IV acyclovir immediately</b> on suspicion (monitor kidneys). Autoimmune anti-NMDA receptor encephalitis can follow it.</p></div>
<table><thead><tr><th>Virus</th><th>Clue</th></tr></thead><tbody>
<tr><td>West Nile</td><td>Older adult, summer, encephalitis with flaccid paralysis (anterior horn), tremor</td></tr>
<tr><td>Rabies</td><td>Bat or animal exposure; agitation, hydrophobia, hypersalivation; post-exposure: wound care, rabies immunoglobulin and vaccine</td></tr>
<tr><td>VZV</td><td>Zoster rash, vasculopathy causing stroke, myelitis</td></tr>
<tr><td>Enterovirus D68 / A71</td><td>Children, acute flaccid myelitis after respiratory illness</td></tr>
<tr><td>JC virus (PML)</td><td>Immunosuppression (HIV, natalizumab, rituximab); subacute multifocal deficits; non-enhancing white-matter lesions</td></tr>
<tr><td>Measles (SSPE)</td><td>Years after childhood measles: personality change, myoclonus, dementia</td></tr></tbody></table>`},
{h:"Brain abscess",html:`
<p>Headache, fever (only about half), focal deficit, seizures. Sources: contiguous (sinusitis, otitis, dental), hematogenous (endocarditis, lung abscess, cyanotic heart disease with right-to-left shunt), trauma or surgery. Ring-enhancing lesion with restricted diffusion centrally.</p>
<p>Treatment: aspiration or excision for culture plus empiric IV antibiotics (ceftriaxone + metronidazole; add vancomycin after trauma or surgery). Avoid LP (herniation risk, low yield).</p>`},
{h:"HIV and immunocompromise",html:`
<table><thead><tr><th>Condition</th><th>CD4</th><th>Imaging and tests</th><th>Treatment</th></tr></thead><tbody>
<tr><td>Toxoplasmosis</td><td>&lt;100</td><td><b>Multiple ring-enhancing lesions</b>, basal ganglia and gray-white junction; positive Toxoplasma IgG</td><td>Pyrimethamine + sulfadiazine + leucovorin; response in 2 weeks confirms</td></tr>
<tr><td>Primary CNS lymphoma</td><td>&lt;50</td><td><b>Single</b> enhancing periventricular lesion; EBV DNA in CSF; thallium SPECT or PET positive</td><td>Biopsy; methotrexate-based chemotherapy, ART</td></tr>
<tr><td>Cryptococcal meningitis</td><td>&lt;100</td><td>Headache, fever; <b>very high opening pressure</b>; India ink, CSF cryptococcal antigen</td><td>Amphotericin B + flucytosine, then fluconazole; serial LPs for pressure</td></tr>
<tr><td>PML</td><td>&lt;200</td><td>Non-enhancing white matter lesions, JC virus PCR</td><td>ART (immune reconstitution)</td></tr>
<tr><td>CMV</td><td>&lt;50</td><td>Periventricular enhancement, polyradiculopathy, retinitis</td><td>Ganciclovir</td></tr>
<tr><td>HIV-associated neurocognitive disorder</td><td>Any</td><td>Subcortical slowing, atrophy</td><td>ART</td></tr>
<tr><td>Distal sensory polyneuropathy</td><td>Any</td><td>Painful stocking neuropathy; also from older nucleoside drugs</td><td>Symptomatic</td></tr></tbody></table>`},
{h:"Spirochetes, TB, and fungi",html:`
<ul><li><b>Neurosyphilis</b>: early (meningitis, cranial neuropathies, stroke from meningovascular disease) or late (<b>tabes dorsalis</b>: lightning pains, sensory ataxia, Romberg, Charcot joints; <b>general paresis</b>: dementia, psychiatric change; <b>Argyll Robertson pupils</b>: accommodate but do not react). CSF VDRL is specific; treat with <b>IV penicillin G</b> for 10–14 days.</li>
<li><b>Lyme disease</b>: unilateral or <b>bilateral facial palsy</b>, lymphocytic meningitis, painful radiculitis (Bannwarth); after tick exposure in the Northeast or upper Midwest. Oral doxycycline for isolated facial palsy or meningitis; IV ceftriaxone for severe disease.</li>
<li><b>Tuberculous meningitis</b>: subacute, basilar meningitis with cranial neuropathies (CN VI), hydrocephalus, stroke; CSF lymphocytes, very high protein, low glucose. RIPE therapy plus dexamethasone.</li>
<li><b>Neurocysticercosis</b> (Taenia solium): the leading cause of acquired epilepsy worldwide; cystic lesions with scolex or calcifications; albendazole + steroids for viable cysts, antiseizure drugs.</li>
<li><b>Mucormycosis</b>: diabetic ketoacidosis, black eschar in nasal cavity, orbital apex and cavernous sinus involvement; emergent debridement + amphotericin.</li></ul>`},
{h:"Toxin-mediated",html:`
<ul><li><b>Tetanus</b>: wound contamination; trismus (lockjaw), risus sardonicus, opisthotonus, painful spasms with intact consciousness. Tetanus immune globulin, wound debridement, metronidazole, benzodiazepines, vaccine.</li>
<li><b>Botulism</b>: see Neuromuscular junction. Descending paralysis with dilated pupils; infants after honey; adults after home-canned food or injection drug use.</li></ul>`}],

{id:"demyelinating",cat:"inf",title:"Multiple sclerosis & autoimmune CNS disease",
summary:"MS diagnosis and treatment, the look-alikes (NMOSD, MOGAD, ADEM), optic neuritis and transverse myelitis, and autoimmune encephalitis.",
sections:[
{h:"Multiple sclerosis",html:`
<p>Young adults (women 2–3:1), relapsing episodes of neurologic dysfunction lasting more than 24 h that improve over weeks. Classic presentations:</p>
<ul><li><b>Optic neuritis</b>: painful monocular vision loss, worse with eye movement, color desaturation, RAPD, central scotoma</li>
<li><b>Internuclear ophthalmoplegia</b> (bilateral in a young patient is nearly diagnostic): MLF lesion; adducting eye fails, abducting eye has nystagmus, convergence spared</li>
<li><b>Partial transverse myelitis</b>: sensory level, Lhermitte sign (electric shock down the spine with neck flexion)</li>
<li>Brainstem or cerebellar syndromes, trigeminal neuralgia in a young person, fatigue, bladder dysfunction, depression</li>
<li><b>Uhthoff phenomenon</b>: transient worsening with heat or exercise</li></ul>
<p><b>Diagnosis</b> (McDonald): dissemination in space and time. MRI: periventricular (ovoid, perpendicular to ventricles: Dawson fingers), juxtacortical, infratentorial and spinal cord T2 lesions; simultaneous enhancing and non-enhancing lesions show dissemination in time. CSF oligoclonal bands can substitute for dissemination in time.</p>`},
{h:"MS treatment",html:`
<div class="hy"><ul><li><b>Acute relapse</b>: high-dose IV methylprednisolone (or oral equivalent) for 3–5 days; plasma exchange if steroid-refractory. Steroids speed recovery but do not change long-term disability.</li>
<li><b>Disease-modifying therapy</b> for relapsing MS; start early.</li></ul></div>
<table><thead><tr><th>Drug</th><th>Key risk</th></tr></thead><tbody>
<tr><td>Interferon-β</td><td>Flu-like symptoms, depression, liver enzymes, cytopenias</td></tr>
<tr><td>Glatiramer acetate</td><td>Injection site reactions, post-injection flushing and chest tightness; safest in pregnancy planning</td></tr>
<tr><td>Natalizumab</td><td><b>PML</b> (check JC virus antibody)</td></tr>
<tr><td>Ocrelizumab, ofatumumab, rituximab (anti-CD20)</td><td>Infusion reactions, infections, hepatitis B reactivation; ocrelizumab is approved for primary progressive MS</td></tr>
<tr><td>Fingolimod, siponimod</td><td>First-dose bradycardia, macular edema, infections</td></tr>
<tr><td>Dimethyl fumarate</td><td>Flushing, GI upset, lymphopenia</td></tr>
<tr><td>Teriflunomide</td><td>Teratogenic, hepatotoxic</td></tr>
<tr><td>Alemtuzumab</td><td>Autoimmune thyroid disease, ITP</td></tr></tbody></table>
<p>Symptomatic: spasticity (baclofen, tizanidine), fatigue (exercise, amantadine, modafinil), urge incontinence (oxybutynin), walking speed (dalfampridine; seizure risk), depression, pseudobulbar affect (dextromethorphan-quinidine). Relapse rate falls in pregnancy and rises postpartum.</p>`},
{h:"MS look-alikes",html:`
<table><thead><tr><th>Disorder</th><th>Distinguishing features</th><th>Treatment</th></tr></thead><tbody>
<tr><td>Neuromyelitis optica spectrum disorder</td><td><b>Aquaporin-4 IgG</b>; severe bilateral optic neuritis, <b>longitudinally extensive transverse myelitis</b> (≥3 segments), area postrema syndrome (intractable hiccups, vomiting); more common in women of Asian and African ancestry</td><td>Steroids, plasma exchange; prevention with eculizumab, inebilizumab, satralizumab, rituximab. <b>Some MS drugs worsen NMOSD</b></td></tr>
<tr><td>MOG antibody disease</td><td>Optic neuritis with disc swelling, myelitis, ADEM-like picture in children</td><td>Steroids; often monophasic</td></tr>
<tr><td>Acute disseminated encephalomyelitis</td><td>Child, days to weeks after infection or vaccination; <b>encephalopathy</b> plus multifocal deficits; large bilateral lesions all the same age; usually monophasic</td><td>High-dose steroids, IVIG, plasma exchange</td></tr>
<tr><td>Isolated optic neuritis</td><td>Get MRI brain: white-matter lesions predict MS</td><td>IV steroids speed recovery (do not use oral prednisone alone at low dose)</td></tr>
<tr><td>Idiopathic transverse myelitis</td><td>Bilateral weakness, sensory level, bladder dysfunction over hours to days</td><td>MRI first to exclude compression; IV steroids</td></tr></tbody></table>`},
{h:"Autoimmune encephalitis",html:`
<ul><li><b>Anti-NMDA receptor encephalitis</b>: young woman with psychiatric symptoms (psychosis, agitation), then seizures, orofacial dyskinesias, autonomic instability, decreased consciousness; associated with <b>ovarian teratoma</b>. CSF and serum antibodies. Treat with steroids, IVIG or plasma exchange, and tumor removal; rituximab second-line.</li>
<li><b>Anti-LGI1</b>: older man, faciobrachial dystonic seizures, memory loss, hyponatremia.</li>
<li>Paraneoplastic limbic encephalitis (anti-Hu, anti-Ma2): see Neoplasms.</li></ul>`}],

{id:"tumors",cat:"onc",title:"Brain tumors & paraneoplastic syndromes",
summary:"Adult and pediatric CNS tumors by location and imaging, general management of edema and seizures, and the paraneoplastic antibody table.",
sections:[
{h:"Presentation",html:`
<p>Progressive focal deficit, new seizure, personality change, or headache that is worse in the morning or when lying down, with vomiting and papilledema from raised intracranial pressure. Posterior fossa tumors cause ataxia and hydrocephalus.</p>
<div class="hy"><ul><li><b>Dexamethasone</b> for symptomatic vasogenic edema. Hold it before biopsy if lymphoma is possible (steroids shrink lymphoma and spoil the biopsy).</li>
<li>Treat seizures (levetiracetam preferred for few interactions); <b>no seizure prophylaxis</b> if the patient has never seized.</li>
<li>High VTE risk; anticoagulation is generally acceptable.</li></ul></div>`},
{h:"Adult tumors",html:`
<table><thead><tr><th>Tumor</th><th>Clues</th><th>Management</th></tr></thead><tbody>
<tr><td><b>Metastases</b> (most common brain tumor)</td><td>Lung, breast, melanoma, renal, colon; <b>multiple</b> at gray-white junction; melanoma, renal, thyroid, choriocarcinoma bleed</td><td>Steroids; resection or stereotactic radiosurgery for limited lesions; whole-brain RT for many; systemic therapy</td></tr>
<tr><td>Glioblastoma (most common primary malignant)</td><td>Age &gt;50, ring-enhancing with central necrosis, crosses corpus callosum ("butterfly"); IDH-wildtype</td><td>Maximal safe resection + radiation + temozolomide (better with MGMT promoter methylation); median survival about 15 months</td></tr>
<tr><td>Meningioma (most common primary overall)</td><td>Women, extra-axial, dural-based with <b>dural tail</b>, psammoma bodies; NF2; prior radiation</td><td>Observe if small and asymptomatic; resect if symptomatic; radiosurgery</td></tr>
<tr><td>Low-grade glioma / oligodendroglioma</td><td>Young adult with seizures; oligodendroglioma: frontal, calcified, 1p/19q codeletion</td><td>Resection, radiation, chemotherapy</td></tr>
<tr><td>Vestibular schwannoma</td><td>Unilateral sensorineural hearing loss, tinnitus, imbalance; later CN V and VII; cerebellopontine angle; bilateral = NF2</td><td>MRI with gadolinium; observe, radiosurgery, or resection</td></tr>
<tr><td>Pituitary adenoma</td><td>Bitemporal hemianopia, headache, hormonal excess or hypopituitarism</td><td>Prolactinoma: <b>cabergoline</b> first even if large; others: transsphenoidal surgery</td></tr>
<tr><td>Primary CNS lymphoma</td><td>Immunocompromised (EBV) or older adult; periventricular, homogeneously enhancing; uveitis</td><td>Biopsy before steroids; high-dose methotrexate</td></tr>
<tr><td>Hemangioblastoma</td><td>Cerebellar cyst with nodule; von Hippel-Lindau; polycythemia (erythropoietin)</td><td>Resection</td></tr>
<tr><td>Colloid cyst</td><td>Third ventricle at foramen of Monro; positional headache, drop attacks, sudden death from acute hydrocephalus</td><td>Resection</td></tr></tbody></table>`},
{h:"Pediatric tumors",html:`
<p>Brain tumors are the most common solid tumors of childhood; many are in the posterior fossa.</p>
<table><thead><tr><th>Tumor</th><th>Clues</th></tr></thead><tbody>
<tr><td>Pilocytic astrocytoma</td><td>Cerebellar hemisphere, <b>cystic with enhancing mural nodule</b>, Rosenthal fibers; excellent prognosis after resection; optic pathway gliomas in NF1</td></tr>
<tr><td>Medulloblastoma</td><td>Cerebellar <b>vermis</b>, truncal ataxia, obstructive hydrocephalus; malignant; drop metastases down the spine (image the whole neuraxis)</td></tr>
<tr><td>Ependymoma</td><td>Fourth ventricle, hydrocephalus; perivascular pseudorosettes</td></tr>
<tr><td>Craniopharyngioma</td><td>Suprasellar, calcified cystic mass from Rathke pouch; bitemporal hemianopia, growth failure, diabetes insipidus</td></tr>
<tr><td>Diffuse midline glioma (pons)</td><td>Rapid multiple cranial neuropathies + long tract signs + ataxia; very poor prognosis; radiation</td></tr>
<tr><td>Pineal germinoma</td><td>Parinaud syndrome, hydrocephalus, precocious puberty; very radiosensitive</td></tr></tbody></table>`},
{h:"Spinal tumors",html:`
<ul><li><b>Extradural</b> (most common): metastases to the vertebral body → epidural spinal cord compression (see Spinal cord).</li>
<li><b>Intradural extramedullary</b>: meningioma, schwannoma, neurofibroma.</li>
<li><b>Intramedullary</b>: ependymoma (adults), astrocytoma (children); central cord pattern.</li></ul>`},
{h:"Paraneoplastic syndromes",html:`
<table><thead><tr><th>Antibody</th><th>Syndrome</th><th>Associated cancer</th></tr></thead><tbody>
<tr><td>Anti-Hu (ANNA-1)</td><td>Sensory neuronopathy, encephalomyelitis, limbic encephalitis</td><td>Small cell lung</td></tr>
<tr><td>Anti-Yo (PCA-1)</td><td>Subacute cerebellar degeneration</td><td>Ovarian, breast</td></tr>
<tr><td>Anti-Ri (ANNA-2)</td><td>Opsoclonus-myoclonus, brainstem encephalitis</td><td>Breast, small cell lung</td></tr>
<tr><td>(Children) opsoclonus-myoclonus-ataxia</td><td>"Dancing eyes, dancing feet"</td><td><b>Neuroblastoma</b></td></tr>
<tr><td>Anti-NMDA receptor</td><td>Psychiatric symptoms, seizures, dyskinesias, autonomic instability</td><td>Ovarian teratoma</td></tr>
<tr><td>Anti-Ma2</td><td>Limbic, hypothalamic, brainstem encephalitis</td><td>Testicular germ cell</td></tr>
<tr><td>Anti-P/Q voltage-gated calcium channel</td><td>Lambert-Eaton myasthenic syndrome</td><td>Small cell lung</td></tr>
<tr><td>Anti-amphiphysin</td><td>Stiff-person syndrome (non-paraneoplastic form: anti-GAD, diabetes)</td><td>Breast</td></tr>
<tr><td>Anti-recoverin</td><td>Cancer-associated retinopathy</td><td>Small cell lung</td></tr>
<tr><td>AChR antibody</td><td>Myasthenia gravis</td><td>Thymoma</td></tr></tbody></table>
<p>Often precede the cancer diagnosis. Workup: CT chest/abdomen/pelvis, PET; mammography, testicular or pelvic ultrasound as indicated. Treat the tumor; add immunotherapy.</p>`}],

{id:"cord",cat:"spine",title:"Spinal cord syndromes & emergencies",
summary:"Recognize the incomplete cord syndromes by which tracts are lost, separate conus from cauda equina, and act fast on compression, abscess and infarction.",
sections:[
{h:"Tracts that matter",html:`
<ul><li><b>Lateral corticospinal</b>: crosses at the medullary pyramids → ipsilateral weakness below a cord lesion.</li>
<li><b>Dorsal columns</b> (vibration, proprioception, fine touch): ascend ipsilaterally, cross in the medulla → ipsilateral loss.</li>
<li><b>Spinothalamic</b> (pain, temperature): crosses within 1–2 segments in the anterior commissure → contralateral loss.</li></ul>`},
{h:"Cord syndromes",html:`
<table><thead><tr><th>Syndrome</th><th>Cause</th><th>Findings</th></tr></thead><tbody>
<tr><td>Complete transection</td><td>Trauma, compression</td><td>All motor and sensory loss below level; spinal shock (flaccid, areflexic) then spasticity</td></tr>
<tr><td>Anterior cord</td><td>Anterior spinal artery infarct (aortic surgery or dissection, hypotension), flexion injury</td><td>Bilateral weakness and pain/temperature loss below level; <b>vibration and proprioception preserved</b></td></tr>
<tr><td>Central cord</td><td>Neck hyperextension in an older adult with cervical spondylosis; syringomyelia; intramedullary tumor</td><td><b>Arms weaker than legs</b>, hands worst; cape-like pain/temperature loss; variable bladder</td></tr>
<tr><td>Brown-Séquard (hemisection)</td><td>Penetrating trauma, tumor, MS</td><td>Ipsilateral weakness and vibration/proprioception loss; <b>contralateral</b> pain/temperature loss starting 1–2 levels below</td></tr>
<tr><td>Posterior cord</td><td>B12 or copper deficiency, tabes dorsalis, nitrous oxide</td><td>Vibration and proprioception loss, sensory ataxia, positive Romberg</td></tr>
<tr><td>Syringomyelia</td><td>Chiari I malformation, trauma</td><td><b>Cape distribution</b> loss of pain and temperature with preserved touch; painless burns on hands; hand atrophy (anterior horn); later UMN signs in legs</td></tr>
<tr><td>Combined UMN and LMN, no sensory loss</td><td>ALS</td><td>See Neuromuscular</td></tr></tbody></table>`},
{h:"Conus medullaris vs cauda equina",html:`
<table><thead><tr><th></th><th>Conus medullaris (L1–L2)</th><th>Cauda equina (roots below L2)</th></tr></thead><tbody>
<tr><td>Onset</td><td>Sudden, bilateral, symmetric</td><td>Gradual, often asymmetric</td></tr>
<tr><td>Pain</td><td>Mild, back</td><td><b>Severe radicular</b> pain</td></tr>
<tr><td>Sensory</td><td>Saddle anesthesia</td><td>Saddle and dermatomal, asymmetric</td></tr>
<tr><td>Bladder and bowel</td><td>Early</td><td>Later</td></tr>
<tr><td>Reflexes</td><td>Mixed UMN and LMN; ankle reflex lost, knee may be preserved</td><td>LMN only; areflexia</td></tr></tbody></table>
<div class="warn"><p>Saddle anesthesia, urinary retention (high post-void residual), fecal incontinence or reduced rectal tone, with back pain → <b>emergent MRI</b> and surgical decompression. Central disc herniation is the usual cause.</p></div>`},
{h:"Epidural spinal cord compression",html:`
<p>A patient with cancer (lung, breast, prostate, renal, myeloma, lymphoma) has back pain that is worse lying down and at night, then leg weakness, a sensory level, and bladder dysfunction. Back pain precedes deficits by weeks.</p>
<div class="hy"><p><b>Dexamethasone immediately</b>, then <b>MRI of the whole spine</b> (multiple levels are common), then radiation and/or surgical decompression. Ambulatory status at diagnosis predicts outcome. New back pain in a patient with cancer warrants urgent MRI even with a normal exam.</p></div>`},
{h:"Infection and infarction",html:`
<ul><li><b>Spinal epidural abscess</b>: back pain, fever, then deficits (triad present in a minority). Risks: injection drug use, diabetes, recent spinal procedure, bacteremia. <i>S. aureus</i>. ESR and CRP high. MRI with gadolinium; blood cultures; vancomycin plus ceftriaxone or cefepime; surgical drainage for deficits.</li>
<li><b>Spinal cord infarction</b>: sudden anterior cord syndrome after aortic aneurysm repair or dissection (artery of Adamkiewicz), or severe hypotension.</li>
<li><b>Vertebral osteomyelitis / discitis</b>: focal tenderness, fever, high ESR; MRI; biopsy before antibiotics if stable.</li></ul>`},
{h:"Spinal cord injury",html:`
<ul><li>Immobilize; CT then MRI. Maintain mean arterial pressure around 85–90 mm Hg for several days. High-dose steroids are not routinely recommended.</li>
<li><b>Neurogenic shock</b> (injury T6 or above): hypotension with <b>bradycardia</b> and warm skin from loss of sympathetic tone. Fluids, vasopressors, atropine.</li>
<li><b>Spinal shock</b>: temporary loss of reflexes below the injury.</li>
<li><b>Autonomic dysreflexia</b> (chronic lesion at T6 or above): severe hypertension, bradycardia, pounding headache, flushing and sweating above the level, triggered by bladder distension or fecal impaction. Sit upright, loosen clothing, <b>catheterize or disimpact</b>; short-acting antihypertensive if needed.</li></ul>`}],
pearls:[
["Loss of pain/temp below a level, vibration preserved, after aortic surgery","Anterior spinal artery infarct (anterior cord syndrome)"],
["Older adult falls forward, hits chin; arms weaker than legs","Central cord syndrome"],["Stab wound: ipsilateral weakness and proprioception loss, contralateral pain/temp loss","Brown-Séquard syndrome"],
["Cape-like loss of pain and temperature with painless hand burns","Syringomyelia (Chiari I)"],["Cancer patient with new back pain and leg weakness: first step","IV dexamethasone, then MRI of the entire spine"],
["Fever, back pain, IV drug use, new leg weakness","Spinal epidural abscess"],["Hypotension + bradycardia after cervical cord injury","Neurogenic shock"],
["Paraplegic patient with BP 210/110, headache, flushing above lesion","Autonomic dysreflexia: sit up, check bladder and bowel"],
["Severe asymmetric radicular pain, saddle anesthesia, late urinary retention","Cauda equina syndrome"]]},

{id:"back",cat:"spine",title:"Radiculopathy, back & neck pain",
summary:"Root-level localization, when to image back pain, sciatica and spinal stenosis management, and cervical myelopathy. This is much of the musculoskeletal share of the exam.",
sections:[
{h:"Root localization",html:`
<table><thead><tr><th>Root</th><th>Weakness</th><th>Reflex</th><th>Sensory</th></tr></thead><tbody>
<tr><td>C5</td><td>Shoulder abduction (deltoid), elbow flexion</td><td>Biceps</td><td>Lateral shoulder</td></tr>
<tr><td>C6</td><td>Elbow flexion, wrist extension</td><td>Brachioradialis, biceps</td><td>Lateral forearm, thumb and index</td></tr>
<tr><td>C7</td><td>Elbow extension (triceps), wrist flexion, finger extension</td><td>Triceps</td><td>Middle finger</td></tr>
<tr><td>C8</td><td>Finger flexion, hand intrinsics</td><td>None</td><td>Ring and little fingers, medial forearm</td></tr>
<tr><td>L4</td><td>Knee extension, ankle dorsiflexion (tibialis anterior)</td><td>Patellar</td><td>Medial leg</td></tr>
<tr><td>L5</td><td><b>Great toe extension</b>, dorsiflexion, foot inversion and eversion, <b>hip abduction</b></td><td>None reliable</td><td>Lateral leg, dorsum of foot</td></tr>
<tr><td>S1</td><td>Plantarflexion, foot eversion, hip extension</td><td>Achilles</td><td>Lateral foot, sole</td></tr></tbody></table>
<div class="hy"><p>Posterolateral disc herniation hits the <b>lower</b> root at that level: L4–L5 disc → L5 root; L5–S1 disc → S1 root. In the neck the root exits above its vertebra: C5–C6 disc → C6 root. <b>L5 radiculopathy vs peroneal neuropathy</b>: both cause foot drop, but L5 also weakens inversion and hip abduction.</p></div>`},
{h:"Acute low back pain",html:`
<p>Most is mechanical and improves within 4–6 weeks. <b>No imaging</b> in the first 6 weeks without red flags.</p>
<ul><li>Treatment: stay active (no bed rest), heat, NSAIDs, short-term muscle relaxants; physical therapy, exercise, spinal manipulation, acupuncture for persistent pain. Avoid opioids and systemic steroids.</li>
<li><b>Red flags → imaging</b>: history of cancer or weight loss (MRI), fever, injection drug use or immunosuppression (infection), significant trauma or osteoporosis (fracture), progressive neurologic deficit, saddle anesthesia or urinary retention (cauda equina).</li></ul>`},
{h:"Sciatica (lumbar radiculopathy)",html:`
<p>Pain radiating below the knee in a dermatomal pattern, worse with sitting and cough. <b>Straight leg raise</b> (pain at 30–70°) is sensitive; crossed straight leg raise is specific.</p>
<p>Conservative care for about 6 weeks; most resolve. MRI if symptoms persist and an intervention is being considered, or sooner for severe or progressive deficits. Epidural steroid injection for short-term relief. <b>Surgery</b> (discectomy) for cauda equina syndrome, progressive motor deficit, or refractory pain.</p>`},
{h:"Lumbar spinal stenosis",html:`
<p>Older adult with <b>neurogenic claudication</b>: buttock and leg pain, numbness, or weakness with standing or walking, relieved by <b>sitting or leaning forward</b> (walking uphill or pushing a shopping cart is easier). Pulses are normal.</p>
<table><thead><tr><th></th><th>Neurogenic claudication</th><th>Vascular claudication</th></tr></thead><tbody>
<tr><td>Relief</td><td>Sitting or bending forward; standing still does not help</td><td>Standing still</td></tr>
<tr><td>Provoked by</td><td>Standing, walking downhill, extension</td><td>Walking a fixed distance, uphill</td></tr>
<tr><td>Pulses</td><td>Normal</td><td>Diminished; abnormal ankle-brachial index</td></tr></tbody></table>
<p>MRI to confirm. PT (flexion exercises), NSAIDs, epidural steroids; decompressive laminectomy for refractory symptoms.</p>`},
{h:"Neck",html:`
<ul><li><b>Cervical radiculopathy</b>: neck and arm pain in a root distribution; <b>Spurling test</b> (extension, rotation, axial load) reproduces it. Conservative first; most resolve.</li>
<li><b>Cervical spondylotic myelopathy</b>: older adult with neck stiffness, clumsy hands (dropping things, trouble with buttons), gait imbalance, <b>Hoffmann sign</b>, hyperreflexia and Babinski in the legs, LMN signs at the level in the arms; Lhermitte possible. MRI; surgical decompression to halt progression. A normal jaw jerk helps exclude ALS.</li>
<li>Rheumatoid arthritis and Down syndrome: atlantoaxial instability; flexion-extension films before intubation or sports.</li></ul>`},
{h:"Other back pain",html:`
<table><thead><tr><th>Condition</th><th>Clues</th></tr></thead><tbody>
<tr><td>Vertebral compression fracture</td><td>Older adult with osteoporosis or steroid use, sudden pain after minor strain, point tenderness</td></tr>
<tr><td>Ankylosing spondylitis</td><td>Young man, morning stiffness &gt;30 min, improves with exercise, reduced lumbar flexion, uveitis; HLA-B27, sacroiliitis on imaging</td></tr>
<tr><td>Spondylolysis / spondylolisthesis</td><td>Adolescent athlete (gymnast, football lineman) with extension-worsened pain; palpable step-off</td></tr>
<tr><td>Metastatic disease</td><td>Night pain, weight loss, cancer history</td></tr>
<tr><td>Referred pain</td><td>Abdominal aortic aneurysm, pyelonephritis, pancreatitis</td></tr></tbody></table>`}],
pearls:[
["L4–L5 disc herniation compresses which root","L5"],["Weak great toe extension and hip abduction","L5 radiculopathy"],["Absent Achilles reflex with lateral foot numbness","S1 radiculopathy"],
["Weak triceps, absent triceps reflex, numb middle finger","C7 radiculopathy"],["Acute low back pain, no red flags: imaging?","No; stay active and NSAIDs"],
["Leg pain with walking relieved by sitting or leaning on a shopping cart, normal pulses","Lumbar spinal stenosis (neurogenic claudication)"],
["Clumsy hands, positive Hoffmann sign, spastic gait in a 68-year-old","Cervical spondylotic myelopathy"],

{id:"cranial",cat:"nerve",title:"Cranial nerve disorders",
summary:"Facial palsy (peripheral vs central), oculomotor palsies and the pupil rule, Horner syndrome, cavernous sinus, and bulbar vs pseudobulbar palsy.",
sections:[
{h:"Facial palsy",html:`
<table><thead><tr><th></th><th>Peripheral (LMN)</th><th>Central (UMN)</th></tr></thead><tbody>
<tr><td>Forehead</td><td><b>Involved</b> (can't wrinkle forehead or close eye)</td><td><b>Spared</b> (upper face gets bilateral cortical input)</td></tr>
<tr><td>Cause</td><td>Bell palsy, Ramsay Hunt, Lyme, sarcoid, GBS, parotid tumor, temporal bone fracture, otitis media</td><td>Stroke, tumor (with arm weakness, aphasia)</td></tr></tbody></table>
<div class="hy"><p><b>Bell palsy</b>: acute unilateral LMN facial weakness over ≤72 h, ± ear pain, hyperacusis (stapedius), loss of taste (anterior ⅔ tongue), decreased tearing. Treat with <b>oral prednisone within 72 h</b>; add valacyclovir for severe cases; <b>eye protection</b> (lubricant, nighttime taping). No imaging if typical. Most recover within weeks to months.</p></div>
<ul><li><b>Ramsay Hunt</b> (VZV of the geniculate ganglion): vesicles in ear canal or palate, severe ear pain, ± hearing loss and vertigo; antivirals + steroids; worse prognosis.</li>
<li><b>Bilateral</b> facial palsy: Lyme disease, Guillain-Barré, sarcoidosis, HIV, leukemia/lymphoma.</li>
<li>Recurrent, progressive over weeks, or other cranial nerves involved → imaging for tumor.</li></ul>`},
{h:"Eye movement nerves",html:`
<table><thead><tr><th>Nerve</th><th>Findings</th><th>Key causes</th></tr></thead><tbody>
<tr><td>CN III</td><td>Eye down and out, ptosis, ± dilated unreactive pupil</td><td><b>Pupil involved</b>: compression (PComm aneurysm, uncal herniation) → emergent CTA. <b>Pupil spared</b> with complete motor palsy: ischemic microvascular (diabetes, hypertension), recovers in 2–3 months</td></tr>
<tr><td>CN IV</td><td>Vertical diplopia worse looking down and in (reading, stairs); head tilts <b>away</b> from the affected side</td><td>Trauma (most common acquired), congenital, microvascular</td></tr>
<tr><td>CN VI</td><td>Horizontal diplopia worse at distance and looking toward the affected side; eye turned in</td><td>Microvascular; <b>raised ICP</b> (false localizing sign); Wernicke; Gradenigo syndrome (petrous apicitis: CN VI palsy + face pain + otitis); cavernous sinus</td></tr></tbody></table>
<p>Pupillomotor fibers run on the outside of CN III, so compression hits the pupil early; microvascular ischemia hits the core.</p>`},
{h:"Horner syndrome",html:`
<p>Mild ptosis, <b>miosis</b> (anisocoria greater in the dark), ± anhidrosis.</p>
<table><thead><tr><th>Neuron</th><th>Location</th><th>Causes</th></tr></thead><tbody>
<tr><td>First order</td><td>Hypothalamus → brainstem → cord to T1</td><td>Wallenberg syndrome, cord lesion, syrinx</td></tr>
<tr><td>Second order (preganglionic)</td><td>T1 → superior cervical ganglion over the lung apex</td><td><b>Pancoast tumor</b>, neck or thyroid surgery, central line, birth trauma (Klumpke)</td></tr>
<tr><td>Third order (postganglionic)</td><td>Along internal carotid to orbit</td><td><b>Carotid dissection</b> (painful Horner), cavernous sinus lesion, cluster headache</td></tr></tbody></table>
<div class="warn"><p>Acute painful Horner with neck pain = <b>carotid dissection</b> until proven otherwise: CTA or MRA neck. Congenital Horner causes iris heterochromia.</p></div>`},
{h:"Cavernous sinus and skull base",html:`
<ul><li><b>Cavernous sinus</b> contains CN III, IV, V1, V2, VI and sympathetic fibers. Lesions cause painful ophthalmoplegia with facial sensory loss.
<ul><li>Septic cavernous sinus thrombosis: infection of the face, sinuses, or teeth → fever, proptosis, chemosis, bilateral spread. IV antibiotics ± anticoagulation.</li>
<li>Carotid-cavernous fistula: after trauma; pulsatile proptosis, orbital bruit, red eye.</li>
<li>Pituitary apoplexy, tumor, Tolosa-Hunt (granulomatous, steroid-responsive).</li></ul></li>
<li><b>Jugular foramen</b> (CN IX, X, XI): hoarseness, dysphagia, trapezius and SCM weakness; glomus tumor, metastasis.</li>
<li><b>CN XII</b>: tongue deviates <b>toward</b> the lesion with atrophy and fasciculations (LMN).</li>
<li><b>Olfactory groove meningioma</b>: anosmia, ipsilateral optic atrophy, contralateral papilledema (Foster Kennedy).</li>
<li><b>Numb chin syndrome</b>: mental nerve infiltration by metastatic cancer or lymphoma.</li></ul>`},
{h:"Bulbar vs pseudobulbar palsy",html:`
<table><thead><tr><th></th><th>Bulbar (LMN)</th><th>Pseudobulbar (UMN)</th></tr></thead><tbody>
<tr><td>Lesion</td><td>Medulla nuclei, nerves, NMJ, muscle</td><td>Bilateral corticobulbar tracts</td></tr>
<tr><td>Tongue</td><td>Atrophic, fasciculating</td><td>Small, spastic, slow</td></tr>
<tr><td>Jaw jerk, gag</td><td>Absent or reduced</td><td>Brisk</td></tr>
<tr><td>Emotion</td><td>Normal</td><td>Pseudobulbar affect (inappropriate laughing or crying)</td></tr>
<tr><td>Causes</td><td>ALS, myasthenia, GBS, brainstem stroke, polio</td><td>ALS, bilateral strokes, MS, PSP</td></tr></tbody></table>`}],
pearls:[
["Facial weakness sparing the forehead","Central (UMN) lesion: think stroke"],["Bell palsy within 72 h: treatment","Oral prednisone ± valacyclovir and eye protection"],
["Facial palsy with vesicles in the ear canal","Ramsay Hunt syndrome (VZV)"],["Painful CN III palsy with a dilated pupil","Compressive (PComm aneurysm): emergent CTA"],
["Diabetic with complete CN III palsy, normal pupil","Microvascular ischemic CN III palsy"],["Vertical diplopia worse walking downstairs, head tilt","CN IV palsy"],

{id:"neuropathy",cat:"nerve",title:"Peripheral neuropathy, GBS & entrapments",
summary:"Polyneuropathy workup, Guillain-Barré and CIDP, mononeuritis multiplex, the entrapment neuropathies, and brachial plexus injuries.",
sections:[
{h:"Polyneuropathy",html:`
<p>Length-dependent, distal, symmetric sensory loss and paresthesias (stocking-glove), loss of ankle reflexes, later distal weakness. <b>Diabetes</b> is the most common cause in the US; leprosy worldwide.</p>
<div class="hy"><p>Initial labs: <b>glucose or A1c</b> (2-h glucose tolerance test if borderline), <b>B12</b>, <b>serum protein electrophoresis with immunofixation</b>, TSH, metabolic panel. Add HIV, hepatitis C, RPR, ANA, or genetic tests based on context. EMG/NCS for atypical features (asymmetry, motor-predominant, rapid progression).</p></div>
<table><thead><tr><th>Cause</th><th>Clues</th></tr></thead><tbody>
<tr><td>Diabetes</td><td>Distal symmetric; also autonomic (gastroparesis, orthostasis), CN III, diabetic amyotrophy (severe thigh pain then proximal weakness and weight loss)</td></tr>
<tr><td>Alcohol, B12, hypothyroidism, uremia</td><td>Check history and labs</td></tr>
<tr><td>Chemotherapy</td><td>Vincristine (with constipation), cisplatin and oxaliplatin (sensory; oxaliplatin cold-induced), taxanes, bortezomib</td></tr>
<tr><td>Other drugs</td><td><b>Isoniazid</b> (prevent with B6), metronidazole, nitrofurantoin, amiodarone, colchicine, phenytoin, dapsone, linezolid, older HIV nucleosides</td></tr>
<tr><td>Paraprotein / amyloid</td><td>MGUS, myeloma, POEMS; amyloid: autonomic failure, carpal tunnel, painful small-fiber</td></tr>
<tr><td>Charcot-Marie-Tooth</td><td>Family history, <b>pes cavus, hammertoes</b>, distal leg atrophy ("inverted champagne bottle"); CMT1A = PMP22 duplication</td></tr>
<tr><td>Small-fiber neuropathy</td><td>Burning feet, normal strength and reflexes, normal NCS; skin biopsy</td></tr></tbody></table>
<p><b>Mononeuritis multiplex</b>: painful, asymmetric, stepwise deficits in separate named nerves. Causes: vasculitis (PAN, EGPA, granulomatosis with polyangiitis, cryoglobulinemia with hepatitis C), diabetes, sarcoid, Lyme, HIV, leprosy. Nerve biopsy; treat the cause.</p>
<p>Diabetic foot care: annual monofilament exam, daily foot inspection, proper footwear.</p>`},
{h:"Guillain-Barré syndrome",html:`
<p>Days to weeks after an infection (<i>Campylobacter jejuni</i>, CMV, EBV, influenza, Zika): <b>ascending symmetric weakness</b>, <b>areflexia</b>, distal paresthesias, back pain, facial diplegia, dysautonomia (arrhythmia, BP swings), and respiratory failure. Nadir by 4 weeks.</p>
<p><b>Miller Fisher variant</b>: ophthalmoplegia, ataxia, areflexia (anti-GQ1b). AMAN axonal variant follows Campylobacter.</p>
<p><b>Diagnosis</b>: clinical; CSF albuminocytologic dissociation (may be normal in week 1); NCS shows demyelination.</p>
<div class="hy"><ul><li>Admit; follow <b>FVC and negative inspiratory force</b> serially (pulse oximetry is a late sign). Intubate if FVC &lt;20 mL/kg, NIF weaker than −30 cm H₂O, or bulbar weakness with aspiration (20/30/40 rule). Telemetry for autonomic instability.</li>
<li><b>IVIG or plasma exchange</b> (equally effective; don't combine). <b>Steroids do not help.</b></li>
<li>DVT prophylaxis, pain control, rehabilitation. Most recover over months.</li></ul></div>
<p>In a child with ascending paralysis, search the scalp for a tick (tick paralysis).</p>`},
{h:"CIDP",html:`
<p>Chronic inflammatory demyelinating polyneuropathy: progression for <b>more than 8 weeks</b>, symmetric proximal and distal weakness, areflexia, high CSF protein, demyelination on NCS. Unlike GBS, <b>steroids work</b>; IVIG and plasma exchange are alternatives.</p>`},
{h:"Upper limb entrapments",html:`
<table><thead><tr><th>Nerve and site</th><th>Findings</th><th>Notes</th></tr></thead><tbody>
<tr><td>Median at wrist (carpal tunnel)</td><td>Numbness thumb to radial ring finger, worse at night, shaking hand relieves; Phalen and Tinel; thenar atrophy late</td><td>Pregnancy, hypothyroidism, diabetes, RA, amyloid, acromegaly, repetitive use. Night splint in neutral, steroid injection; surgery for weakness or atrophy</td></tr>
<tr><td>Ulnar at elbow (cubital tunnel)</td><td>Numb little and ulnar ring finger, weak intrinsics, clawing, Froment sign</td><td>Leaning on elbows; at Guyon canal in cyclists (sensory dorsal hand spared)</td></tr>
<tr><td>Radial at spiral groove</td><td><b>Wrist drop</b>, finger extension weakness, numb dorsal first web space; triceps spared</td><td>"Saturday night palsy," humeral shaft fracture, crutches (axilla: triceps weak too)</td></tr>
<tr><td>Posterior interosseous</td><td>Finger drop without sensory loss</td><td>Supinator compression</td></tr>
<tr><td>Axillary</td><td>Weak abduction beyond 15°, numb lateral shoulder</td><td>Anterior shoulder dislocation, surgical neck fracture</td></tr>
<tr><td>Long thoracic</td><td>Medial winged scapula</td><td>Mastectomy, axillary node dissection</td></tr></tbody></table>`},
{h:"Lower limb entrapments",html:`
<table><thead><tr><th>Nerve and site</th><th>Findings</th><th>Notes</th></tr></thead><tbody>
<tr><td>Common peroneal (fibular neck)</td><td><b>Foot drop</b>, weak eversion, <b>inversion spared</b>, numb dorsum of foot</td><td>Leg crossing, rapid weight loss, casts, fibular fracture, prolonged squatting</td></tr>
<tr><td>Femoral</td><td>Weak knee extension (and hip flexion if proximal), absent patellar reflex, numb anterior thigh and medial leg</td><td>Retroperitoneal hematoma on anticoagulation, pelvic surgery, lithotomy</td></tr>
<tr><td>Lateral femoral cutaneous (meralgia paresthetica)</td><td>Burning numbness of anterolateral thigh, <b>no weakness</b>, normal reflexes</td><td>Obesity, pregnancy, tight belts, diabetes; remove compression</td></tr>
<tr><td>Obturator</td><td>Weak hip adduction, numb medial thigh</td><td>Pelvic surgery, childbirth</td></tr>
<tr><td>Tibial (tarsal tunnel)</td><td>Burning sole of foot</td><td>Ankle trauma, flat feet</td></tr>
<tr><td>Sciatic</td><td>Weak hamstrings and everything below the knee</td><td>Posterior hip dislocation, misplaced gluteal injection</td></tr></tbody></table>`},
{h:"Brachial plexus",html:`
<ul><li><b>Erb palsy</b> (upper trunk, C5–C6): arm adducted, internally rotated, elbow extended, forearm pronated ("waiter's tip"). Shoulder dystocia with lateral neck traction; fall onto shoulder.</li>
<li><b>Klumpke palsy</b> (lower trunk, C8–T1): claw hand, intrinsic weakness, ± Horner. Arm pulled upward (breech delivery, grabbing a branch while falling); Pancoast tumor; cervical rib (thoracic outlet).</li>
<li><b>Neuralgic amyotrophy</b> (Parsonage-Turner): severe shoulder pain for days, then patchy weakness and atrophy; after infection, vaccination, or surgery; recovers slowly.</li>
<li>Radiation plexopathy (painless, myokymia) vs tumor infiltration (painful, lower trunk, Horner).</li></ul>`}],

{id:"nmj",cat:"nm",title:"Myasthenia gravis, Lambert-Eaton & botulism",
summary:"Fatigable weakness without sensory loss. Know the bedside and confirmatory tests, the drugs that precipitate crisis, and how to manage respiratory failure.",
sections:[
{h:"Myasthenia gravis",html:`
<p>Antibodies against postsynaptic acetylcholine receptors (most), MuSK (women, bulbar-predominant), or LRP4. <b>Fatigable</b> ptosis and diplopia that worsen through the day, bulbar weakness (nasal speech, dysphagia, chewing fatigue), proximal limb and neck weakness. <b>Pupils, sensation, and reflexes are normal.</b></p>
<ul><li>Bedside: <b>ice pack test</b> improves ptosis; sustained upgaze fatigues the lids.</li>
<li>Confirm: AChR antibodies → MuSK antibodies if negative → repetitive nerve stimulation (decrement) → single-fiber EMG (jitter, most sensitive).</li>
<li><b>CT chest</b> for thymoma. Check thyroid function (associated autoimmunity).</li></ul>`},
{h:"MG treatment",html:`
<table><thead><tr><th>Treatment</th><th>Notes</th></tr></thead><tbody>
<tr><td><b>Pyridostigmine</b></td><td>Symptomatic first-line; cholinergic side effects (cramps, diarrhea, sweating, salivation, bradycardia)</td></tr>
<tr><td>Prednisone</td><td>Can transiently worsen weakness when started at a high dose; start low or in hospital</td></tr>
<tr><td>Azathioprine, mycophenolate</td><td>Steroid-sparing; months to work</td></tr>
<tr><td>Complement inhibitors, FcRn blockers, rituximab</td><td>Refractory AChR-positive; rituximab for MuSK</td></tr>
<tr><td><b>Thymectomy</b></td><td>All patients with thymoma; generalized AChR-positive MG in adults under about 65 even without thymoma</td></tr>
<tr><td>IVIG or plasma exchange</td><td>Crisis, rapid worsening, before surgery</td></tr></tbody></table>`},
{h:"Myasthenic crisis",html:`
<div class="warn"><p>Respiratory failure from MG. Triggers: infection, surgery, pregnancy, steroid initiation, tapering, and <b>drugs</b>. Follow <b>FVC and NIF</b>, not oxygen saturation. Intubate early; give IVIG or plasma exchange; hold pyridostigmine while intubated.</p></div>
<p><b>Drugs that worsen MG</b>: aminoglycosides, fluoroquinolones, macrolides, IV magnesium, β-blockers, procainamide, quinidine and quinine, neuromuscular blockers, botulinum toxin, immune checkpoint inhibitors, chloroquine and hydroxychloroquine. Penicillamine can induce MG.</p>
<p>Cholinergic crisis from excess pyridostigmine (miosis, secretions, fasciculations, bradycardia) is rare.</p>
<p><b>Neonatal MG</b>: transient weakness in an infant of a mother with MG from transplacental antibodies; supportive care. <b>Ocular MG</b> often generalizes within 2 years.</p>`},
{h:"Lambert-Eaton myasthenic syndrome",html:`
<p>Antibodies against presynaptic <b>P/Q voltage-gated calcium channels</b>; about half have <b>small cell lung cancer</b>. Proximal leg weakness (trouble rising from a chair) that <b>improves briefly with effort</b>, reduced reflexes that return after exercise, and autonomic symptoms (dry mouth, constipation, erectile dysfunction). Ocular and bulbar involvement is mild.</p>
<p>Tests: VGCC antibodies; incremental response after brief exercise or high-frequency stimulation. Search for cancer (CT chest, PET). Treat the tumor; <b>amifampridine (3,4-diaminopyridine)</b>; immunotherapy if needed.</p>`},
{h:"Botulism",html:`
<p>Toxin blocks presynaptic ACh release. <b>Descending symmetric paralysis</b> starting with the cranial nerves (diplopia, ptosis, dysarthria, dysphagia), <b>dilated poorly reactive pupils</b>, dry mouth, constipation, urinary retention; sensation normal; patient alert; no fever.</p>
<table><thead><tr><th>Form</th><th>Source</th><th>Treatment</th></tr></thead><tbody>
<tr><td>Infant</td><td>Spores in honey or soil; constipation, poor feeding, weak cry, floppy, ptosis</td><td>Human botulism immune globulin (BabyBIG)</td></tr>
<tr><td>Foodborne</td><td>Home-canned or fermented foods; several people sick</td><td>Equine heptavalent antitoxin; notify public health</td></tr>
<tr><td>Wound</td><td>Black tar heroin injection</td><td>Antitoxin, debridement, antibiotics</td></tr></tbody></table>
<p>Avoid aminoglycosides (worsen blockade). Monitor FVC.</p>`}],
pearls:[
["Ptosis and diplopia worse in the evening, normal pupils","Myasthenia gravis"],["MG bedside test","Ice pack test"],["Most sensitive test for MG","Single-fiber EMG (jitter)"],

{id:"muscle",cat:"nm",title:"Motor neuron disease & myopathy",
summary:"ALS and SMA, the inflammatory and toxic myopathies, muscular dystrophies, channelopathies, and metabolic and mitochondrial myopathies.",
sections:[
{h:"Amyotrophic lateral sclerosis",html:`
<p>Progressive <b>UMN and LMN</b> signs in multiple regions: asymmetric limb weakness (often the hand), atrophy, <b>fasciculations</b>, cramps, spasticity, hyperreflexia, bulbar dysarthria and dysphagia, tongue fasciculations. <b>Sensation, eye movements, and sphincters are spared.</b> About 10–15% have frontotemporal dementia. Most sporadic; familial with C9orf72 or SOD1.</p>
<p>EMG: widespread denervation. MRI of the cervical spine to exclude myelopathy (which spares the bulbar region and jaw jerk).</p>
<div class="hy"><ul><li><b>Riluzole</b> (glutamate antagonist) modestly prolongs survival; edaravone; tofersen for SOD1.</li>
<li><b>Noninvasive ventilation</b> (BiPAP) for respiratory insufficiency prolongs survival and improves quality of life.</li>
<li><b>Gastrostomy</b> early, before FVC falls below 50%.</li>
<li>Multidisciplinary clinic; early advance care planning. Sialorrhea: glycopyrrolate or botulinum; pseudobulbar affect: dextromethorphan-quinidine.</li></ul></div>`},
{h:"Other motor neuron disorders",html:`
<ul><li><b>Spinal muscular atrophy</b>: autosomal recessive SMN1 deletion; floppy infant with tongue fasciculations, areflexia, alert face and normal cognition. Treatments: nusinersen, onasemnogene abeparvovec (gene therapy), risdiplam; included in newborn screening.</li>
<li><b>Kennedy disease</b> (spinobulbar muscular atrophy): X-linked CAG repeat in the androgen receptor; bulbar and limb LMN weakness, gynecomastia, testicular atrophy.</li>
<li><b>Post-polio syndrome</b>: new weakness and fatigue decades after polio in previously affected muscles.</li>
<li>Primary lateral sclerosis: pure UMN, slow.</li></ul>`},
{h:"Approach to myopathy",html:`
<p>Symmetric <b>proximal</b> weakness (stairs, rising from a chair, combing hair), normal sensation, reflexes preserved until late. Labs: CK, aldolase, TSH, electrolytes, myositis antibodies. EMG; muscle MRI to choose a biopsy site; biopsy.</p>
<table><thead><tr><th>Disorder</th><th>Clues</th><th>Treatment</th></tr></thead><tbody>
<tr><td>Dermatomyositis</td><td>Heliotrope rash, Gottron papules, shawl sign, mechanic's hands; perifascicular atrophy; interstitial lung disease; <b>malignancy association</b> (ovarian, lung, GI) → age-appropriate cancer screening plus CT</td><td>Steroids + methotrexate or azathioprine; IVIG</td></tr>
<tr><td>Polymyositis / antisynthetase</td><td>No rash; anti-Jo-1 with ILD, arthritis, mechanic's hands, Raynaud</td><td>Steroids + steroid-sparing agent</td></tr>
<tr><td>Immune-mediated necrotizing myopathy</td><td>Very high CK; anti-HMGCR (statin exposure) or anti-SRP; persists after stopping the statin</td><td>Immunotherapy</td></tr>
<tr><td>Inclusion body myositis</td><td>Man &gt;50; asymmetric <b>finger flexor and quadriceps</b> weakness; dysphagia; rimmed vacuoles</td><td>Refractory to steroids; supportive</td></tr>
<tr><td>Statin myopathy</td><td>Myalgias, normal or mildly high CK</td><td>Stop or switch statin</td></tr>
<tr><td>Steroid myopathy</td><td>Proximal weakness, <b>normal CK</b>, chronic glucocorticoids</td><td>Taper steroids, exercise</td></tr>
<tr><td>Hypothyroid myopathy</td><td>Cramps, high CK, slow reflex relaxation</td><td>Thyroid replacement</td></tr>
<tr><td>Critical illness myopathy / polyneuropathy</td><td>ICU, sepsis, steroids and neuromuscular blockers; can't wean from ventilator</td><td>Supportive, rehabilitation</td></tr></tbody></table>`},
{h:"Muscular dystrophies",html:`
<table><thead><tr><th>Dystrophy</th><th>Genetics</th><th>Features</th></tr></thead><tbody>
<tr><td><b>Duchenne</b></td><td>X-linked, frameshift deletion in dystrophin</td><td>Boy aged 2–5, <b>Gowers sign</b>, calf pseudohypertrophy, waddling gait, toe walking, CK very high; dilated cardiomyopathy, scoliosis, respiratory failure by late teens. Genetic testing; <b>glucocorticoids</b> (prednisone or deflazacort) slow decline; exon-skipping for eligible deletions; cardiac and pulmonary surveillance</td></tr>
<tr><td>Becker</td><td>X-linked, in-frame dystrophin deletion</td><td>Later onset, milder, ambulatory into adulthood; cardiomyopathy can dominate</td></tr>
<tr><td><b>Myotonic dystrophy type 1</b></td><td>Autosomal dominant CTG repeat (DMPK), anticipation; severe congenital form from the mother</td><td><b>Distal</b> weakness, <b>myotonia</b> (can't release a handshake), ptosis, facial wasting, frontal balding, <b>cataracts</b>, testicular atrophy, insulin resistance, <b>cardiac conduction block</b> (annual ECG, pacemaker), hypersomnia</td></tr>
<tr><td>Facioscapulohumeral</td><td>Autosomal dominant</td><td>Facial weakness (can't whistle), scapular winging, asymmetric</td></tr>
<tr><td>Limb-girdle</td><td>Various</td><td>Proximal hip and shoulder weakness</td></tr></tbody></table>`},
{h:"Channelopathies and metabolic myopathies",html:`
<ul><li><b>Hypokalemic periodic paralysis</b>: episodic flaccid weakness on waking after a high-carbohydrate meal or rest after exercise; low K⁺ during attacks. Potassium for attacks; acetazolamide to prevent. <b>Thyrotoxic periodic paralysis</b> in young Asian men with hyperthyroidism.</li>
<li><b>Hyperkalemic periodic paralysis</b>: short attacks after rest or potassium-rich food.</li>
<li><b>McArdle disease</b> (myophosphorylase deficiency): exercise intolerance, cramps, "second wind," myoglobinuria; no lactate rise on forearm exercise test.</li>
<li><b>CPT II deficiency</b>: rhabdomyolysis after prolonged exercise or fasting.</li>
<li><b>Mitochondrial</b> (maternal inheritance, ragged red fibers): MELAS (stroke-like episodes, lactic acidosis, seizures), MERRF (myoclonic epilepsy), Kearns-Sayre (ophthalmoplegia, retinitis pigmentosa, heart block before age 20).</li>
<li><b>Malignant hyperthermia</b>: RYR1; succinylcholine or volatile anesthetics → rigidity, hypercarbia, hyperthermia; dantrolene.</li></ul>`}],

{id:"sleep",cat:"sleep",title:"Sleep disorders",
summary:"Insomnia, sleep apnea, narcolepsy, restless legs, parasomnias, and circadian rhythm disorders, with first-line management for each.",
sections:[
{h:"Insomnia",html:`
<p>Trouble initiating or maintaining sleep at least 3 nights a week for 3 months with daytime impairment.</p>
<div class="hy"><p><b>Cognitive behavioral therapy for insomnia (CBT-I)</b> is first-line: stimulus control, sleep restriction, sleep hygiene, cognitive restructuring.</p></div>
<p>Short-term medications: zolpidem or eszopiclone (complex sleep behaviors, falls), orexin antagonists (suvorexant), low-dose doxepin, ramelteon. Avoid benzodiazepines and sedating antihistamines in older adults (falls, delirium). Look for depression, anxiety, OSA, RLS, pain, caffeine, alcohol.</p>`},
{h:"Obstructive sleep apnea",html:`
<p>Snoring, witnessed apneas, gasping, morning headaches, daytime sleepiness; obesity, large neck, retrognathia. Associated with resistant hypertension, atrial fibrillation, heart failure, stroke, motor vehicle crashes.</p>
<ul><li>Diagnosis: polysomnography, or home sleep apnea testing when uncomplicated. AHI ≥15, or ≥5 with symptoms or comorbidities.</li>
<li>Treatment: <b>CPAP</b>; weight loss; positional therapy; oral appliance; hypoglossal nerve stimulation; surgery in selected patients.</li>
<li><b>Central sleep apnea</b>: heart failure (Cheyne-Stokes), opioids, high altitude, brainstem lesions.</li></ul>`},
{h:"Narcolepsy",html:`
<p>Excessive daytime sleepiness with irresistible sleep attacks, plus:</p>
<ul><li><b>Cataplexy</b> (type 1): sudden bilateral loss of muscle tone triggered by laughter or strong emotion, with preserved consciousness</li>
<li>Hypnagogic (falling asleep) or hypnopompic (waking) hallucinations; sleep paralysis; fragmented nighttime sleep</li></ul>
<p>Loss of hypothalamic <b>hypocretin (orexin)</b> neurons; low CSF hypocretin; HLA-DQB1*06:02.</p>
<div class="hy"><p><b>Diagnosis</b>: overnight polysomnography (to exclude other causes) followed the next day by a <b>multiple sleep latency test</b>: mean sleep latency ≤8 min with ≥2 sleep-onset REM periods. <b>Treatment</b>: scheduled naps; modafinil or armodafinil, solriamfetol, pitolisant, stimulants; <b>sodium oxybate</b> treats both sleepiness and cataplexy; SNRIs or TCAs also suppress cataplexy.</p></div>`},
{h:"Restless legs syndrome",html:`
<p>Urge to move the legs with unpleasant sensations, <b>worse at rest and in the evening</b>, relieved by movement. Often with periodic limb movements of sleep.</p>
<ul><li>Secondary causes: <b>iron deficiency</b>, CKD, pregnancy, neuropathy. Worsened by antihistamines, dopamine antagonists, SSRIs, TCAs, mirtazapine.</li>
<li><b>Check ferritin and iron studies</b>; replace iron if ferritin ≤75 ng/mL or transferrin saturation &lt;20%.</li>
<li>Medication: α2δ ligands (gabapentin enacarbil, pregabalin, gabapentin) are preferred first. Dopamine agonists work but cause <b>augmentation</b> (symptoms earlier in the day and more intense) over time.</li></ul>`},
{h:"Parasomnias",html:`
<table><thead><tr><th></th><th>NREM parasomnias</th><th>REM sleep behavior disorder</th><th>Nightmare disorder</th></tr></thead><tbody>
<tr><td>Examples</td><td>Sleepwalking, sleep terrors, confusional arousals</td><td>Dream enactment: punching, kicking, shouting</td><td>Frightening dreams</td></tr>
<tr><td>Timing</td><td>First third of night (N3)</td><td>Later in the night (REM)</td><td>Later in the night (REM)</td></tr>
<tr><td>Who</td><td>Children</td><td>Men over 50</td><td>Any; PTSD</td></tr>
<tr><td>Recall</td><td>None; inconsolable during terrors</td><td>Recalls the dream; wakes quickly</td><td>Vivid recall</td></tr>
<tr><td>Management</td><td>Reassurance, safety, regular sleep</td><td>Bedroom safety; <b>melatonin</b> or clonazepam. Strong predictor of Parkinson disease, Lewy body dementia, or MSA</td><td>Imagery rehearsal therapy; prazosin in PTSD</td></tr></tbody></table>
<p>Polysomnography shows REM sleep without atonia in REM sleep behavior disorder.</p>`},
{h:"Circadian rhythm and sleep across life",html:`
<ul><li><b>Delayed sleep-wake phase</b>: adolescents who can't fall asleep until 2–3 a.m. and sleep normally if allowed to wake late. Evening melatonin (early), bright morning light, fixed wake time.</li>
<li><b>Advanced phase</b>: older adults sleepy at 7 p.m., awake at 3 a.m. Evening light exposure.</li>
<li><b>Shift work disorder</b>: light management, scheduled naps, modafinil.</li>
<li><b>Normal aging</b>: less slow-wave (N3) sleep, more awakenings, earlier sleep timing.</li>
<li>Alcohol shortens sleep latency but suppresses REM and fragments the second half of the night; benzodiazepines reduce N3.</li></ul>`}],
pearls:[
["Chronic insomnia first-line treatment","CBT for insomnia"],["Cataplexy triggered by","Laughter or strong emotion"],["Test sequence for narcolepsy","Polysomnography, then multiple sleep latency test"],
