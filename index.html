<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Neurology Shelf Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: reference-book reader. Fixed index rail on the left, one reading column, sticky tool bar. */
:root{
  --paper:#F3F5F7; --panel:#FFFFFF; --ink:#141C26; --ink-2:#4A5563; --ink-3:#7A8594; --line:#D9DEE5;
  --accent:#2846C8; --accent-soft:#E4E9FB; --hy:#9A5B00; --hy-soft:#FBEFD9;
  --ok:#1C7448; --ok-soft:#E0F2E8; --bad:#B4232F; --bad-soft:#FBE4E6;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail:288px; --top:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F141A; --panel:#161D26; --ink:#E6EAF0; --ink-2:#A3AEBC; --ink-3:#778393; --line:#273241;
  --accent:#93A7FF; --accent-soft:#1D2648; --hy:#F0B44C; --hy-soft:#2D2413;
  --ok:#53C98F; --ok-soft:#12291E; --bad:#FF7F89; --bad-soft:#34161A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141A; --panel:#161D26; --ink:#E6EAF0; --ink-2:#A3AEBC; --ink-3:#778393; --line:#273241;
  --accent:#93A7FF; --accent-soft:#1D2648; --hy:#F0B44C; --hy-soft:#2D2413;
  --ok:#53C98F; --ok-soft:#12291E; --bad:#FF7F89; --bad-soft:#34161A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;
  background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{font:600 20px/1 var(--f-display);letter-spacing:-.01em}
.brand span{font:500 11px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.modes{display:flex;gap:2px;margin-left:8px}
.modes button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px}
.modes button:hover{background:var(--paper);color:var(--ink)}
.modes button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.search{margin-left:auto;position:relative;flex:0 1 300px;min-width:0}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 10px 0 32px;font:inherit;font-size:14px;color:var(--ink)}
.search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;width:36px;height:36px;cursor:pointer}
.menu-btn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100% - var(--top))}
.rail{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));overflow-y:auto;
  border-right:1px solid var(--line);background:var(--panel);padding:14px 10px 40px max(10px,env(safe-area-inset-left,0px))}
.rail h4{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:16px 10px 4px}
.rail h4:first-child{margin-top:4px}
.rail a{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14px;line-height:1.35}
.rail a:hover{background:var(--paper);color:var(--ink)}
.rail a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a .dot{flex:none;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line)}
.rail a .dot.done{background:var(--ok);border-color:var(--ok)}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:820px;margin:0 auto}
.wide{max-width:1040px;margin:0 auto}

/* type */
h1,h2,h3{text-wrap:balance}
h1{font:600 clamp(30px,4.2vw,42px)/1.1 var(--f-display);letter-spacing:-.015em;margin:6px 0 12px}
h2{font:600 24px/1.2 var(--f-display);margin:0 0 10px;letter-spacing:-.005em}
h3{font-size:15px;font-weight:700;margin:16px 0 4px}
.eyebrow{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lede{font-size:17px;color:var(--ink-2);max-width:64ch;margin:0}
p{margin:0 0 10px;max-width:70ch}
ul,ol{margin:4px 0 10px;padding-left:20px}
li{margin:3px 0}
li::marker{color:var(--ink-3)}
b,strong{font-weight:700}

/* topic */
.topic-head{display:flex;flex-direction:column;gap:2px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.topic-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.toc a{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--ink-2)}
.toc a:hover{color:var(--accent);border-color:var(--accent)}
.sec{padding:22px 0 10px;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--top) + 16px)}
.sec:last-of-type{border-bottom:0}
.hy{background:var(--hy-soft);border-left:3px solid var(--hy);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0 12px}
.hy::before{content:"High yield";display:block;font:500 10.5px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hy);margin-bottom:2px}
.hy p:last-child,.hy ul:last-child{margin-bottom:0}
.warn{background:var(--bad-soft);border-left:3px solid var(--bad);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0 12px}
.warn::before{content:"Don't miss";display:block;font:500 10.5px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-bottom:2px}
.tbl{overflow-x:auto;margin:8px 0 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.45}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font:500 11px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--paper)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.recall{display:grid;gap:6px;margin-top:8px}
.recall button{display:grid;grid-template-columns:1fr;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 12px;cursor:pointer}
.recall button .a{color:var(--ink-2);margin-top:4px;padding-top:6px;border-top:1px dashed var(--line)}
.recall button:hover{border-color:var(--accent)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start;margin-bottom:28px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.bp-row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bp-bar{grid-column:1/-1;height:6px;background:var(--paper);border-radius:3px;position:relative;margin-top:-4px}
.bp-bar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px;opacity:.85}
.bp-bar i.lo{background:var(--accent);opacity:.35}
.bp-row .mono{text-align:right;color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.stat b{display:block;font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.grid-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cat-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.cat-card h3{margin:0 0 6px;font:600 17px/1.25 var(--f-display)}
.cat-card a{display:block;font-size:14px;text-decoration:none;color:var(--ink-2);padding:2px 0}
.cat-card a:hover{color:var(--accent)}
.tabs-tag{font:500 11px/1 var(--f-mono);color:var(--ink-3)}

/* quiz */
.qsetup{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:14px}
select,input[type=number]{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qprog{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent)}
.stem{font-size:16px;line-height:1.65;margin-bottom:14px;max-width:72ch}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font:500 13px/1.45 var(--f-mono);color:var(--ink-3)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.ok .l{color:var(--ok)} .opt.bad .l{color:var(--bad)}
.opt:disabled{cursor:default}
.exp{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.exp .verdict{font-weight:700;margin-bottom:6px}
.exp .verdict.ok{color:var(--ok)} .exp .verdict.bad{color:var(--bad)}
.qnav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}

/* cards */
.flash{perspective:1200px;margin:10px 0 14px}
.fcard{min-height:240px;display:grid;place-items:center;text-align:center;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:18px;line-height:1.5}
.fcard .side{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.fcard .back{color:var(--ink);font-size:17px}
.fcard .front{font:500 22px/1.35 var(--f-display)}

/* search */
.result{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.result b{display:block}
.result span{color:var(--ink-2);font-size:14px}
mark{background:var(--hy-soft);color:inherit;padding:0 2px;border-radius:2px}

/* localize */
.loc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
.diagram svg{display:block;width:100%;height:auto}
.vf-site{cursor:pointer}
.finds{display:flex;flex-wrap:wrap;gap:6px}
.match{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);margin-bottom:8px}
.match .score{font:500 12px/1 var(--f-mono);color:var(--accent)}
.roots td.hide{color:transparent;background:var(--paper);cursor:pointer;text-shadow:none}
.roots td.hide::after{content:"tap";color:var(--ink-3);font:500 11px var(--f-mono)}

/* figures */
.fig{margin:16px 0 18px;padding:14px 14px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.fig svg{display:block;width:100%;height:auto;margin:0 auto;max-width:var(--fw,720px)}
.fig figcaption{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin-top:10px;max-width:72ch}
.fig figcaption b{color:var(--ink)}
.fig .chips{margin-bottom:12px}
.fig-detail{margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.fig-detail ul{margin:4px 0 0}
.fig-detail p{margin:0 0 4px}
.fig-scroll{overflow-x:auto}
.fig-scroll svg{min-width:560px}
.fig-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-top:8px}
.fig-legend ol{margin:0;padding-left:20px}
svg .ln{fill:none;stroke:currentColor;stroke-width:1.6}
svg .mu{fill:none;stroke:var(--ink-3);stroke-width:1.2}
svg .dash{stroke-dasharray:5 4}
svg .ac{fill:none;stroke:var(--accent);stroke-width:2.2}
svg .bx{fill:var(--paper);stroke:var(--ink-3);stroke-width:1.2}
svg .bxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
svg .gm{fill:var(--line);stroke:var(--ink-3);stroke-width:1}
svg .rg{fill:var(--paper);stroke:var(--ink-3);stroke-width:1.1}
svg .rg.on,svg .bx.on,svg .bxa.on{fill:var(--bad);fill-opacity:.45;stroke:var(--bad);stroke-width:1.8}
svg .ln.on,svg .ac.on,svg .mu.on{stroke:var(--bad);stroke-width:3}
svg .hot{fill:var(--bad);fill-opacity:.5;stroke:var(--bad);stroke-width:1.4}
svg .x{stroke:var(--bad);stroke-width:3.2;stroke-linecap:round;fill:none}
svg .fa{fill:var(--accent)} svg .fi{fill:currentColor}
svg text{fill:var(--ink);font:500 12px var(--f-body)}
svg .ts{fill:var(--ink-2);font-size:11px}
svg .tm{fill:var(--ink-3);font:500 10px var(--f-mono);letter-spacing:.04em}
svg .tb{font-weight:700}
svg .ta{fill:var(--accent)}
svg .tr{fill:var(--bad)}
svg .trace{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round}
svg .grid{stroke:var(--line);stroke-width:1}
svg .bar{fill:var(--accent)}
svg .bar2{fill:var(--accent);fill-opacity:.3}
svg .barh{fill:var(--hy)}
svg [data-pick]{cursor:pointer}
svg .rgt{fill:transparent;stroke-dasharray:3 3}
svg .xm{opacity:0}svg .xm.on{opacity:1}
svg .hit{fill:none;stroke:transparent;stroke-width:14}
svg [data-pick]:focus-visible{outline:2px solid var(--accent)}
.cov td:nth-child(3),.cov td:nth-child(4){font-family:var(--f-mono);font-size:12.5px;text-align:right;white-space:nowrap}
.cov td a{white-space:nowrap}
.fig .diagram{border:0;padding:0;background:none}
.fig .panel{border:0;padding:4px 0 0;background:none}

/* modules */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 2px;padding:0;list-style:none}
.step{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font:500 12px var(--f-mono);color:var(--ink-2)}
.step.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.step.cur i{background:var(--accent);color:var(--panel)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.step:disabled{opacity:.45;cursor:not-allowed}
.step .mono{font-weight:400;font-size:11.5px;color:var(--ink-3)}
.learn-top{display:flex;align-items:center;gap:12px;margin:18px 0 0}
.learn-top .mono{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.ck-wrap{margin:8px 0 4px;padding:16px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent)}
.ck-wrap>.eyebrow{color:var(--accent)}
.ck{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;margin:10px 0}
.ck-q{font-size:15.5px;line-height:1.55;margin:4px 0 10px;max-width:72ch}
.ck-ans{font-size:16px;font-weight:600;margin:6px 0 8px;padding:10px 12px;border-radius:8px;background:var(--paper)}
.ck-fb{font-weight:600;margin:10px 0 0}
.ck-fb.ok{color:var(--ok)} .ck-fb.bad{color:var(--bad)}
.ck-why{margin:4px 0 0;font-size:14px;color:var(--ink-2);max-width:72ch}
.blank{display:inline-block;min-width:72px;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center;padding:0 4px}
.rc-in{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;padding:8px 10px;margin:4px 0 0;resize:vertical}
.cloze-on .sec-body>p b,.cloze-on .sec-body>ul li b,.cloze-on .sec-body>ol li b,.cloze-on .sec-body>.hy b,.cloze-on .sec-body>.warn b{color:transparent;background:var(--hy-soft);box-shadow:inset 0 -2px 0 var(--hy);border-radius:3px;cursor:pointer}
.cloze-on .sec-body b.shown{color:inherit;background:none;box-shadow:none}
.tq-on .sec-body>.tbl td:not(:first-child){color:transparent;background:var(--paper);cursor:pointer}
.tq-on .sec-body>.tbl td.shown{color:inherit;background:none}
.sum-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:10px;align-items:center;font-size:14px;margin:9px 0}
.sum-row .mono{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.sum-bar{grid-column:1/-1;height:8px;background:var(--paper);border-radius:4px;margin-top:-5px;overflow:hidden}
.sum-bar i{display:block;height:100%;background:var(--accent)}
.miss{display:block;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rail a .dot.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.fig-quiz{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.fig-quiz .fq-prompt{font-size:13.5px;color:var(--ink-2)}
.fig-quiz .fq-score{font:500 12px var(--f-mono);color:var(--ink-3)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:600}

/* recall exercises */
.rx-wrap{border:1px solid var(--accent);border-radius:12px;padding:16px;background:var(--panel)}
.rx-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:baseline;margin-bottom:10px;font-size:14.5px}

<script>/* topics-1.js */
NEURO.topics.push(
{id:"localization",cat:"found",title:"Lesion localization & the exam",
summary:"Answer two questions in order: where is the lesion, and what is it? Pattern of deficits gives the where; tempo of onset gives the what.",
sections:[
{h:"Where, then what",html:`
<ul><li><b>Tempo → etiology.</b> Seconds to minutes: vascular, seizure, trauma. Hours to days: infection, inflammation, metabolic, toxic. Weeks to months: neoplasm, compressive. Months to years: degenerative.</li>
<li><b>Laterality.</b> Unilateral face + arm + leg: brain. Crossed findings (cranial nerve on one side, body on the other): brainstem. Bilateral with a sensory level or bladder involvement: spinal cord. Symmetric distal: polyneuropathy. Fatigable, no sensory loss: neuromuscular junction. Proximal symmetric, no sensory loss, normal reflexes: muscle.</li></ul>`},
{h:"Upper vs lower motor neuron",html:`
<table><thead><tr><th>Feature</th><th>UMN (brain, cord)</th><th>LMN (anterior horn, root, nerve)</th></tr></thead><tbody>
<tr><td>Tone</td><td>Spastic (velocity-dependent), clasp-knife</td><td>Flaccid, decreased</td></tr>
<tr><td>Reflexes</td><td>Hyperreflexia, clonus, Babinski, Hoffmann</td><td>Hypo- or areflexia</td></tr>
<tr><td>Bulk</td><td>Mild disuse atrophy, late</td><td>Marked atrophy</td></tr>
<tr><td>Fasciculations</td><td>Absent</td><td>Present (especially anterior horn)</td></tr>
<tr><td>Weakness pattern</td><td>Extensors of arm, flexors of leg ("pyramidal")</td><td>In distribution of the root or nerve</td></tr></tbody></table>
<div class="hy"><p>Acute UMN lesions (stroke, cord shock) can be flaccid and areflexic for days before spasticity appears. Mixed UMN + LMN signs in the same limb without sensory loss = <b>ALS</b>. UMN signs in legs + LMN signs at one arm level = cervical myelopathy/radiculopathy.</p></div>`},
{h:"Localization by level",html:`
<table><thead><tr><th>Level</th><th>Clues</th></tr></thead><tbody>
<tr><td>Cortex</td><td>Aphasia, neglect, apraxia, cortical sensory loss (agraphesthesia, astereognosis), visual field cut, seizures; face and arm worse than leg (MCA) or leg worse than arm (ACA)</td></tr>
<tr><td>Internal capsule</td><td>Pure motor face = arm = leg, no cortical signs</td></tr>
<tr><td>Thalamus</td><td>Contralateral hemisensory loss of all modalities; later thalamic pain</td></tr>
<tr><td>Brainstem</td><td>Crossed signs, diplopia, vertigo, dysarthria, dysphagia, ataxia</td></tr>
<tr><td>Cerebellum</td><td>Ipsilateral limb ataxia, dysmetria, intention tremor, dysdiadochokinesia (hemisphere); truncal and gait ataxia (vermis)</td></tr>
<tr><td>Spinal cord</td><td>Sensory level, bilateral weakness, bowel/bladder, UMN signs below level, LMN signs at level</td></tr>
<tr><td>Root</td><td>Radiating pain, dermatomal sensory loss, single reflex lost, myotomal weakness</td></tr>
<tr><td>Peripheral nerve</td><td>Stocking-glove (polyneuropathy) or single-nerve territory (mononeuropathy)</td></tr>
<tr><td>Neuromuscular junction</td><td>Fatigable ptosis, diplopia, bulbar and proximal weakness; normal sensation and reflexes</td></tr>
<tr><td>Muscle</td><td>Symmetric proximal weakness, normal sensation, reflexes preserved until late, ± elevated CK</td></tr></tbody></table>`},
{h:"Reflexes and signs",html:`
<table><thead><tr><th>Reflex</th><th>Root</th></tr></thead><tbody>
<tr><td>Biceps</td><td>C5–C6</td></tr><tr><td>Brachioradialis</td><td>C6</td></tr><tr><td>Triceps</td><td>C7</td></tr><tr><td>Patellar</td><td>L4 (L2–L4)</td></tr><tr><td>Achilles</td><td>S1</td></tr></tbody></table>
<p>Grading: 0 absent, 1+ trace, 2+ normal, 3+ brisk with spread, 4+ clonus. A brisk <b>jaw jerk</b> places UMN disease above the foramen magnum and helps separate ALS from cervical myelopathy.</p>
<p><b>Romberg</b> tests proprioception, not the cerebellum: steady with eyes open but falls with eyes closed = dorsal column or large-fiber neuropathy (B12, tabes dorsalis). Cerebellar patients are unsteady with eyes open too.</p>
<p><b>Gaze deviation:</b> a destructive hemispheric lesion pulls the eyes <i>toward</i> the lesion (away from the weak side); a seizure focus pushes them <i>away</i>; a pontine lesion pulls them <i>toward the weak side</i>.</p>`},
{h:"Cortical syndromes",html:`
<table><thead><tr><th>Aphasia</th><th>Fluency</th><th>Comprehension</th><th>Repetition</th><th>Site</th></tr></thead><tbody>
<tr><td>Broca (expressive)</td><td>Nonfluent, effortful</td><td>Intact</td><td>Impaired</td><td>Inferior frontal gyrus; superior MCA division; often with right face/arm weakness</td></tr>
<tr><td>Wernicke (receptive)</td><td>Fluent, paraphasic, word salad</td><td>Impaired</td><td>Impaired</td><td>Superior temporal gyrus; inferior MCA division; patient unaware</td></tr>
<tr><td>Conduction</td><td>Fluent</td><td>Intact</td><td>Very impaired</td><td>Arcuate fasciculus / supramarginal gyrus</td></tr>
<tr><td>Global</td><td>Nonfluent</td><td>Impaired</td><td>Impaired</td><td>Large MCA stem</td></tr>
<tr><td>Transcortical motor / sensory</td><td>Nonfluent / fluent</td><td>Intact / impaired</td><td><b>Preserved</b></td><td>Watershed zones (ACA–MCA / MCA–PCA)</td></tr></tbody></table>
<ul><li><b>Dominant parietal (angular gyrus):</b> Gerstmann syndrome: agraphia, acalculia, finger agnosia, left–right confusion.</li>
<li><b>Nondominant parietal:</b> hemineglect, anosognosia, constructional and dressing apraxia.</li>
<li><b>Frontal:</b> disinhibition or abulia, perseveration, frontal release signs (grasp, snout), magnetic gait, urinary incontinence.</li>
<li><b>Bilateral medial temporal / hippocampus:</b> anterograde amnesia.</li></ul>`},
{h:"Normal aging on exam",html:`
<p>The outline lists normal age-related findings. These are expected in older adults and do not by themselves need workup:</p>
<ul><li>Reduced vibration sense at the toes; ankle reflexes reduced or absent</li><li>Mildly limited upgaze; smaller, more sluggish pupils; presbyopia and presbycusis</li><li>Slower processing speed and word retrieval with preserved function (independent in daily activities)</li><li>Mildly stooped posture, shorter stride; slightly increased sway</li></ul>
<div class="warn"><p>Not normal aging: loss of independence in instrumental activities (finances, medications), new focal signs, asymmetric findings, rapidly progressive decline, or falls with a shuffling gait.</p></div>`}],
pearls:[
["Crossed signs (ipsilateral cranial nerve, contralateral body) localize to?","The brainstem"],
["Romberg positive means a lesion where?","Proprioception: dorsal columns or large-fiber peripheral nerves, not cerebellum"],
["Fluent aphasia, poor repetition, intact comprehension","Conduction aphasia: arcuate fasciculus"],
["Aphasia with preserved repetition","Transcortical aphasia (watershed infarct)"],
["Agraphia, acalculia, finger agnosia, left–right confusion","Gerstmann syndrome: dominant angular gyrus"],
["Eyes deviated to the left with right hemiparesis","Left hemispheric destructive lesion (eyes look toward the lesion)"],
["Achilles reflex root","S1"],["Triceps reflex root","C7"],
["Mixed UMN and LMN signs, no sensory loss","ALS"]]},

{id:"diagnostics",cat:"found",title:"CSF, imaging, EEG & EMG",
summary:"Which test to order first and how to read it: lumbar puncture patterns, CT versus MRI, the EEG signatures that are tested, and nerve conduction basics.",
sections:[
{h:"CSF patterns",html:`
<table><thead><tr><th>Condition</th><th>Opening pressure</th><th>Cells</th><th>Protein</th><th>Glucose</th></tr></thead><tbody>
<tr><td>Normal</td><td>6–20 cm H₂O</td><td>&lt;5 lymphocytes</td><td>15–45 mg/dL</td><td>~⅔ of serum</td></tr>
<tr><td>Bacterial meningitis</td><td>↑</td><td>↑↑ neutrophils (often &gt;1000)</td><td>↑↑</td><td>↓ (&lt;40, CSF:serum &lt;0.4)</td></tr>
<tr><td>Viral meningitis</td><td>Normal or mild ↑</td><td>↑ lymphocytes (early may be PMN)</td><td>Normal or mild ↑</td><td>Normal</td></tr>
<tr><td>HSV encephalitis</td><td>↑</td><td>Lymphocytes + RBCs</td><td>↑</td><td>Normal</td></tr>
<tr><td>TB / fungal</td><td>↑ (very high in cryptococcus)</td><td>↑ lymphocytes</td><td>↑↑</td><td>↓</td></tr>
<tr><td>Guillain-Barré</td><td>Normal</td><td>Normal (&lt;10)</td><td>↑ (albuminocytologic dissociation)</td><td>Normal</td></tr>
<tr><td>Subarachnoid hemorrhage</td><td>↑</td><td>RBCs that do not clear tube 1→4</td><td>↑</td><td>Normal</td></tr>
<tr><td>Multiple sclerosis</td><td>Normal</td><td>Normal or mild lymphocytes</td><td>Normal or mild ↑</td><td>Normal</td></tr>
<tr><td>Idiopathic intracranial hypertension</td><td>&gt;25 cm H₂O</td><td>Normal</td><td>Normal or low</td><td>Normal</td></tr></tbody></table>
<p>Xanthochromia (yellow supernatant from bilirubin) appears several hours after SAH and distinguishes true hemorrhage from a traumatic tap. Oligoclonal bands present in CSF but not serum support MS.</p>`},
{h:"Before the needle",html:`
<div class="hy"><p>Get a <b>CT before LP</b> if any of: immunocompromise, known CNS lesion, seizure within the past week, papilledema, altered consciousness, or focal deficit. If CT is needed in suspected bacterial meningitis, draw blood cultures and <b>give dexamethasone and antibiotics before the CT</b>.</p></div>
<ul><li>Contraindications: mass effect or obstructive hydrocephalus, uncorrected coagulopathy or low platelets, infection over the site.</li>
<li><b>Post-LP headache</b>: worse upright, relieved lying flat, within 48 h. Reduced with atraumatic (pencil-point) needles. Treat with fluids, caffeine, analgesics; epidural blood patch if persistent.</li></ul>`},
{h:"Choosing imaging",html:`
<table><thead><tr><th>Scenario</th><th>First study</th></tr></thead><tbody>
<tr><td>Acute stroke symptoms</td><td>Noncontrast CT head (rule out bleed) ± CTA head/neck for large-vessel occlusion</td></tr>
<tr><td>Thunderclap headache</td><td>Noncontrast CT; LP if CT negative and &gt;6 h from onset; then CTA</td></tr>
<tr><td>Head trauma</td><td>Noncontrast CT</td></tr>
<tr><td>Suspected MS, tumor, posterior fossa lesion, encephalitis</td><td>MRI with and without gadolinium</td></tr>
<tr><td>Acute ischemia confirmation</td><td>MRI diffusion-weighted imaging (bright within minutes)</td></tr>
<tr><td>Venous sinus thrombosis</td><td>MR or CT venography</td></tr>
<tr><td>Cord compression</td><td>Emergent MRI of the whole spine</td></tr>
<tr><td>Primary headache with normal exam; low back pain &lt;6 weeks without red flags</td><td>No imaging</td></tr></tbody></table>
<p>Ring-enhancing lesions: metastasis, glioblastoma, abscess, toxoplasmosis (HIV, multiple, basal ganglia), tumefactive MS, subacute infarct or hematoma.</p>`},
{h:"EEG signatures",html:`
<table><thead><tr><th>Pattern</th><th>Association</th></tr></thead><tbody>
<tr><td>3 Hz generalized spike-and-wave, provoked by hyperventilation</td><td>Childhood absence epilepsy</td></tr>
<tr><td>Hypsarrhythmia (chaotic high-voltage slowing with multifocal spikes)</td><td>Infantile spasms (West syndrome)</td></tr>
<tr><td>Generalized 4–6 Hz polyspike-and-wave, photosensitive</td><td>Juvenile myoclonic epilepsy</td></tr>
<tr><td>Centrotemporal spikes, activated in sleep</td><td>Self-limited epilepsy with centrotemporal spikes (benign rolandic)</td></tr>
<tr><td>Slow spike-and-wave (&lt;2.5 Hz)</td><td>Lennox-Gastaut syndrome</td></tr>
<tr><td>Periodic lateralized discharges over a temporal lobe</td><td>HSV encephalitis</td></tr>
<tr><td>Periodic sharp-wave complexes (~1 Hz)</td><td>Creutzfeldt-Jakob disease</td></tr>
<tr><td>Triphasic waves</td><td>Hepatic, uremic, or other metabolic encephalopathy</td></tr>
<tr><td>Diffuse slowing</td><td>Delirium, encephalopathy</td></tr></tbody></table>
<p>A normal interictal EEG does not exclude epilepsy; sleep-deprived or prolonged video EEG raises yield. Video EEG is the test of choice for suspected psychogenic nonepileptic seizures.</p>`},
{h:"Nerve conduction and EMG",html:`
<ul><li><b>Axonal neuropathy</b> (diabetes, toxins, critical illness): reduced amplitudes, near-normal conduction velocity.</li>
<li><b>Demyelinating neuropathy</b> (GBS, CIDP, CMT1): slowed velocities, prolonged distal and F-wave latencies, conduction block, temporal dispersion.</li>
<li><b>Myasthenia gravis:</b> decremental response on slow repetitive stimulation; single-fiber EMG jitter is the most sensitive test.</li>
<li><b>Lambert-Eaton:</b> low baseline amplitudes that <b>increase</b> after brief exercise or fast repetitive stimulation.</li>
<li><b>Myopathy:</b> small, short, polyphasic motor units with early recruitment. <b>Neurogenic:</b> large, long, polyphasic units with reduced recruitment, fibrillations and fasciculations (ALS).</li></ul>`}],
pearls:[
["CSF: high protein, normal cell count","Albuminocytologic dissociation: Guillain-Barré syndrome"],
["CSF: low glucose, lymphocytes, very high protein, basilar enhancement","Tuberculous meningitis"],
["EEG periodic sharp-wave complexes with rapidly progressive dementia and myoclonus","Creutzfeldt-Jakob disease"],
["EEG triphasic waves","Metabolic encephalopathy (classically hepatic)"],
["Hyperventilation provokes 3 Hz spike-and-wave","Childhood absence epilepsy"],
["Incremental response after exercise on repetitive stimulation","Lambert-Eaton myasthenic syndrome"],
["Positional headache after LP, persistent despite conservative care","Epidural blood patch"],
["Suspected meningitis, needs CT first: what comes before the CT?","Blood cultures, then dexamethasone + empiric antibiotics"]]},

{id:"stroke",cat:"cv",title:"Acute ischemic stroke & TIA",
summary:"Time is brain. Check glucose, get a noncontrast CT, decide on thrombolysis and thrombectomy, then find the mechanism and prevent the next one.",
sections:[
{h:"First ten minutes",html:`
<ol><li>ABCs; <b>fingerstick glucose</b> (hypoglycemia mimics stroke).</li><li>Establish <b>last known well</b>, not time found.</li><li>NIH Stroke Scale.</li><li><b>Noncontrast CT head</b> to exclude hemorrhage; early ischemia is often invisible.</li><li>CTA head and neck if a large-vessel occlusion is possible.</li></ol>
<p>Mimics: hypoglycemia, postictal (Todd) paralysis, complicated migraine, conversion disorder, Bell palsy, tumor, sepsis unmasking an old stroke.</p>`},
{h:"IV thrombolysis",html:`
<div class="hy"><p>Disabling deficit within <b>4.5 h</b> of last known well → alteplase 0.9 mg/kg (max 90 mg, 10% bolus then infusion over 60 min) or tenecteplase single bolus. BP must be <b>&lt;185/110</b> before and <b>&lt;180/105</b> for 24 h after. No antithrombotics for 24 h after.</p></div>
<p><b>Contraindications</b> (classic exam list): hemorrhage on CT; prior ICH; ischemic stroke or significant head trauma within 3 months; intracranial or intraspinal surgery within 3 months; intracranial neoplasm, AVM, or aneurysm; GI bleed or GI malignancy within 21 days; active bleeding; platelets &lt;100,000; INR &gt;1.7; therapeutic LMWH within 24 h; DOAC within 48 h; glucose &lt;50; suspected aortic dissection or endocarditis; BP not controllable below 185/110.</p>
<p>Lower BP with IV labetalol or nicardipine to qualify. Complications: symptomatic ICH (stop infusion, CT, cryoprecipitate, consider tranexamic acid) and orolingual angioedema (higher with ACE inhibitors).</p>`},
{h:"Mechanical thrombectomy",html:`
<ul><li>Large-vessel occlusion (internal carotid, M1 MCA; basilar) with disabling deficit.</li><li>Within <b>6 h</b>; up to <b>24 h</b> if perfusion imaging shows salvageable tissue (small core, large penumbra).</li><li>Give IV thrombolysis first if eligible; do not wait to see if it works.</li></ul>`},
{h:"If no thrombolysis",html:`
<ul><li><b>Permissive hypertension</b>: treat only if &gt;220/120 for the first 24–48 h.</li>
<li><b>Aspirin</b> within 24–48 h (after a dysphagia screen or rectally).</li>
<li><b>Dual antiplatelet therapy</b> (aspirin + clopidogrel) for 21 days, then single agent, for minor stroke (NIHSS ≤3) or high-risk TIA (ABCD² ≥4).</li>
<li>Head of bed flat to 30°, normothermia, normoglycemia (140–180), DVT prophylaxis, swallow screen before oral intake.</li></ul>`},
{h:"Find the mechanism",html:`
<table><thead><tr><th>Mechanism</th><th>Clues</th><th>Workup</th></tr></thead><tbody>
<tr><td>Large-artery atherosclerosis</td><td>Prior TIAs in same territory, carotid bruit, amaurosis fugax</td><td>Carotid duplex or CTA/MRA</td></tr>
<tr><td>Cardioembolic</td><td>Sudden maximal deficit, multiple territories, AF, recent MI, valve disease</td><td>ECG, telemetry, echo; prolonged rhythm monitoring if cryptogenic</td></tr>
<tr><td>Small vessel (lacunar)</td><td>Hypertension, diabetes, pure motor or pure sensory syndrome</td><td>MRI; vascular risk factors</td></tr>
<tr><td>Dissection</td><td>Young, neck pain or trauma (chiropractic, sports), ipsilateral Horner</td><td>CTA or MRA neck</td></tr>
<tr><td>Paradoxical embolism</td><td>Young, PFO, recent DVT or Valsalva</td><td>Bubble-contrast echo, leg duplex</td></tr>
<tr><td>Hypercoagulable / other</td><td>Antiphospholipid syndrome (miscarriage, livedo), sickle cell, cocaine, vasculitis</td><td>Targeted labs</td></tr></tbody></table>`},
{h:"Secondary prevention",html:`
<ul><li><b>Antiplatelet</b> for noncardioembolic stroke: aspirin, clopidogrel, or aspirin–dipyridamole.</li>
<li><b>High-intensity statin</b> (LDL goal &lt;70); BP goal &lt;130/80; diabetes control; smoking cessation; exercise.</li>
<li><b>Atrial fibrillation</b> → anticoagulate, DOAC preferred (warfarin for mechanical valves or moderate–severe mitral stenosis). Timing after stroke depends on infarct size, usually within days.</li>
<li><b>Symptomatic carotid stenosis 70–99%</b> → carotid endarterectomy, ideally within 2 weeks. 50–69%: consider based on patient factors. &lt;50% or complete occlusion: medical therapy. Stenting if high surgical risk (prior neck radiation or surgery).</li>
<li><b>PFO closure</b>: age ≤60 with cryptogenic stroke and a PFO with high-risk features.</li>
<li><b>Dissection</b>: antiplatelet or anticoagulation (similar outcomes).</li></ul>`},
{h:"TIA",html:`
<p>Transient focal deficit with <b>no infarct on imaging</b>. Highest stroke risk is in the first 48 h, so workup is the same as stroke and happens immediately.</p>
<p><b>ABCD²</b>: Age ≥60 (1), BP ≥140/90 (1), Clinical: unilateral weakness (2) or speech disturbance alone (1), Duration ≥60 min (2) or 10–59 min (1), Diabetes (1). Score ≥4 = high risk.</p>
<p><b>Amaurosis fugax</b> (curtain over one eye) = embolus to the ophthalmic artery from the ipsilateral carotid → carotid imaging.</p>`},
{h:"Complications",html:`
<ul><li><b>Malignant MCA edema</b> peaks days 2–5 → decompressive hemicraniectomy (best within 48 h, age &lt;60).</li><li>Hemorrhagic transformation; aspiration pneumonia (swallow screen); DVT; UTI; falls.</li>
<li>Post-stroke depression is common; treat with an SSRI. No seizure prophylaxis.</li>
<li>Large cerebellar infarct → hydrocephalus and brainstem compression → suboccipital decompression.</li></ul>`}],
pearls:[
["Thrombolysis window","4.5 h from last known well"],["BP threshold before tPA","<185/110"],["BP threshold to treat if no tPA","Above 220/120 (permissive hypertension)"],
["Thrombectomy window","6 h, extendable to 24 h with favorable perfusion imaging"],
["Minor stroke or high-risk TIA antiplatelet regimen","Aspirin + clopidogrel × 21 days, then single agent"],
["Symptomatic carotid stenosis 70–99%","Carotid endarterectomy within 2 weeks"],
["First test in suspected stroke after glucose","Noncontrast CT head"],
["Young stroke with neck pain and ipsilateral Horner","Carotid dissection"],
["Most important cardiac cause of embolic stroke","Atrial fibrillation"],
["Stroke + atrial fibrillation + no valve disease: preferred agent","DOAC (apixaban, rivaroxaban, dabigatran, edoxaban)"]]},

{id:"syndromes",cat:"cv",title:"Vascular territories & brainstem syndromes",
summary:"Match the deficit to the artery. The brainstem rule: ipsilateral cranial nerve signs plus contralateral long-tract signs.",
sections:[
{h:"Hemispheric territories",html:`
<table><thead><tr><th>Artery</th><th>Deficits (contralateral unless noted)</th></tr></thead><tbody>
<tr><td>Anterior cerebral (ACA)</td><td>Leg &gt; arm weakness and sensory loss; abulia, personality change; urinary incontinence</td></tr>
<tr><td>Middle cerebral (MCA)</td><td>Face and arm &gt; leg weakness and sensory loss; homonymous hemianopia; gaze toward lesion. Dominant: aphasia. Nondominant: neglect, anosognosia</td></tr>
<tr><td>MCA superior division</td><td>Face/arm weakness, Broca aphasia (dominant)</td></tr>
<tr><td>MCA inferior division</td><td>Wernicke aphasia (dominant) or neglect, superior quadrantanopia, little or no weakness</td></tr>
<tr><td>Posterior cerebral (PCA)</td><td>Homonymous hemianopia with macular sparing; dominant + splenium: alexia without agraphia; thalamic sensory loss; memory loss if bilateral</td></tr>
<tr><td>Anterior choroidal</td><td>Hemiparesis, hemisensory loss, hemianopia</td></tr>
<tr><td>Watershed (hypotension)</td><td>Bilateral proximal arm and shoulder weakness ("man in a barrel"); transcortical aphasias</td></tr></tbody></table>`},
{h:"Lacunar syndromes",html:`
<table><thead><tr><th>Syndrome</th><th>Location</th></tr></thead><tbody>
<tr><td>Pure motor hemiparesis (face = arm = leg)</td><td>Posterior limb of internal capsule, or basis pontis</td></tr>
<tr><td>Pure sensory stroke</td><td>Ventral posterolateral (VPL) thalamus</td></tr>
<tr><td>Ataxic hemiparesis</td><td>Pons or internal capsule</td></tr>
<tr><td>Dysarthria–clumsy hand</td><td>Basis pontis or genu of internal capsule</td></tr>
<tr><td>Sensorimotor</td><td>Thalamocapsular</td></tr></tbody></table>
<p>Lacunes come from lipohyalinosis of penetrating arteries in hypertension and diabetes. No cortical signs (no aphasia, neglect, or field cut).</p>`},
{h:"Brainstem syndromes",html:`
<table><thead><tr><th>Syndrome (artery)</th><th>Ipsilateral</th><th>Contralateral</th></tr></thead><tbody>
<tr><td>Weber: medial midbrain (PCA paramedian)</td><td>CN III palsy (down and out, ptosis, dilated pupil)</td><td>Hemiparesis</td></tr>
<tr><td>Benedikt / Claude: midbrain tegmentum</td><td>CN III palsy</td><td>Ataxia, tremor (red nucleus) ± hemiparesis</td></tr>
<tr><td>Parinaud: dorsal midbrain (pineal tumor, hydrocephalus)</td><td colspan="2">Upgaze palsy, light–near dissociation, convergence-retraction nystagmus, eyelid retraction</td></tr>
<tr><td>Medial pons (paramedian basilar)</td><td>CN VI (lateral gaze), ± CN VII</td><td>Hemiparesis, ± proprioception loss</td></tr>
<tr><td>Lateral pons (AICA)</td><td>Facial paralysis (LMN), hearing loss, vertigo, face pain/temperature loss, Horner, ataxia</td><td>Body pain/temperature loss</td></tr>
<tr><td>Locked-in (basilar, bilateral ventral pons)</td><td colspan="2">Quadriplegia, anarthria; consciousness and vertical eye movements/blinking preserved</td></tr>
<tr><td>Lateral medulla, Wallenberg (PICA or vertebral)</td><td>Dysphagia, hoarseness, ↓ gag (nucleus ambiguus); face pain/temperature loss; Horner; ataxia; vertigo, nystagmus</td><td>Body pain/temperature loss</td></tr>
<tr><td>Medial medulla (anterior spinal / vertebral)</td><td>Tongue deviates toward lesion (CN XII)</td><td>Hemiparesis; loss of vibration/proprioception</td></tr></tbody></table>
<div class="hy"><p><b>Wallenberg has no limb weakness</b> (the pyramids are medial). Nucleus ambiguus findings (dysphagia, hoarseness) point to PICA; facial paralysis and deafness point to AICA. Medial structures start with M: Motor tract, Medial lemniscus, Medial longitudinal fasciculus, and the Motor nuclei that divide 12 (III, IV, VI, XII).</p></div>`},
{h:"Other posterior circulation",html:`
<ul><li><b>Top of the basilar:</b> somnolence, vertical gaze problems, bilateral visual loss, memory loss.</li>
<li><b>Cerebellar stroke:</b> vertigo, vomiting, inability to walk, ipsilateral limb ataxia; risk of edema, hydrocephalus and brainstem compression in 2–4 days.</li>
<li><b>Subclavian steal:</b> arm exertion causes vertigo or syncope; arm BP differs by &gt;15–20 mm Hg; reversed flow in the ipsilateral vertebral artery.</li>
<li><b>Artery of Percheron</b> occlusion: bilateral paramedian thalamic infarcts with coma or hypersomnolence and vertical gaze palsy.</li></ul>`}],
pearls:[
["Ipsilateral CN III palsy + contralateral hemiparesis","Weber syndrome: medial midbrain (PCA branches)"],
["Hoarseness, dysphagia, ipsilateral Horner, crossed pain/temp loss, no weakness","Wallenberg (lateral medullary): PICA or vertebral artery"],
["Tongue deviates toward lesion + contralateral hemiparesis","Medial medullary syndrome (anterior spinal artery)"],
["Ipsilateral facial paralysis + deafness + crossed pain/temp loss","Lateral pontine syndrome (AICA)"],
["Awake, quadriplegic, communicates by vertical eye movements","Locked-in syndrome: basilar artery, ventral pons"],
["Leg weakness worse than arm + urinary incontinence","ACA infarct"],
["Pure motor hemiparesis, face = arm = leg","Lacune in posterior limb of internal capsule"],
["Alexia without agraphia","Left PCA infarct involving splenium of corpus callosum"],
["Upgaze palsy + light–near dissociation + convergence-retraction nystagmus","Parinaud syndrome (pineal tumor)"],
["Bilateral proximal arm weakness after cardiac arrest","Watershed infarcts (man-in-a-barrel)"]]},

{id:"hemorrhage",cat:"cv",title:"Hemorrhage, aneurysm & venous thrombosis",
summary:"Intracerebral hemorrhage, subarachnoid hemorrhage, vascular malformations, and cerebral venous sinus thrombosis: recognition and the specific management steps that get tested.",
sections:[
{h:"Intracerebral hemorrhage",html:`
<p>Focal deficit with headache, vomiting, and declining consciousness that worsens over minutes to hours (hematoma expansion).</p>
<table><thead><tr><th>Cause</th><th>Typical location and clue</th></tr></thead><tbody>
<tr><td>Hypertensive (Charcot-Bouchard microaneurysms)</td><td>Putamen (most common), thalamus, pons, cerebellum</td></tr>
<tr><td>Cerebral amyloid angiopathy</td><td>Lobar, elderly, recurrent; microbleeds on MRI; associated with Alzheimer disease</td></tr>
<tr><td>Anticoagulation</td><td>Any site; larger and more likely to expand</td></tr>
<tr><td>AVM, cavernoma, tumor, drugs (cocaine, amphetamines)</td><td>Young patients, lobar, atypical location</td></tr></tbody></table>
<div class="hy"><ul><li><b>Reverse anticoagulation:</b> warfarin → 4-factor PCC + IV vitamin K; dabigatran → idarucizumab; factor Xa inhibitors → andexanet alfa or 4F-PCC; heparin → protamine.</li>
<li>Lower systolic BP toward ~140 (avoid dropping below 130).</li>
<li><b>Cerebellar hemorrhage &gt;3 cm</b>, brainstem compression, or hydrocephalus → urgent surgical evacuation. Intraventricular blood with hydrocephalus → external ventricular drain.</li>
<li>No seizure prophylaxis; no platelet transfusion for antiplatelet users who are not going to surgery; mechanical DVT prophylaxis initially.</li></ul></div>`},
{h:"Subarachnoid hemorrhage",html:`
<p><b>Thunderclap headache</b> (maximal within a minute, "worst of my life"), neck stiffness, photophobia, vomiting, brief loss of consciousness. Some have a sentinel headache days before. Most nontraumatic SAH is a ruptured saccular (berry) aneurysm, commonly at the anterior communicating artery. Trauma is the most common cause of SAH overall.</p>
<p>Risk factors: smoking, hypertension, family history, ADPKD, Ehlers-Danlos type IV, Marfan, coarctation, cocaine.</p>
<p><b>Diagnosis:</b> noncontrast CT (most sensitive in the first 6 h) → if negative and suspicion remains, LP for xanthochromia and nonclearing RBCs → CTA to find the aneurysm.</p>
<div class="hy"><ul><li>Secure the aneurysm early (endovascular coiling or surgical clipping).</li><li><b>Nimodipine</b> 60 mg every 4 h for 21 days improves outcome by reducing delayed ischemia.</li><li>SBP &lt;160 until secured; maintain euvolemia.</li></ul></div>
<table><thead><tr><th>Complication</th><th>Timing</th><th>Management</th></tr></thead><tbody>
<tr><td>Rebleeding</td><td>First 24 h highest</td><td>Early aneurysm repair, BP control</td></tr>
<tr><td>Vasospasm / delayed cerebral ischemia</td><td>Days 3–14 (peak ~7)</td><td>New focal deficit; transcranial Doppler monitoring; nimodipine; induced hypertension; intra-arterial therapy</td></tr>
<tr><td>Hydrocephalus</td><td>Acute or delayed</td><td>External ventricular drain; later shunt</td></tr>
<tr><td>Hyponatremia</td><td>Days</td><td>SIADH or cerebral salt wasting; <b>do not fluid restrict</b> (worsens vasospasm); use saline ± fludrocortisone</td></tr>
<tr><td>Cardiac</td><td>Early</td><td>Neurogenic stunned myocardium, ECG changes, arrhythmia</td></tr></tbody></table>
<div class="warn"><p>Pupil-involving CN III palsy with headache = expanding <b>posterior communicating artery aneurysm</b> until proven otherwise. Get emergent CTA.</p></div>`},
{h:"Vascular malformations",html:`
<ul><li><b>Arteriovenous malformation:</b> young adult with ICH or seizure; associated with hereditary hemorrhagic telangiectasia.</li>
<li><b>Cavernous malformation:</b> "popcorn" lesion on MRI with hemosiderin rim; seizures, small bleeds; may be familial.</li>
<li><b>Unruptured aneurysm:</b> repair depends on size, location, and patient factors; stop smoking and control BP. Screen first-degree relatives in families with two or more affected members, and patients with ADPKD who have a family history.</li></ul>`},
{h:"Cerebral venous sinus thrombosis",html:`
<p>Headache (most common, often progressive), papilledema, seizures, focal deficits, and hemorrhagic infarcts that cross arterial territories.</p>
<p>Risk factors: pregnancy and postpartum, oral contraceptives, thrombophilia, dehydration, malignancy, nephrotic syndrome, IBD, local infection (mastoiditis, sinusitis).</p>
<p><b>Diagnosis:</b> MR venography or CT venography; "empty delta sign" on contrast CT for superior sagittal sinus thrombosis.</p>
<div class="hy"><p><b>Anticoagulate</b> with heparin or LMWH even when there is hemorrhage, then oral anticoagulation for 3–12 months.</p></div>`}],
pearls:[
["Most common site of hypertensive ICH","Putamen"],["Recurrent lobar hemorrhage in an elderly patient","Cerebral amyloid angiopathy"],
["Warfarin-associated ICH reversal","4-factor PCC + IV vitamin K"],["Dabigatran reversal","Idarucizumab"],
["Cerebellar hemorrhage >3 cm with declining consciousness","Emergent surgical evacuation"],
["SAH: drug that improves outcome","Nimodipine for 21 days"],["SAH vasospasm peak","Around day 7 (range 3–14)"],
["Thunderclap headache, CT negative at 10 h","Lumbar puncture for xanthochromia"],
["Pupil-involving CN III palsy + headache","PComm aneurysm: emergent CTA"],
["Postpartum headache, seizures, papilledema, hemorrhagic infarct","Cerebral venous sinus thrombosis: anticoagulate"],
["Hyponatremia after SAH: avoid what?","Fluid restriction"]]}
);

{id:"seizures",cat:"parox",title:"Seizures, epilepsy & status",
summary:"First seizure workup, telling seizures from syncope and functional events, the pediatric syndromes, choosing an antiseizure medication, and the status epilepticus clock.",
sections:[
{h:"Definitions",html:`
<ul><li><b>Provoked seizure</b>: acute cause (hypoglycemia, hyponatremia, hypocalcemia, alcohol or benzodiazepine withdrawal, drugs, eclampsia, acute stroke or trauma, infection). Treat the cause; usually no long-term medication.</li>
<li><b>Epilepsy</b>: two unprovoked seizures more than 24 h apart; or one unprovoked seizure with high recurrence risk (epileptiform EEG, structural lesion); or an epilepsy syndrome.</li></ul>`},
{h:"First seizure workup",html:`
<ul><li>Glucose, sodium, calcium, magnesium, CBC, renal and liver panel, toxicology, pregnancy test.</li>
<li>CT head in the ED; <b>MRI brain</b> (epilepsy protocol) and <b>EEG</b> for every new unprovoked seizure.</li>
<li>LP if fever, meningismus, or immunocompromise.</li></ul>
<div class="hy"><p>After a single unprovoked seizure with a normal exam, EEG and MRI, usually <b>do not start</b> medication. Start if EEG is epileptiform, MRI shows a lesion, the seizure arose from sleep, or there was a prior brain insult.</p></div>`},
{h:"Seizure types",html:`
<table><thead><tr><th>Type</th><th>Features</th></tr></thead><tbody>
<tr><td>Focal aware</td><td>Motor (Jacksonian march), sensory, autonomic, or psychic (déjà vu, fear) symptoms with preserved awareness. An aura is a focal aware seizure.</td></tr>
<tr><td>Focal impaired awareness</td><td>Behavioral arrest, staring, automatisms (lip smacking, fumbling) for 1–2 min, then postictal confusion. Usually temporal lobe.</td></tr>
<tr><td>Focal to bilateral tonic-clonic</td><td>Focal onset that spreads; aura or Todd paralysis reveals the focal origin.</td></tr>
<tr><td>Absence</td><td>Seconds of staring, eyelid flutter, many per day, <b>no postictal state</b>; provoked by hyperventilation.</td></tr>
<tr><td>Myoclonic</td><td>Brief jerks, often on waking</td></tr>
<tr><td>Atonic</td><td>Sudden loss of tone, drop attacks</td></tr>
<tr><td>Generalized tonic-clonic</td><td>Stiffening, cry, rhythmic jerking, lateral tongue bite, incontinence, prolonged postictal confusion</td></tr></tbody></table>`},
{h:"Seizure vs syncope vs functional",html:`
<table><thead><tr><th></th><th>Epileptic seizure</th><th>Syncope</th><th>Functional (PNES)</th></tr></thead><tbody>
<tr><td>Trigger</td><td>Sleep deprivation, alcohol, flashing lights, often none</td><td>Standing, pain, micturition, cough, emotion, exertion (cardiac)</td><td>Emotional stress, often in front of others</td></tr>
<tr><td>Prodrome</td><td>Aura (epigastric rising, smell, déjà vu)</td><td>Lightheaded, tunnel vision, sweating, pallor</td><td>Variable</td></tr>
<tr><td>Event</td><td>Eyes open, stereotyped, 1–2 min</td><td>Brief (&lt;30 s) myoclonic jerks can occur</td><td>Eyes closed and resist opening, side-to-side head movement, pelvic thrusting, waxing-waning, long duration</td></tr>
<tr><td>After</td><td>Postictal confusion for minutes to hours, lateral tongue bite, sore muscles</td><td>Rapid return to baseline</td><td>Crying, recall of event</td></tr>
<tr><td>Tests</td><td>EEG; prolactin up if drawn within 20 min</td><td>ECG, orthostatics, echo if cardiac</td><td><b>Video EEG</b></td></tr></tbody></table>`},
{h:"Pediatric and named syndromes",html:`
<table><thead><tr><th>Syndrome</th><th>Clues</th><th>Treatment</th></tr></thead><tbody>
<tr><td>Simple febrile seizure</td><td>6 mo–5 y, generalized, &lt;15 min, once in 24 h, normal child</td><td>Reassure; find fever source; no EEG, imaging, or daily medication</td></tr>
<tr><td>Complex febrile seizure</td><td>Focal, &gt;15 min, or recurs in 24 h</td><td>Further evaluation; LP if meningitis possible</td></tr>
<tr><td>Infantile spasms (West)</td><td>3–12 mo, clusters of flexion spasms on waking, developmental regression, hypsarrhythmia</td><td>ACTH or high-dose steroids; <b>vigabatrin</b> if tuberous sclerosis</td></tr>
<tr><td>Childhood absence</td><td>4–10 y, many daily staring spells, school decline, 3 Hz spike-wave</td><td><b>Ethosuximide</b>; valproate alternative</td></tr>
<tr><td>Juvenile myoclonic</td><td>Adolescent, morning myoclonic jerks (drops toothbrush), GTCs, triggered by sleep loss and alcohol</td><td>Valproate (avoid in people who could become pregnant), levetiracetam, lamotrigine; usually lifelong</td></tr>
<tr><td>Centrotemporal spikes (rolandic)</td><td>School age, nocturnal facial twitching, drooling, speech arrest</td><td>Often none; remits by adolescence</td></tr>
<tr><td>Lennox-Gastaut</td><td>Multiple seizure types incl. tonic and atonic drops, intellectual disability, slow spike-wave</td><td>Valproate, lamotrigine, rufinamide, clobazam</td></tr>
<tr><td>Dravet (SCN1A)</td><td>Prolonged febrile seizures in infancy, then multiple types</td><td>Avoid sodium channel blockers</td></tr>
<tr><td>Mesial temporal lobe epilepsy</td><td>Rising epigastric aura, automatisms, hippocampal sclerosis on MRI</td><td>Often drug-resistant → temporal lobectomy</td></tr></tbody></table>`},
{h:"Choosing a medication",html:`
<ul><li><b>Focal</b>: lamotrigine or levetiracetam first; carbamazepine or oxcarbazepine.</li>
<li><b>Generalized</b>: valproate (most effective), levetiracetam, lamotrigine.</li>
<li><b>Absence</b>: ethosuximide. Carbamazepine, oxcarbazepine, phenytoin, gabapentin can <b>worsen</b> absence and myoclonic seizures.</li>
<li><b>Could become pregnant</b>: lamotrigine or levetiracetam; avoid valproate (neural tube defects, lower IQ); folic acid; enzyme inducers reduce contraceptive efficacy. Lamotrigine levels fall in pregnancy and with estrogen.</li>
<li><b>Drug-resistant epilepsy</b> = failure of two appropriate, tolerated medications → refer for surgical evaluation, VNS, or ketogenic diet.</li></ul>`},
{h:"Medication adverse effects",html:`
<table><thead><tr><th>Drug</th><th>Tested adverse effects</th></tr></thead><tbody>
<tr><td>Phenytoin / fosphenytoin</td><td>Gingival hyperplasia, hirsutism, nystagmus, ataxia, diplopia, SJS, osteomalacia, megaloblastic anemia, fetal hydantoin syndrome; zero-order kinetics; CYP inducer; IV: hypotension, arrhythmia, purple glove</td></tr>
<tr><td>Carbamazepine</td><td>Hyponatremia (SIADH), agranulocytosis/aplastic anemia, SJS/TEN (HLA-B*15:02, screen people of Asian ancestry), CYP inducer incl. autoinduction, neural tube defects</td></tr>
<tr><td>Oxcarbazepine</td><td>Hyponatremia (more than carbamazepine)</td></tr>
<tr><td>Valproate</td><td>Hepatotoxicity, pancreatitis, neural tube defects, weight gain, tremor, hair loss, thrombocytopenia, hyperammonemia; CYP inhibitor</td></tr>
<tr><td>Lamotrigine</td><td>SJS (titrate slowly; valproate doubles levels)</td></tr>
<tr><td>Levetiracetam</td><td>Irritability, depression, behavioral change</td></tr>
<tr><td>Topiramate</td><td>Kidney stones, weight loss, word-finding difficulty, paresthesias, metabolic acidosis, angle-closure glaucoma</td></tr>
<tr><td>Ethosuximide</td><td>GI upset, fatigue, SJS</td></tr>
<tr><td>Vigabatrin</td><td>Irreversible visual field constriction</td></tr>
<tr><td>Felbamate</td><td>Aplastic anemia, hepatic failure</td></tr>
<tr><td>Phenobarbital</td><td>Sedation, cognitive and behavioral effects, CYP inducer</td></tr></tbody></table>`},
{h:"Status epilepticus",html:`
<p>Seizure ≥5 min, or repeated seizures without return to baseline.</p>
<table><thead><tr><th>Time</th><th>Step</th></tr></thead><tbody>
<tr><td>0–5 min</td><td>ABCs, oxygen, monitor, IV access, fingerstick glucose (give thiamine before dextrose if malnourished or alcohol use), labs and drug levels</td></tr>
<tr><td>5–20 min</td><td><b>Benzodiazepine</b>: IV lorazepam (may repeat once), or IM midazolam if no IV, or rectal/intranasal options</td></tr>
<tr><td>20–40 min</td><td>Second agent: fosphenytoin, valproate, or levetiracetam (similar efficacy)</td></tr>
<tr><td>&gt;40 min</td><td>Refractory: intubate, continuous midazolam or propofol (or pentobarbital), continuous EEG</td></tr></tbody></table>
<div class="warn"><p>Not waking up after a convulsion → EEG for <b>nonconvulsive status</b>. Seizures in pregnancy after 20 weeks or postpartum → <b>magnesium sulfate</b> for eclampsia. Isoniazid overdose seizures → pyridoxine.</p></div>`},
{h:"Counseling",html:`
<ul><li>Driving: rules vary by state, usually a seizure-free interval of months; counsel and document. Some states require physician reporting.</li>
<li>No swimming or bathing alone, avoid heights; showers over baths.</li>
<li>Medication adherence, sleep, and limiting alcohol reduce recurrence. Discuss SUDEP risk with uncontrolled generalized tonic-clonic seizures.</li></ul>`}],
pearls:[
["First seizure, normal EEG and MRI: start medication?","Usually no"],["Absence seizures first-line","Ethosuximide"],
["Infantile spasms in tuberous sclerosis","Vigabatrin"],["Infantile spasms (not TSC) first-line","ACTH or high-dose oral steroids"],
["Morning myoclonic jerks in a teenager after a late night","Juvenile myoclonic epilepsy"],
["Antiseizure drugs that worsen absence and myoclonic seizures","Carbamazepine, oxcarbazepine, phenytoin (sodium channel blockers), gabapentin"],
["Gingival hyperplasia + hirsutism","Phenytoin"],["Hyponatremia from an antiseizure drug","Carbamazepine or oxcarbazepine"],
["Valproate's big three toxicities","Hepatotoxicity, pancreatitis, neural tube defects"],
["Kidney stones, weight loss, word-finding trouble","Topiramate"],["Status epilepticus first-line","Benzodiazepine (IV lorazepam or IM midazolam)"],
["Seizure 3 days postpartum with hypertension","Eclampsia: magnesium sulfate"],
["Test to diagnose psychogenic nonepileptic seizures","Video EEG monitoring"],
["Simple febrile seizure management","Reassurance and treat fever source; no workup or prophylaxis"]]},

{id:"headache",cat:"parox",title:"Headache",
summary:"Screen for red flags first, then sort primary headaches by duration and autonomic features. Know acute and preventive therapy and the secondary headaches that cannot be missed.",
sections:[
{h:"Red flags (SNOOP)",html:`
<ul><li><b>S</b>ystemic: fever, weight loss, cancer, HIV, immunosuppression</li><li><b>N</b>eurologic signs: focal deficit, altered consciousness, papilledema</li><li><b>O</b>nset sudden: thunderclap</li><li><b>O</b>lder: new headache after 50</li><li><b>P</b>attern change, progressive; positional; precipitated by Valsalva or cough; pregnancy or postpartum</li></ul>
<p>A primary headache pattern with a normal exam needs no imaging.</p>`},
{h:"Primary headaches",html:`
<table><thead><tr><th></th><th>Migraine</th><th>Tension-type</th><th>Cluster</th></tr></thead><tbody>
<tr><td>Who</td><td>Women 3:1, family history</td><td>Anyone; most common</td><td>Men, often smokers</td></tr>
<tr><td>Location</td><td>Usually unilateral (bilateral in children)</td><td>Bilateral, band-like</td><td>Unilateral, orbital/temporal</td></tr>
<tr><td>Quality</td><td>Pulsating, moderate–severe, worse with activity</td><td>Pressing, mild–moderate</td><td>Excruciating, boring</td></tr>
<tr><td>Duration</td><td>4–72 h</td><td>30 min–7 days</td><td>15–180 min, up to 8/day, same time daily, for weeks</td></tr>
<tr><td>Associated</td><td>Nausea, photophobia and phonophobia; aura in ~⅓</td><td>None or one of photo/phonophobia</td><td>Ipsilateral tearing, rhinorrhea, ptosis, miosis; restless, pacing</td></tr>
<tr><td>Acute</td><td>NSAIDs, triptans, antiemetics, gepants</td><td>NSAIDs, acetaminophen</td><td><b>High-flow 100% O₂</b>, SC sumatriptan</td></tr>
<tr><td>Prevention</td><td>Propranolol, topiramate, amitriptyline, venlafaxine, CGRP antibodies, botulinum toxin (chronic)</td><td>Amitriptyline</td><td><b>Verapamil</b> (ECG monitoring); steroids as bridge; lithium</td></tr></tbody></table>
<p><b>Migraine aura</b>: fully reversible visual (scintillating zigzag scotoma), sensory or language symptoms spreading over 5–60 min, followed by headache. <b>Indomethacin-responsive</b> headaches: paroxysmal hemicrania (short frequent attacks, women) and hemicrania continua.</p>`},
{h:"Migraine treatment details",html:`
<ul><li><b>ED cocktail:</b> IV fluids, metoclopramide or prochlorperazine (with diphenhydramine to prevent akathisia), ketorolac; dihydroergotamine for refractory or status migrainosus (&gt;72 h). Avoid opioids.</li>
<li><b>Triptans</b> are contraindicated in coronary or peripheral vascular disease, prior stroke, uncontrolled hypertension, and hemiplegic or brainstem aura. Alternatives: gepants (ubrogepant, rimegepant) or lasmiditan. Don't combine with MAOIs; caution with other serotonergic drugs.</li>
<li><b>Start prevention</b> for ≥4 headache days per month, disabling attacks, or medication overuse. Match to comorbidity: hypertension or anxiety → propranolol; obesity → topiramate; insomnia or depression → amitriptyline; avoid valproate and topiramate in pregnancy.</li>
<li><b>Pregnancy:</b> acetaminophen, metoclopramide; avoid ergots, valproate, NSAIDs in the third trimester.</li>
<li><b>Migraine with aura</b>: avoid estrogen-containing contraceptives (ischemic stroke risk).</li></ul>
<div class="hy"><p><b>Medication overuse headache</b>: daily headache in someone using analgesics ≥15 days/month (simple) or ≥10 days/month (triptans, opioids, combinations). Stop the overused drug and start a preventive.</p></div>`},
{h:"Secondary headaches",html:`
<table><thead><tr><th>Cause</th><th>Clues</th><th>Next step</th></tr></thead><tbody>
<tr><td>Subarachnoid hemorrhage</td><td>Thunderclap, neck stiffness</td><td>CT → LP if negative → CTA</td></tr>
<tr><td>Giant cell arteritis</td><td>&gt;50, temporal headache, jaw claudication, scalp tenderness, PMR, transient vision loss, ↑ESR/CRP</td><td><b>Steroids immediately</b>, then temporal artery biopsy or ultrasound; IV methylprednisolone if vision loss</td></tr>

<tr><td>Carbon monoxide</td><td>Several household members, winter, improves outdoors</td><td>Carboxyhemoglobin; 100% O₂</td></tr>
<tr><td>Spontaneous intracranial hypotension</td><td>Orthostatic headache, better lying down</td><td>MRI: pachymeningeal enhancement, brain sag</td></tr>

<tr><td>Preeclampsia / PRES</td><td>Pregnancy &gt;20 weeks, hypertension, visual change</td><td>BP control, magnesium, delivery</td></tr></tbody></table>`}],

{id:"neuropain",cat:"pain",title:"Neuropathic & facial pain",
summary:"Trigeminal neuralgia, postherpetic neuralgia, painful neuropathy, complex regional pain syndrome, central pain, and the drug classes that treat neuropathic pain.",
sections:[
{h:"Trigeminal neuralgia",html:`
<p>Seconds-long electric, stabbing pain in V2 or V3, triggered by chewing, talking, brushing teeth, a light touch or wind. Normal exam between attacks. Typically women over 50; usually caused by a vascular loop (superior cerebellar artery) compressing the nerve root.</p>
<div class="hy"><ul><li><b>First-line: carbamazepine</b> (or oxcarbazepine).</li><li>MRI to exclude secondary causes, especially if young, bilateral, or with sensory loss: think <b>multiple sclerosis</b> or cerebellopontine angle tumor.</li><li>Refractory: microvascular decompression, radiofrequency rhizotomy, or stereotactic radiosurgery.</li></ul></div>
<p><b>Glossopharyngeal neuralgia</b>: similar paroxysms in the throat and ear triggered by swallowing; can cause bradycardia and syncope. <b>Occipital neuralgia</b>: shooting pain from the occiput over the scalp; occipital nerve block.</p>`},
{h:"Postherpetic neuralgia",html:`
<p>Burning, lancinating pain with allodynia persisting ≥3 months after shingles in the same dermatome. Risk rises with age and with severe acute pain or rash.</p>
<ul><li>Treatment: topical lidocaine, gabapentin or pregabalin, TCAs (nortriptyline better tolerated than amitriptyline), capsaicin patch.</li>
<li>Prevention: <b>recombinant zoster vaccine</b> for adults ≥50 (and immunocompromised ≥19). Antivirals within 72 h shorten the acute episode.</li></ul>`},
{h:"Painful polyneuropathy",html:`
<p>Distal burning, tingling, and allodynia in a stocking distribution, worse at night. Most often diabetes.</p>
<p><b>First-line options:</b> duloxetine, pregabalin or gabapentin, TCAs. Venlafaxine and topical capsaicin or lidocaine are alternatives. Avoid TCAs in older adults or with cardiac conduction disease. Opioids are not first-line.</p>`},
{h:"Complex regional pain syndrome",html:`
<p>Pain out of proportion after a fracture, surgery, or minor injury (type I) or a nerve injury (type II), with allodynia plus changes in at least two of: <b>skin color or temperature, swelling or sweating, range of motion or trophic changes</b> (hair, nails, skin). Diagnosis is clinical (Budapest criteria); a triple-phase bone scan can support it.</p>
<div class="hy"><p>Mainstay is <b>physical and occupational therapy</b> with early mobilization. Add NSAIDs, gabapentinoids, a short steroid course, bisphosphonates, or sympathetic blocks. Vitamin C after wrist fracture may reduce risk.</p></div>`},
{h:"Central and other pain",html:`
<ul><li><b>Central post-stroke pain</b> (Dejerine-Roussy): thalamic stroke followed weeks later by burning contralateral pain and allodynia. Amitriptyline, gabapentinoids, lamotrigine.</li>
<li><b>Phantom limb pain</b>: after amputation; mirror therapy, gabapentinoids, TCAs.</li>
<li><b>Fibromyalgia</b>: widespread pain ≥3 months, fatigue, unrefreshing sleep, cognitive complaints, normal exam and labs. Graded aerobic exercise and CBT first; duloxetine, milnacipran, pregabalin, or low-dose amitriptyline.</li></ul>
<table><thead><tr><th>Class</th><th>Examples</th><th>Watch for</th></tr></thead><tbody>
<tr><td>Gabapentinoids</td><td>Gabapentin, pregabalin</td><td>Sedation, dizziness, edema; dose-adjust for renal function</td></tr>
<tr><td>SNRIs</td><td>Duloxetine, venlafaxine</td><td>Nausea, hypertension, serotonin syndrome; avoid duloxetine in liver disease</td></tr>
<tr><td>TCAs</td><td>Amitriptyline, nortriptyline</td><td>Anticholinergic effects, orthostasis, QT and conduction delay, lethal in overdose</td></tr>
<tr><td>Sodium channel blockers</td><td>Carbamazepine, oxcarbazepine</td><td>Hyponatremia, rash, marrow suppression</td></tr>
<tr><td>Topicals</td><td>Lidocaine patch, capsaicin</td><td>Local irritation</td></tr></tbody></table>`}],

{id:"dementia",cat:"degen",title:"Dementia & amnestic syndromes",
summary:"Separate MCI from dementia, rule out reversible causes, and recognize each dementia by its earliest feature. Includes cholinesterase inhibitors, anti-amyloid antibodies, and transient global amnesia.",
sections:[
{h:"Definitions and screening",html:`
<ul><li><b>Mild cognitive impairment</b>: objective decline in one or more domains with preserved independence in daily activities.</li>
<li><b>Dementia (major neurocognitive disorder)</b>: decline that interferes with independence, typically first in instrumental activities (finances, medications, driving).</li>
<li>Screening: MoCA (more sensitive for MCI), MMSE, Mini-Cog. Get collateral history.</li></ul>`},
{h:"Reversible causes workup",html:`
<div class="hy"><p>Every new cognitive complaint: <b>CBC, metabolic panel, TSH, B12</b>, and <b>brain imaging</b> (CT or MRI). Add RPR, HIV, folate based on risk. Screen for depression, review medications (anticholinergics, benzodiazepines, opioids), check hearing and vision.</p></div>
<p>Not routine: APOE genotyping, EEG, LP. CSF amyloid/tau or amyloid PET are reserved for atypical or early-onset presentations and before anti-amyloid therapy.</p>`},
{h:"Types",html:`
<table><thead><tr><th>Type</th><th>Earliest and key features</th><th>Imaging and pathology</th></tr></thead><tbody>
<tr><td>Alzheimer disease</td><td>Insidious <b>short-term memory loss</b> (repeats questions, misplaces items), then language, visuospatial, executive; patient often unaware</td><td>Hippocampal and parietal atrophy; amyloid plaques, tau tangles. Risk: age, APOE ε4, Down syndrome; early-onset familial APP, PSEN1, PSEN2</td></tr>
<tr><td>Vascular</td><td><b>Stepwise</b> decline, executive slowing, focal signs, vascular risk factors</td><td>Multiple infarcts or extensive white-matter disease</td></tr>
<tr><td>Dementia with Lewy bodies</td><td><b>Fluctuating</b> attention, well-formed <b>visual hallucinations</b>, parkinsonism, <b>REM sleep behavior disorder</b>; dementia before or within 1 year of parkinsonism; severe antipsychotic sensitivity</td><td>α-synuclein; reduced uptake on DaT scan</td></tr>
<tr><td>Parkinson disease dementia</td><td>Parkinsonism for &gt;1 year before dementia</td><td>α-synuclein</td></tr>
<tr><td>Frontotemporal (behavioral)</td><td>Age 45–65, <b>personality change</b>, disinhibition, apathy, loss of empathy, compulsions, hyperorality; memory relatively spared early</td><td>Frontal and anterior temporal atrophy; tau (Pick bodies) or TDP-43; overlaps with ALS (C9orf72)</td></tr>
<tr><td>Primary progressive aphasia</td><td>Semantic variant (loses word meaning), nonfluent variant (effortful speech), logopenic (word finding; usually Alzheimer)</td><td>Dominant temporal or frontal atrophy</td></tr>
<tr><td>Normal pressure hydrocephalus</td><td><b>Gait first</b> (magnetic, wide-based), then urinary urgency/incontinence, then cognitive slowing</td><td>Ventricles enlarged out of proportion to atrophy; improvement after high-volume LP predicts shunt response</td></tr>
<tr><td>Creutzfeldt-Jakob disease</td><td><b>Rapidly progressive</b> over months, startle myoclonus, ataxia, akinetic mutism</td><td>MRI DWI cortical ribboning and basal ganglia; EEG periodic sharp waves; CSF RT-QuIC, 14-3-3</td></tr>
<tr><td>Huntington disease</td><td>Chorea, psychiatric symptoms, subcortical dementia; autosomal dominant</td><td>Caudate atrophy</td></tr>
<tr><td>HIV, neurosyphilis</td><td>Subcortical slowing; general paresis with Argyll Robertson pupils</td><td>Serology</td></tr></tbody></table>`},
{h:"Treatment",html:`
<ul><li><b>Cholinesterase inhibitors</b> (donepezil, rivastigmine, galantamine): mild to severe Alzheimer, Lewy body, and Parkinson disease dementia. Side effects: nausea, diarrhea, <b>bradycardia and syncope</b>, vivid dreams, urinary incontinence.</li>
<li><b>Memantine</b> (NMDA antagonist): moderate to severe Alzheimer, alone or added to a cholinesterase inhibitor. Dizziness, confusion, headache.</li>
<li><b>Anti-amyloid antibodies</b> (lecanemab, donanemab): MCI or mild dementia with confirmed amyloid. Risk of amyloid-related imaging abnormalities (edema, microhemorrhage), highest in APOE ε4 homozygotes; requires MRI monitoring; caution with anticoagulants.</li>
<li><b>FTD</b>: cholinesterase inhibitors do not help and can worsen behavior; SSRIs or trazodone for behavioral symptoms.</li>
<li><b>Behavioral symptoms</b>: nonpharmacologic first (routine, sleep, pain, toileting). Antipsychotics carry a boxed warning for increased mortality in older adults with dementia; avoid typical antipsychotics in Lewy body dementia (use low-dose quetiapine, pimavanserin, or clozapine if essential).</li>
<li>Plan early: driving, firearms, finances, power of attorney and advance directives while capacity remains; caregiver support; home safety.</li></ul>`},
{h:"Amnestic syndromes",html:`
<table><thead><tr><th>Syndrome</th><th>Features</th></tr></thead><tbody>
<tr><td>Transient global amnesia</td><td>Age 50–70; sudden anterograde amnesia with <b>repetitive questioning</b>; knows own identity; resolves within 24 h; triggers: exertion, cold water, intercourse, emotional stress. Benign; rarely recurs</td></tr>
<tr><td>Korsakoff syndrome</td><td>Thiamine deficiency; anterograde and retrograde amnesia with confabulation; mammillary bodies and medial thalamus; often permanent</td></tr>
<tr><td>Limbic encephalitis</td><td>Subacute memory loss, seizures, psychiatric change. Anti-Hu (small cell lung cancer); anti-LGI1 with faciobrachial dystonic seizures and hyponatremia</td></tr>
<tr><td>Post-HSV encephalitis</td><td>Bilateral temporal damage; persistent amnesia</td></tr>
<tr><td>Transient epileptic amnesia</td><td>Brief recurrent amnestic spells, often on waking; responds to antiseizure drugs</td></tr></tbody></table>`}],
pearls:[

["Visual hallucinations, fluctuating cognition, parkinsonism, dream enactment","Dementia with Lewy bodies"],
["Severe rigidity and confusion after haloperidol in a patient with dementia and hallucinations","Neuroleptic sensitivity in Lewy body dementia"],
["Gait apraxia, urinary incontinence, cognitive decline","Normal pressure hydrocephalus: high-volume LP then VP shunt"],
["Disinhibition and hyperorality at age 55 with intact memory","Behavioral-variant frontotemporal dementia"],
["Rapidly progressive dementia with startle myoclonus","Creutzfeldt-Jakob disease"],
["Stepwise decline with focal signs","Vascular dementia"],
["Cholinesterase inhibitor cardiac side effect","Bradycardia, heart block, syncope"],
["Anti-amyloid antibody main risk","ARIA: cerebral edema and microhemorrhage (highest with APOE ε4 homozygosity)"],
