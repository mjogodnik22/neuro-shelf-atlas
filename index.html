{id:"tbi",cat:"trauma",title:"Head trauma & concussion",
summary:"GCS, who needs a CT, the four intracranial hemorrhage patterns after trauma, severe TBI management, concussion return-to-play, and abusive head trauma.",
sections:[
{h:"Glasgow Coma Scale",html:`
<table><thead><tr><th>Score</th><th>Eye</th><th>Verbal</th><th>Motor</th></tr></thead><tbody>
<tr><td>6</td><td></td><td></td><td>Obeys commands</td></tr>
<tr><td>5</td><td></td><td>Oriented</td><td>Localizes pain</td></tr>
<tr><td>4</td><td>Spontaneous</td><td>Confused</td><td>Withdraws from pain</td></tr>
<tr><td>3</td><td>To voice</td><td>Inappropriate words</td><td>Abnormal flexion (decorticate)</td></tr>
<tr><td>2</td><td>To pain</td><td>Incomprehensible sounds</td><td>Extension (decerebrate)</td></tr>
<tr><td>1</td><td>None</td><td>None</td><td>None</td></tr></tbody></table>
<p>Mild 13–15, moderate 9–12, severe ≤8. <b>GCS ≤8 → intubate</b> to protect the airway.</p>`},
{h:"Who needs a head CT",html:`
<p>Canadian CT Head Rule for adults with minor head injury and LOC, amnesia, or disorientation. High risk: GCS &lt;15 at 2 h, suspected open or depressed skull fracture, any sign of <b>basilar skull fracture</b> (hemotympanum, raccoon eyes, Battle sign, CSF otorrhea or rhinorrhea), ≥2 episodes of vomiting, age ≥65. Medium risk: retrograde amnesia ≥30 min, dangerous mechanism.</p>
<p>Also scan anyone on <b>anticoagulants</b> with head trauma, and children who meet PECARN criteria.</p>`},
{h:"Traumatic hemorrhage patterns",html:`
<table><thead><tr><th>Type</th><th>Source</th><th>CT</th><th>Course</th></tr></thead><tbody>
<tr><td><b>Epidural</b></td><td>Middle meningeal artery; temporal bone fracture</td><td><b>Biconvex (lens)</b>; does not cross sutures</td><td>Brief LOC → <b>lucid interval</b> → rapid decline, blown pupil. Emergent evacuation</td></tr>
<tr><td><b>Subdural</b></td><td>Bridging veins; older adults, alcohol use, anticoagulation, infants (shaking)</td><td><b>Crescent</b>; crosses sutures, not midline. Acute hyperdense; chronic hypodense</td><td>Acute: large ones evacuated. Chronic: weeks after a minor fall, fluctuating confusion and headache; drain if symptomatic; middle meningeal artery embolization reduces recurrence</td></tr>
<tr><td>Traumatic SAH</td><td>Cortical vessels</td><td>Blood in sulci</td><td>Usually conservative</td></tr>
<tr><td>Contusion</td><td>Coup-contrecoup</td><td>Frontal and temporal poles</td><td>Can blossom over 24–48 h</td></tr>
<tr><td><b>Diffuse axonal injury</b></td><td>Rotational acceleration-deceleration</td><td>CT near normal; MRI petechiae at gray-white junction, corpus callosum, brainstem</td><td>Coma out of proportion to CT; poor prognosis</td></tr></tbody></table>`},
{h:"Severe TBI management",html:`
<ul><li>Prevent secondary injury: avoid <b>hypotension</b> and <b>hypoxia</b> (each doubles mortality). Intubate for GCS ≤8.</li>
<li>Head of bed 30°, neck midline, normothermia, normoglycemia, sodium normal-high.</li>
<li>ICP monitoring for GCS ≤8 with abnormal CT; treat ICP above ~22 mm Hg; keep CPP 60–70.</li>
<li><b>Seizure prophylaxis</b> (levetiracetam or phenytoin) for 7 days reduces early seizures, not late epilepsy.</li>
<li><b>No steroids</b> in TBI (increased mortality). Tranexamic acid within 3 h helps mild to moderate TBI.</li>
<li>Reverse anticoagulation for any traumatic intracranial hemorrhage.</li></ul>`},
{h:"Concussion",html:`
<p>Trauma-induced brain dysfunction without structural injury: confusion, amnesia, headache, dizziness, slowed responses. <b>Loss of consciousness is not required.</b></p>
<div class="hy"><ul><li>Remove from play; <b>no same-day return</b>.</li>
<li>Relative rest for 24–48 h, then gradual return to cognitive activity and school ("return to learn") before sport.</li>
<li><b>Graduated return to play</b> once symptom-free: light aerobic → sport-specific → non-contact drills → full contact practice → game, with at least 24 h per step; drop back a step if symptoms recur.</li>
<li>Image only with red flags (worsening headache, repeated vomiting, focal deficit, seizure, declining GCS).</li></ul></div>
<ul><li><b>Second impact syndrome</b>: a second blow before recovery causes catastrophic cerebral edema, mostly in adolescents.</li>
<li><b>Post-concussion syndrome</b>: headache, dizziness, irritability, poor concentration, insomnia for weeks to months. Reassurance, graded activity, treat headache and sleep.</li>
<li><b>Chronic traumatic encephalopathy</b>: repetitive head impacts; mood, behavior, cognitive decline, parkinsonism; tau pathology.</li></ul>`},
{h:"Abusive head trauma",html:`
<p>Infant with <b>subdural hemorrhages of different ages</b>, <b>retinal hemorrhages</b>, and metaphyseal or rib fractures; history that doesn't fit development or mechanism; delay in seeking care. Get a skeletal survey, ophthalmology exam, and MRI; physicians are mandated reporters to child protective services.</p>`}],

{id:"icp",cat:"trauma",title:"Intracranial pressure, herniation & hydrocephalus",
summary:"Recognize raised ICP and the herniation syndromes, apply the stepwise ICP treatment ladder, and sort hydrocephalus and idiopathic intracranial hypertension.",
sections:[
{h:"Raised ICP",html:`
<p>Headache worse lying down and in the morning, vomiting, papilledema, CN VI palsy, declining consciousness. <b>Cushing triad</b> (hypertension with wide pulse pressure, bradycardia, irregular respirations) is late and ominous.</p>
<p>CPP = MAP − ICP. Normal ICP 5–15 mm Hg. Cerebral edema types: <b>vasogenic</b> (tumor, abscess; white matter; responds to dexamethasone), <b>cytotoxic</b> (ischemia, hypoxia, early; no steroid response), <b>interstitial</b> (hydrocephalus).</p>`},
{h:"Herniation syndromes",html:`
<table><thead><tr><th>Type</th><th>Findings</th></tr></thead><tbody>
<tr><td>Subfalcine (cingulate)</td><td>Compresses ACA → contralateral leg weakness</td></tr>
<tr><td><b>Uncal (transtentorial)</b></td><td><b>Ipsilateral fixed dilated pupil</b> (CN III), contralateral hemiparesis, then coma; PCA compression → occipital infarct. Kernohan notch: hemiparesis on the <i>same</i> side as the lesion (false localizing)</td></tr>
<tr><td>Central (downward)</td><td>Bilateral small then midposition pupils, decorticate → decerebrate posturing, Duret brainstem hemorrhages</td></tr>
<tr><td>Tonsillar</td><td>Medullary compression → respiratory and cardiac arrest; precipitated by LP with a posterior fossa mass</td></tr>
<tr><td>Upward</td><td>Posterior fossa mass; after ventricular drainage</td></tr></tbody></table>`},
{h:"ICP treatment ladder",html:`
<ol><li>Head of bed 30°, neck midline, loosen cervical collar; treat fever, pain, agitation, seizures; avoid hypotonic fluids.</li>
<li><b>Osmotic therapy</b>: mannitol (avoid in hypotension; follow osmolar gap) or hypertonic saline (preferred in hypotension).</li>
<li><b>Hyperventilation</b> to PaCO₂ 30–35 mm Hg as a brief bridge to definitive care (vasoconstriction lowers blood volume; prolonged use causes ischemia).</li>
<li>CSF drainage with an external ventricular drain.</li>
<li>Deep sedation; barbiturate coma.</li>
<li>Decompressive craniectomy or removal of the mass.</li></ol>
<div class="hy"><p>Dexamethasone treats vasogenic edema from tumor or abscess only, not trauma, stroke, or hemorrhage.</p></div>`},
{h:"Hydrocephalus",html:`
<table><thead><tr><th>Type</th><th>Causes</th></tr></thead><tbody>
<tr><td>Obstructive (noncommunicating)</td><td>Aqueductal stenosis, posterior fossa tumor, colloid cyst, Chiari II, Dandy-Walker</td></tr>
<tr><td>Communicating</td><td>Impaired arachnoid granulation absorption after SAH or meningitis; normal pressure hydrocephalus</td></tr>
<tr><td>Ex vacuo</td><td>Ventricles enlarge from atrophy; pressure normal; not true hydrocephalus</td></tr></tbody></table>
<ul><li><b>Infants</b>: increasing head circumference, bulging fontanelle, split sutures, "sunsetting" eyes (upgaze palsy), irritability, vomiting.</li>
<li><b>Shunt malfunction</b>: headache, vomiting, lethargy in a shunted patient → CT head and shunt series, urgent neurosurgery.</li>
<li><b>Normal pressure hydrocephalus</b>: see Dementia.</li></ul>`},
{h:"Idiopathic intracranial hypertension",html:`
<p>Woman of childbearing age with obesity or recent weight gain: daily headache, <b>transient visual obscurations</b>, <b>pulsatile tinnitus</b>, diplopia (CN VI), <b>papilledema</b>. Associated drugs: tetracyclines, vitamin A and isotretinoin, growth hormone, steroid withdrawal, lithium.</p>
<ul><li>Diagnosis: MRI with MRV to exclude mass and venous sinus thrombosis (may show empty sella, flattened globes, transverse sinus stenosis); LP opening pressure <b>&gt;25 cm H₂O</b> with normal CSF.</li>
<li>The threat is <b>permanent vision loss</b>: formal visual fields at baseline and follow-up.</li>
<li>Treatment: weight loss, <b>acetazolamide</b> (or topiramate), stop offending drugs. Progressive vision loss → optic nerve sheath fenestration, CSF shunt, or venous sinus stenting.</li></ul>`}],
pearls:[
["Hypertension, bradycardia, irregular breathing in a patient with a mass","Cushing triad: raised ICP"],["Ipsilateral blown pupil + contralateral hemiparesis","Uncal herniation"],
["LP in a patient with a cerebellar mass: risk","Tonsillar herniation"],["Osmotic agent preferred in a hypotensive patient","Hypertonic saline"],
["Hyperventilation target and role","PaCO₂ 30–35, temporary bridge only"],["Edema type that responds to dexamethasone","Vasogenic (tumor, abscess)"],
["Infant with enlarging head and sunsetting eyes","Hydrocephalus"],["Pulsatile tinnitus + papilledema in a young woman with obesity","Idiopathic intracranial hypertension"],

{id:"peds",cat:"cong",title:"Congenital & pediatric neurology",
summary:"Neurocutaneous syndromes, neural tube defects and Chiari malformations, cerebral palsy, the hypotonic infant, developmental red flags, and inherited neurodegenerative disease.",
sections:[
{h:"Neurocutaneous syndromes",html:`
<table><thead><tr><th>Syndrome</th><th>Genetics</th><th>Features</th></tr></thead><tbody>
<tr><td><b>Neurofibromatosis 1</b></td><td>AD, NF1 (neurofibromin), chr 17</td><td>≥6 café-au-lait macules, axillary/inguinal freckling, Lisch nodules, cutaneous and plexiform neurofibromas, <b>optic pathway glioma</b>, sphenoid wing dysplasia, scoliosis, learning disability, pheochromocytoma, malignant nerve sheath tumors</td></tr>
<tr><td><b>Neurofibromatosis 2</b></td><td>AD, NF2 (merlin), chr 22</td><td><b>Bilateral vestibular schwannomas</b>, meningiomas, ependymomas, juvenile cataracts</td></tr>
<tr><td><b>Tuberous sclerosis</b></td><td>AD, TSC1/TSC2 (mTOR)</td><td>Hypopigmented ash-leaf macules (Wood lamp), facial angiofibromas, shagreen patch, ungual fibromas; cortical tubers, subependymal nodules, subependymal giant cell astrocytoma (hydrocephalus); <b>infantile spasms</b>, autism, intellectual disability; cardiac rhabdomyomas, renal angiomyolipomas, lung LAM. Vigabatrin for spasms; everolimus</td></tr>
<tr><td><b>Sturge-Weber</b></td><td>Sporadic somatic GNAQ</td><td><b>Port-wine stain in V1</b>, leptomeningeal angioma, "tram-track" calcifications, seizures, contralateral hemiparesis, glaucoma</td></tr>
<tr><td>Von Hippel-Lindau</td><td>AD, VHL, chr 3</td><td>Cerebellar and retinal hemangioblastomas, clear cell renal carcinoma, pheochromocytoma</td></tr>
<tr><td>Ataxia-telangiectasia</td><td>AR, ATM</td><td>Toddler ataxia, oculocutaneous telangiectasias, IgA deficiency with sinopulmonary infections, lymphoma, high AFP, radiation sensitivity</td></tr></tbody></table>`},
{h:"Neural tube and posterior fossa malformations",html:`
<ul><li><b>Folic acid</b> 0.4 mg daily for everyone who could become pregnant; <b>4 mg</b> after a prior affected pregnancy. Elevated maternal serum AFP on screening.</li>
<li><b>Spina bifida occulta</b>: tuft of hair or dimple over the lower spine; usually asymptomatic; tethered cord possible.</li>
<li><b>Myelomeningocele</b>: paraplegia, neurogenic bladder and bowel, <b>Chiari II and hydrocephalus</b>, latex allergy.</li>
<li><b>Anencephaly</b>: polyhydramnios; incompatible with life.</li>
<li><b>Chiari I</b>: cerebellar tonsils &gt;5 mm below the foramen magnum; adolescent or adult with occipital headache worse with cough or Valsalva, <b>syringomyelia</b>, downbeat nystagmus. Suboccipital decompression if symptomatic.</li>
<li><b>Chiari II</b>: vermis and brainstem herniation with myelomeningocele and hydrocephalus; stridor, apnea, dysphagia in infancy.</li>
<li><b>Dandy-Walker</b>: cystic enlargement of the fourth ventricle, vermis hypoplasia, hydrocephalus.</li></ul>`},
{h:"Cerebral palsy",html:`
<p>Nonprogressive motor disorder from an injury to the developing brain. Prematurity → periventricular leukomalacia → <b>spastic diplegia</b> (legs &gt; arms, scissoring, toe walking). Term hypoxic-ischemic injury → spastic quadriplegia or dyskinetic. Kernicterus → dyskinetic (athetoid) CP with sensorineural hearing loss and upgaze palsy. Perinatal stroke → hemiplegia with early hand preference.</p>
<p>Associated: intellectual disability, epilepsy, strabismus, feeding problems, scoliosis. Management: PT and OT, orthotics, oral baclofen, botulinum toxin, intrathecal baclofen, selective dorsal rhizotomy.</p>
<div class="warn"><p>Loss of skills is never cerebral palsy. Regression demands evaluation for metabolic, genetic, or neurodegenerative disease.</p></div>`},
{h:"Development and the hypotonic infant",html:`
<ul><li><b>Red flags</b>: hand preference before 12 months (suggests hemiparesis), not sitting by 9 months, not walking by 18 months, no words by 16 months, no two-word phrases by 24 months, any regression. Moro reflex persisting beyond 6 months.</li></ul>
<table><thead><tr><th></th><th>Central hypotonia</th><th>Peripheral (motor unit) hypotonia</th></tr></thead><tbody>
<tr><td>Strength</td><td>Relatively preserved</td><td>Weak</td></tr>
<tr><td>Reflexes</td><td>Normal or brisk</td><td>Reduced or absent</td></tr>
<tr><td>Other</td><td>Dysmorphism, seizures, poor alertness</td><td>Alert, tongue fasciculations, ptosis</td></tr>
<tr><td>Examples</td><td>Down syndrome, Prader-Willi (poor feeding, later hyperphagia), hypoxic-ischemic encephalopathy</td><td>SMA, infant botulism, congenital myotonic dystrophy (mother has myotonia), congenital myasthenic syndromes, Pompe disease (cardiomegaly, macroglossia)</td></tr></tbody></table>`},
{h:"Genetic and neurodegenerative",html:`
<table><thead><tr><th>Disorder</th><th>Clues</th></tr></thead><tbody>
<tr><td>Rett syndrome</td><td>Girl, MECP2; normal until 6–18 months, then regression, loss of purposeful hand use, <b>hand-wringing</b>, slowed head growth, breathing irregularities, seizures</td></tr>
<tr><td>Fragile X</td><td>FMR1 CGG repeat; boys with intellectual disability, autism, long face, large ears, macroorchidism</td></tr>
<tr><td>Friedreich ataxia</td><td>AR GAA repeat (frataxin); teen with progressive ataxia, areflexia with Babinski signs, dorsal column loss, pes cavus, scoliosis, <b>hypertrophic cardiomyopathy</b> (main cause of death), diabetes</td></tr>
<tr><td>Tay-Sachs</td><td>Hexosaminidase A; infant with exaggerated startle, regression, <b>cherry-red macula</b>, no hepatosplenomegaly</td></tr>
<tr><td>Niemann-Pick type A</td><td>Cherry-red macula <b>with</b> hepatosplenomegaly</td></tr>
<tr><td>Krabbe</td><td>Galactocerebrosidase; irritability, spasticity, neuropathy, optic atrophy, globoid cells</td></tr>
<tr><td>Metachromatic leukodystrophy</td><td>Arylsulfatase A; gait decline, neuropathy, cognitive regression</td></tr>
<tr><td>X-linked adrenoleukodystrophy</td><td>School-age boy with behavior and school decline, vision or hearing problems, <b>adrenal insufficiency</b>; elevated very-long-chain fatty acids; early stem cell transplant</td></tr>
<tr><td>Down syndrome</td><td>Infantile spasms, early-onset Alzheimer, atlantoaxial instability, moyamoya</td></tr></tbody></table>`},
{h:"Acute pediatric presentations",html:`
<ul><li><b>Acute cerebellar ataxia</b>: age 2–5, days after varicella or another viral illness, truncal ataxia, normal mental status; resolves in weeks. Exclude ingestion, posterior fossa tumor, opsoclonus-myoclonus (neuroblastoma).</li>
<li><b>Breath-holding spells</b>: cyanotic (after crying, anger) or pallid (after pain or fright), brief LOC ± jerks; benign; check for iron deficiency anemia.</li>
<li><b>Benign paroxysmal vertigo of childhood</b>: brief vertigo spells in a toddler; migraine precursor.</li>
<li><b>Moyamoya</b>: child with recurrent TIAs or strokes provoked by crying or hyperventilation; "puff of smoke" on angiography; associated with sickle cell, Down syndrome, NF1. Sickle cell stroke prevention: transcranial Doppler screening and chronic transfusion.</li></ul>`}],

{id:"drugs",cat:"drug",title:"Neurologic adverse drug effects",
summary:"Extrapyramidal syndromes by timeline, NMS vs serotonin syndrome, drug-induced seizures, neuropathy, ototoxicity, optic neuropathy, and withdrawal syndromes.",
sections:[
{h:"Extrapyramidal effects of dopamine blockers",html:`
<table><thead><tr><th>Syndrome</th><th>Onset</th><th>Features</th><th>Treatment</th></tr></thead><tbody>
<tr><td>Acute dystonia</td><td>Hours to days</td><td>Torticollis, oculogyric crisis, trismus, laryngospasm; young men, high-potency agents, antiemetics</td><td><b>IV/IM diphenhydramine or benztropine</b></td></tr>
<tr><td>Akathisia</td><td>Days to weeks</td><td>Inner restlessness, pacing, can't sit still</td><td>Lower the dose, <b>propranolol</b>, benzodiazepine</td></tr>
<tr><td>Drug-induced parkinsonism</td><td>Weeks</td><td>Symmetric bradykinesia, rigidity, tremor</td><td>Lower or switch drug; benztropine or amantadine</td></tr>
<tr><td>Tardive dyskinesia</td><td>Months to years</td><td>Orofacial chewing, lip smacking, tongue darting, choreoathetosis</td><td>Stop or switch (clozapine, quetiapine); <b>VMAT2 inhibitor</b> (valbenazine, deutetrabenazine). Anticholinergics worsen it</td></tr></tbody></table>
<p>Culprits include antipsychotics and the antiemetics <b>metoclopramide and prochlorperazine</b>.</p>`},
{h:"Hyperthermic syndromes",html:`
<table><thead><tr><th></th><th>Neuroleptic malignant syndrome</th><th>Serotonin syndrome</th><th>Malignant hyperthermia</th><th>Anticholinergic</th></tr></thead><tbody>
<tr><td>Trigger</td><td>Dopamine antagonist, or abrupt stop of levodopa</td><td>Serotonergic combination (SSRI + MAOI, linezolid, tramadol, meperidine, fentanyl, triptan, dextromethorphan, St John's wort)</td><td>Succinylcholine, volatile anesthetics (RYR1)</td><td>Antihistamines, TCAs, atropine, jimsonweed</td></tr>
<tr><td>Onset</td><td>Days</td><td><b>Hours</b></td><td>Minutes in OR</td><td>Hours</td></tr>
<tr><td>Muscle</td><td><b>Lead-pipe rigidity</b>, bradyreflexia</td><td><b>Clonus</b> (ocular, inducible), hyperreflexia, tremor, legs &gt; arms</td><td>Masseter and generalized rigidity</td><td>Normal</td></tr>
<tr><td>Other</td><td>Altered mental status, autonomic instability, high CK, leukocytosis</td><td>Agitation, mydriasis, diaphoresis, diarrhea, hyperactive bowel sounds</td><td>Hypercarbia, tachycardia, hyperkalemia</td><td>Dry hot skin, mydriasis, urinary retention, ileus</td></tr>
<tr><td>Treatment</td><td>Stop drug, cool, fluids; <b>dantrolene</b>, bromocriptine; benzodiazepines</td><td>Stop drugs, benzodiazepines, <b>cyproheptadine</b></td><td><b>Dantrolene</b>, stop anesthetic</td><td>Supportive; physostigmine</td></tr></tbody></table>`},
{h:"Drug effects by system",html:`
<table><thead><tr><th>Effect</th><th>Drugs</th></tr></thead><tbody>
<tr><td>Lower seizure threshold</td><td><b>Bupropion</b>, tramadol, meperidine (normeperidine), isoniazid (treat with pyridoxine), imipenem, cefepime (renal failure), high-dose penicillin, theophylline, clozapine, lithium, flumazenil in benzodiazepine dependence</td></tr>
<tr><td>Peripheral neuropathy</td><td>Vincristine, platinums, taxanes, bortezomib, isoniazid, metronidazole, nitrofurantoin, linezolid, amiodarone, colchicine, phenytoin, dapsone</td></tr>
<tr><td>Ototoxicity</td><td>Aminoglycosides (vestibular and cochlear), cisplatin, loop diuretics, high-dose aspirin (reversible tinnitus)</td></tr>
<tr><td>Optic neuropathy</td><td><b>Ethambutol</b> (red-green color loss), linezolid, amiodarone, methanol</td></tr>
<tr><td>Intracranial hypertension</td><td>Tetracyclines, vitamin A and isotretinoin, growth hormone, corticosteroid withdrawal</td></tr>
<tr><td>Cerebellar syndrome</td><td>Phenytoin, carbamazepine, lithium, alcohol, metronidazole, high-dose cytarabine, 5-FU</td></tr>
<tr><td>Encephalopathy</td><td>Ifosfamide (methylene blue), cefepime, valproate (hyperammonemia), methotrexate, calcineurin inhibitors (PRES), CAR-T cell therapy (ICANS: aphasia, seizures; steroids)</td></tr>
<tr><td>Aseptic meningitis</td><td>NSAIDs, TMP-SMX, IVIG, lamotrigine</td></tr>
<tr><td>Myopathy</td><td>Statins, glucocorticoids, colchicine, zidovudine, daptomycin</td></tr>
<tr><td>NMJ worsening</td><td>Aminoglycosides, fluoroquinolones, macrolides, magnesium, β-blockers</td></tr>
<tr><td>Immune checkpoint inhibitors</td><td>Myasthenia, myositis (often overlap with myocarditis), GBS, encephalitis</td></tr>
<tr><td>PML</td><td>Natalizumab, rituximab, other immunosuppressants</td></tr>
<tr><td>Tremor</td><td>Lithium, valproate, β-agonists, SSRIs, amiodarone, tacrolimus, levothyroxine excess</td></tr></tbody></table>
<p><b>Lithium toxicity</b>: coarse tremor, ataxia, dysarthria, confusion, seizures; precipitated by dehydration, NSAIDs, ACE inhibitors, thiazides. Hemodialysis if severe.</p>`},
{h:"Withdrawal syndromes",html:`
<table><thead><tr><th>Syndrome</th><th>Timing after last drink</th><th>Features</th></tr></thead><tbody>
<tr><td>Minor alcohol withdrawal</td><td>6–24 h</td><td>Tremor, anxiety, sweating, tachycardia, insomnia</td></tr>
<tr><td>Withdrawal seizures</td><td>12–48 h</td><td>Generalized tonic-clonic, usually brief</td></tr>
<tr><td>Alcoholic hallucinosis</td><td>12–48 h</td><td>Visual, tactile, or auditory hallucinations with a clear sensorium</td></tr>
<tr><td>Delirium tremens</td><td><b>48–96 h</b></td><td>Delirium, fever, autonomic instability; mortality without treatment</td></tr></tbody></table>
<div class="hy"><p>Treat alcohol withdrawal with <b>benzodiazepines</b> (symptom-triggered dosing by CIWA-Ar; phenobarbital is an alternative), plus thiamine, folate, and electrolyte repletion. Benzodiazepine and barbiturate withdrawal also cause seizures; opioid withdrawal does not.</p></div>`},
{h:"Older adults",html:`
<p>Avoid strongly anticholinergic drugs (diphenhydramine, hydroxyzine, TCAs, oxybutynin), benzodiazepines, and sedative hypnotics where possible: they cause delirium, falls, and cognitive decline (Beers criteria).</p>`}],

{id:"neuroophth",cat:"eye",title:"Neuro-ophthalmology",
summary:"Visual field localization, pupils, optic disc swelling, acute vision loss, diplopia, and eye movement syndromes. Use the Localize tab to click through the visual pathway.",
sections:[
{h:"Visual field defects",html:`
<table><thead><tr><th>Lesion</th><th>Defect</th><th>Typical cause</th></tr></thead><tbody>
<tr><td>Optic nerve</td><td>Monocular vision loss or central scotoma, RAPD</td><td>Optic neuritis, ischemic optic neuropathy, compression</td></tr>
<tr><td>Optic chiasm</td><td><b>Bitemporal hemianopia</b></td><td>Pituitary adenoma, craniopharyngioma, meningioma</td></tr>
<tr><td>Optic tract</td><td>Contralateral homonymous hemianopia (incongruous)</td><td>Tumor, anterior choroidal stroke</td></tr>
<tr><td>Meyer loop (temporal lobe)</td><td>Contralateral <b>superior</b> quadrantanopia ("pie in the sky")</td><td>Temporal lobe stroke (inferior MCA), tumor, temporal lobectomy</td></tr>
<tr><td>Parietal radiations</td><td>Contralateral <b>inferior</b> quadrantanopia</td><td>Parietal stroke (superior MCA)</td></tr>
<tr><td>Occipital cortex</td><td>Contralateral homonymous hemianopia <b>with macular sparing</b></td><td>PCA stroke (macula has dual MCA/PCA supply)</td></tr>
<tr><td>Bilateral occipital</td><td>Cortical blindness with normal pupils; may deny blindness (Anton syndrome)</td><td>Top-of-basilar stroke, PRES, cardiac arrest</td></tr></tbody></table>`},
{h:"Pupils",html:`
<table><thead><tr><th>Pupil</th><th>Findings</th><th>Cause</th></tr></thead><tbody>
<tr><td><b>RAPD</b> (Marcus Gunn)</td><td>Swinging flashlight: affected pupil dilates when light swings to it</td><td>Optic nerve disease or large retinal lesion (not cataract)</td></tr>
<tr><td>Horner</td><td>Small pupil, mild ptosis, anisocoria worse in the dark</td><td>Sympathetic lesion (see Cranial nerves)</td></tr>
<tr><td>CN III</td><td>Large unreactive pupil with ptosis and down-and-out eye</td><td>Compression</td></tr>
<tr><td>Adie tonic pupil</td><td>Young woman, large pupil, poor light reaction, slow constriction to near; with absent reflexes = Holmes-Adie</td><td>Ciliary ganglion; constricts to dilute pilocarpine</td></tr>
<tr><td>Argyll Robertson</td><td>Small irregular pupils that accommodate but don't react</td><td>Neurosyphilis (also diabetes)</td></tr>
<tr><td>Pharmacologic mydriasis</td><td>Fixed dilated pupil, otherwise normal exam; <b>does not constrict to 1% pilocarpine</b></td><td>Scopolamine patch, nebulized ipratropium, plants</td></tr>
<tr><td>Physiologic anisocoria</td><td>Difference ≤1 mm, same in light and dark</td><td>Normal</td></tr></tbody></table>`},
{h:"Swollen or pale disc",html:`
<table><thead><tr><th>Condition</th><th>Features</th></tr></thead><tbody>
<tr><td><b>Papilledema</b></td><td>Bilateral disc swelling from raised ICP; vision preserved early (enlarged blind spot, transient obscurations). <b>Image before LP</b></td></tr>
<tr><td>Optic neuritis</td><td>Painful, subacute monocular vision loss; disc normal (retrobulbar) or swollen; RAPD; MS association</td></tr>
<tr><td>Nonarteritic AION</td><td>Painless monocular loss on waking, <b>altitudinal</b> defect, swollen disc, small crowded fellow disc; vascular risk factors</td></tr>
<tr><td><b>Arteritic AION</b> (GCA)</td><td>Age &gt;50, pallid disc edema, jaw claudication, ↑ESR/CRP; risk to the other eye → <b>steroids now</b></td></tr>
<tr><td>Leber hereditary optic neuropathy</td><td>Young man, painless sequential central vision loss; mitochondrial</td></tr>
<tr><td>Toxic or nutritional</td><td>Bilateral central scotomas: ethambutol, methanol, B12, tobacco-alcohol</td></tr>
<tr><td>Compressive</td><td>Slowly progressive loss with optic pallor</td></tr></tbody></table>`},
{h:"Acute painless vision loss",html:`
<ul><li><b>Central retinal artery occlusion</b>: sudden painless monocular loss, pale retina with <b>cherry-red spot</b>, RAPD. It is a stroke: emergent stroke workup and evaluation for thrombolysis at a stroke center.</li>
<li><b>Central retinal vein occlusion</b>: "blood and thunder" retina; hypertension, diabetes, hypercoagulability.</li>
<li><b>Amaurosis fugax</b>: transient monocular curtain; carotid workup.</li>
<li><b>Retinal detachment</b>: flashes, floaters, then a curtain. Vitreous hemorrhage: diabetes.</li>
<li><b>Painful red eye</b> with halos and mid-dilated pupil: acute angle-closure glaucoma.</li></ul>`},
{h:"Diplopia and eye movements",html:`
<ul><li><b>Monocular diplopia</b> (persists with the other eye covered) is ocular: cataract, refractive error. <b>Binocular</b> (resolves with either eye covered) is neurologic or orbital.</li>
<li>Binocular causes: CN III, IV, VI palsies; myasthenia (variable, fatigable, pupil spared); <b>thyroid eye disease</b> (restricted upgaze from inferior rectus, proptosis, lid retraction); orbital floor fracture (entrapped inferior rectus); INO; skew deviation.</li>
<li><b>Internuclear ophthalmoplegia</b>: MLF lesion; on lateral gaze the ipsilateral eye fails to adduct and the opposite eye has abducting nystagmus; convergence intact. Young: MS; older: stroke.</li>
<li><b>One-and-a-half syndrome</b>: PPRF or abducens nucleus + MLF; only abduction of the opposite eye remains.</li>
<li>Nystagmus: <b>downbeat</b> (cervicomedullary junction: Chiari, lithium, Wernicke, cerebellar degeneration), upbeat (medulla), gaze-evoked (alcohol, antiseizure drugs), pendular (MS), opsoclonus (neuroblastoma, paraneoplastic).</li>
<li><b>Charles Bonnet syndrome</b>: complex visual hallucinations with insight in an older adult with vision loss.</li></ul>`}],

{id:"vertigo",cat:"eye",title:"Vertigo & hearing loss",
summary:"Sort dizziness by timing and triggers, use the Dix-Hallpike and HINTS exams, treat the peripheral causes, and interpret Weber and Rinne for hearing loss.",
sections:[
{h:"Sort by timing and trigger",html:`
<table><thead><tr><th>Diagnosis</th><th>Episode length</th><th>Hearing</th><th>Key features</th><th>Treatment</th></tr></thead><tbody>
<tr><td><b>BPPV</b></td><td>Seconds</td><td>Normal</td><td>Triggered by rolling over, looking up; <b>Dix-Hallpike</b>: delayed, fatigable upbeat-torsional nystagmus toward the down ear</td><td><b>Epley maneuver</b>; no medication</td></tr>
<tr><td>Vestibular migraine</td><td>Minutes to 72 h</td><td>Usually normal</td><td>Migraine history, photophobia</td><td>Migraine therapy</td></tr>
<tr><td><b>Ménière disease</b></td><td>20 min to 12 h</td><td>Fluctuating low-frequency SNHL</td><td>Tinnitus, <b>aural fullness</b>; endolymphatic hydrops</td><td>Low-salt diet, diuretics, betahistine; intratympanic steroids or gentamicin</td></tr>
<tr><td><b>Vestibular neuritis</b></td><td>Continuous for days</td><td>Normal</td><td>After viral illness; nausea; unidirectional horizontal nystagmus; abnormal head impulse</td><td>Short-term vestibular suppressants, early steroids, vestibular rehabilitation</td></tr>
<tr><td>Labyrinthitis</td><td>Continuous for days</td><td><b>Hearing loss</b></td><td>Neuritis plus cochlear involvement</td><td>As above</td></tr>
<tr><td>Posterior circulation stroke</td><td>Continuous</td><td>May be lost (AICA)</td><td>Central HINTS, ataxia (can't walk), other brainstem signs, vascular risk factors</td><td>Stroke pathway, MRI</td></tr>
<tr><td>Vestibular schwannoma</td><td>Chronic</td><td>Progressive unilateral SNHL</td><td>Imbalance more than vertigo, tinnitus</td><td>MRI with gadolinium</td></tr>
<tr><td>Superior canal dehiscence / perilymph fistula</td><td>Brief</td><td>Variable</td><td>Vertigo from loud sounds or pressure (Tullio), autophony; fistula after barotrauma or straining</td><td>Surgery if disabling</td></tr></tbody></table>
<p>Vestibular suppressants (meclizine, dimenhydrinate, benzodiazepines) only for a few days: they delay central compensation.</p>`},
{h:"HINTS exam",html:`
<p>Use only in <b>acute continuous vertigo with nystagmus</b>. Any central sign means stroke until proven otherwise.</p>
<table><thead><tr><th>Test</th><th>Peripheral (reassuring)</th><th>Central (dangerous)</th></tr></thead><tbody>
<tr><td><b>H</b>ead impulse</td><td>Abnormal: corrective saccade</td><td><b>Normal</b></td></tr>
<tr><td><b>N</b>ystagmus</td><td>Unidirectional horizontal, beats away from the lesion</td><td><b>Direction-changing</b> on gaze, purely vertical or torsional</td></tr>
<tr><td><b>T</b>est of skew</td><td>No vertical refixation</td><td><b>Skew deviation</b></td></tr></tbody></table>
<p>Mnemonic for central: INFARCT (Impulse Normal, Fast-phase Alternating, Refixation on Cover Test). New hearing loss with vertigo can be AICA stroke. Early MRI can miss small posterior fossa strokes.</p>`},
{h:"Hearing loss",html:`
<table><thead><tr><th></th><th>Weber (fork on forehead)</th><th>Rinne (mastoid vs ear)</th></tr></thead><tbody>
<tr><td>Normal</td><td>Midline</td><td>Air &gt; bone</td></tr>
<tr><td>Conductive loss, left</td><td>Lateralizes to <b>left</b> (affected)</td><td>Left: bone &gt; air</td></tr>
<tr><td>Sensorineural loss, left</td><td>Lateralizes to <b>right</b> (normal)</td><td>Air &gt; bone both sides</td></tr></tbody></table>
<ul><li><b>Conductive</b>: cerumen, otitis media with effusion, TM perforation, cholesteatoma, <b>otosclerosis</b> (young adult, family history, normal TM).</li>
<li><b>Sensorineural</b>: presbycusis (bilateral high-frequency; hearing aids), noise (4 kHz notch), ototoxic drugs, Ménière, vestibular schwannoma (<b>asymmetric loss → MRI</b>), meningitis sequelae, congenital CMV (most common nongenetic congenital cause), GJB2 connexin-26 (most common genetic).</li>
<li><b>Sudden sensorineural hearing loss</b>: urgent audiogram and <b>oral or intratympanic steroids</b>, ideally within 2 weeks.</li>
<li>Pulsatile tinnitus → vascular cause (IIH, dural AV fistula, glomus tumor, carotid stenosis or dissection). Unilateral nonpulsatile tinnitus → MRI.</li></ul>`}],
pearls:[
["Seconds of vertigo when rolling over in bed","BPPV: Dix-Hallpike, then Epley"],["Episodic vertigo for hours with fluctuating hearing loss and ear fullness","Ménière disease"],
["Days of continuous vertigo after a cold, normal hearing, abnormal head impulse","Vestibular neuritis"],["Acute vertigo with a normal head impulse test","Central cause: posterior circulation stroke"],
["Direction-changing nystagmus","Central (cerebellar or brainstem) lesion"],["Weber lateralizes to the left, Rinne bone > air on the left","Left conductive hearing loss"],
["Weber lateralizes to the right, air > bone bilaterally","Left sensorineural hearing loss"],["Asymmetric sensorineural hearing loss","MRI with gadolinium for vestibular schwannoma"],

);

NEURO.topics.push(
{id:"neuropsych",cat:"psych",title:"Functional & neuropsychiatric disorders",
summary:"Functional neurological disorder and its positive exam signs, psychiatric presentations of neurologic disease, depression and catatonia in neurology patients, and malingering vs factitious disorder.",
sections:[
{h:"Functional neurological disorder",html:`
<p>Neurologic symptoms (weakness, sensory loss, tremor, gait disorder, nonepileptic attacks, visual loss) that are genuine and not feigned, but are incompatible with structural disease. Diagnosis rests on <b>positive signs</b>, not on excluding everything.</p>
<table><thead><tr><th>Sign</th><th>What it shows</th></tr></thead><tbody>
<tr><td><b>Hoover sign</b></td><td>Weak hip extension on the affected side becomes normal when the patient flexes the opposite hip against resistance</td></tr>
<tr><td>Give-way weakness</td><td>Sudden collapse of effort after initial normal power</td></tr>
<tr><td>Drift without pronation</td><td>Arm drifts down but does not pronate</td></tr>
<tr><td>Tremor entrainment</td><td>Tremor adopts the rhythm the patient taps with the other hand; stops with distraction</td></tr>
<tr><td>Tubular (tunnel) visual field</td><td>Field width does not expand with distance</td></tr>
<tr><td>Nonepileptic attacks</td><td>Eyes closed, side-to-side head movement, pelvic thrusting, long duration, recall; video EEG confirms</td></tr></tbody></table>
<div class="hy"><p>Explain the diagnosis clearly and without blame, stop unnecessary testing once it is established, and refer for <b>physical therapy and CBT</b>. Schedule regular follow-up. Comorbid depression, anxiety, and prior trauma are common, and a functional disorder can coexist with epilepsy or other disease.</p></div>`},
{h:"Related diagnoses",html:`
<table><thead><tr><th>Disorder</th><th>Intentional?</th><th>Motive</th></tr></thead><tbody>
<tr><td>Functional neurological disorder</td><td>No</td><td>None conscious</td></tr>
<tr><td>Somatic symptom disorder</td><td>No</td><td>Excessive thoughts and anxiety about real symptoms</td></tr>
<tr><td>Illness anxiety disorder</td><td>No</td><td>Fear of having a disease with few symptoms</td></tr>
<tr><td>Factitious disorder</td><td><b>Yes</b></td><td>Internal: to assume the sick role</td></tr>
<tr><td>Malingering</td><td><b>Yes</b></td><td>External: money, drugs, avoiding work or legal trouble</td></tr></tbody></table>`},
{h:"Psychiatric presentations of neurologic disease",html:`
<table><thead><tr><th>Neurologic disorder</th><th>Psychiatric features</th></tr></thead><tbody>
<tr><td>Frontal lobe tumor, behavioral FTD</td><td>Disinhibition, apathy, personality change</td></tr>
<tr><td>Anti-NMDA receptor encephalitis</td><td>New psychosis in a young woman, then seizures and dyskinesias</td></tr>
<tr><td>Huntington disease</td><td>Depression, irritability, psychosis, suicide before chorea</td></tr>
<tr><td>Wilson disease</td><td>Mood change, psychosis in an adolescent with tremor or liver disease</td></tr>
<tr><td>Parkinson disease</td><td>Depression, anxiety, apathy; psychosis from dopaminergics; impulse control disorders from agonists</td></tr>
<tr><td>Multiple sclerosis</td><td>Depression; pseudobulbar affect</td></tr>
<tr><td>Stroke</td><td>Post-stroke depression (common after left frontal stroke); treat with SSRIs</td></tr>
<tr><td>Epilepsy</td><td>Depression and anxiety; postictal psychosis; levetiracetam irritability</td></tr>
<tr><td>Temporal lobe lesions (bilateral amygdala)</td><td>Klüver-Bucy: hyperorality, hypersexuality, docility</td></tr>
<tr><td>Systemic</td><td>Hypothyroidism, B12, neurosyphilis, HIV, SLE, porphyria, Cushing</td></tr></tbody></table>
<p><b>Depression-related cognitive impairment</b> (pseudodementia): complains loudly about memory, gives "I don't know" answers, poor effort, onset with mood symptoms. Treat the depression and re-test. Many later develop dementia, so follow up.</p>`},
{h:"Treating psychiatric symptoms in neurology",html:`
<ul><li>SSRIs are first-line for depression and anxiety in stroke, epilepsy, PD, MS.</li>
<li><b>Bupropion</b> lowers the seizure threshold; avoid in epilepsy, eating disorders, and alcohol withdrawal.</li>
<li>TCAs and SNRIs do double duty for neuropathic pain or migraine prevention.</li>
<li>Pseudobulbar affect (ALS, MS, stroke): dextromethorphan-quinidine or an SSRI.</li>
<li>Antipsychotics: avoid typical agents in PD and Lewy body dementia; boxed warning for mortality in older adults with dementia.</li></ul>`},
{h:"Catatonia",html:`
<p>Mutism, stupor, posturing, waxy flexibility, staring, negativism, echolalia. Causes include mood disorders and schizophrenia, but also <b>medical and neurologic disease</b> (autoimmune encephalitis, nonconvulsive status, metabolic derangement). Malignant catatonia with fever and autonomic instability resembles NMS. <b>Lorazepam challenge</b> is diagnostic and therapeutic; ECT if refractory. Avoid antipsychotics during acute catatonia.</p>`}],
pearls:[
["Weak hip extension that becomes strong when the other hip flexes against resistance","Hoover sign: functional weakness"],["Tremor changes rhythm to match tapping in the other hand","Entrainment: functional tremor"],
["Functional neurological disorder management","Explain diagnosis, physical therapy, CBT, follow-up"],["Fakes illness to obtain opioids","Malingering"],
["Injects insulin secretly to be admitted, no external gain","Factitious disorder"],["Young woman with new psychosis, then seizures and orofacial dyskinesias","Anti-NMDA receptor encephalitis"],
["Hyperorality and hypersexuality after HSV encephalitis","Klüver-Bucy syndrome (bilateral amygdala)"],["Stuporous, mute, waxy flexibility","Catatonia: lorazepam challenge"],
["Antidepressant that lowers seizure threshold","Bupropion"]]},

{id:"ethics",cat:"ethics",title:"Brain death, capacity & palliative neurology",
summary:"How brain death is determined, disorders of consciousness, decision-making capacity and surrogates, driving and genetic testing questions, and end-of-life care in ALS, dementia, and stroke.",
sections:[
{h:"Brain death",html:`
<p>Irreversible loss of all brain function, including the brainstem. It is legal death.</p>
<ol><li><b>Prerequisites</b>: known catastrophic cause consistent with the exam; exclude confounders: hypothermia (core temperature &lt;36 °C), sedatives and paralytics, severe metabolic or endocrine derangement, hypotension.</li>
<li><b>Exam</b>: coma with no cerebrally mediated response to noxious stimuli; absent pupillary, corneal, oculocephalic, oculovestibular (cold caloric), gag, and cough reflexes. Spinal reflexes (triple flexion, Lazarus sign) can persist and do not exclude brain death.</li>
<li><b>Apnea test</b>: no respiratory effort with PaCO₂ ≥60 mm Hg and ≥20 above baseline.</li>
<li><b>Ancillary tests</b> (cerebral blood flow study, sometimes EEG) when part of the exam or apnea test cannot be done.</li></ol>
<div class="hy"><p>Once brain death is declared, continuing ventilation is not treatment and family consent is not required to stop it, though families get time and support. Notify the organ procurement organization for any imminent death; trained OPO staff, not the treating team, raise donation.</p></div>`},
{h:"Disorders of consciousness",html:`
<table><thead><tr><th>State</th><th>Wakefulness</th><th>Awareness</th><th>Brainstem reflexes</th></tr></thead><tbody>
<tr><td>Brain death</td><td>None</td><td>None</td><td>Absent; apneic</td></tr>
<tr><td>Coma</td><td>None (eyes closed)</td><td>None</td><td>Variable</td></tr>
<tr><td>Vegetative state (unresponsive wakefulness)</td><td>Eyes open, sleep-wake cycles</td><td>None</td><td>Present; breathes</td></tr>
<tr><td>Minimally conscious state</td><td>Present</td><td>Inconsistent but reproducible (tracking, following commands)</td><td>Present</td></tr>
<tr><td>Locked-in syndrome</td><td>Present</td><td><b>Full</b>; communicates by vertical eye movement or blinks</td><td>Present</td></tr></tbody></table>`},
{h:"Capacity and surrogates",html:`
<ul><li><b>Capacity</b> is decision-specific and assessed by any treating physician: the patient must <b>understand</b> the information, <b>appreciate</b> how it applies to them, <b>reason</b> about options, and <b>communicate</b> a choice. Aphasia or dementia does not automatically remove capacity; use communication aids.</li>
<li>Without capacity: follow a valid advance directive, then the designated <b>health care proxy</b>, then the default surrogate order set by state law (commonly spouse, adult children, parents, siblings).</li>
<li>Surrogates use <b>substituted judgment</b> (what the patient would want); best interest only when wishes are unknown.</li>
<li>Emergency exception: treat (for example, thrombolysis for stroke) when the patient lacks capacity and no surrogate is reachable.</li>
<li>Withholding and withdrawing life-sustaining treatment are ethically equivalent. Use a professional interpreter, not family, for consent.</li></ul>`},
{h:"Driving, genetics, disclosure",html:`
<ul><li><b>Seizures</b>: driving rules vary by state (typically a seizure-free interval of months). Counsel every patient and document it; a minority of states require physician reporting.</li>
<li><b>Dementia</b>: assess driving safety; formal driving evaluation for mild dementia; moderate dementia should stop.</li>
<li><b>Genetic testing</b> (Huntington): pretest and post-test counseling; patients decide whether to test; avoid presymptomatic testing of minors for adult-onset disorders. GINA protects against health insurance and employment discrimination, not life, disability, or long-term care insurance. Patients should be encouraged to inform at-risk relatives.</li>
<li><b>Bad news</b>: SPIKES (setting, perception, invitation, knowledge, emotions, strategy). Disclose medical errors honestly.</li></ul>`},
{h:"Palliative neurology",html:`
<table><thead><tr><th>Condition</th><th>Key points</th></tr></thead><tbody>
<tr><td>ALS</td><td>Discuss NIV, gastrostomy, and tracheostomy/ventilation preferences early, while speech and cognition allow. Hospice when FVC falls (&lt;30%), with weight loss, or when the patient declines further interventions. Opioids for dyspnea; glycopyrrolate for sialorrhea</td></tr>
<tr><td>Advanced dementia</td><td><b>Feeding tubes do not prolong survival, prevent aspiration, or heal pressure ulcers</b>; offer careful hand feeding. Treat infections per goals; hospice eligibility based on function and complications</td></tr>
<tr><td>Severe stroke or ICH</td><td>Avoid very early do-not-resuscitate decisions driven by prognostic nihilism; give full care initially and revisit goals over days</td></tr>
<tr><td>Glioblastoma</td><td>Early goals-of-care discussion; steroid and seizure management at end of life</td></tr>
<tr><td>Symptoms at end of life</td><td>Dyspnea and pain: opioids (double effect is ethically acceptable); terminal secretions: glycopyrrolate or scopolamine; agitation: haloperidol</td></tr></tbody></table>
<p>Hospice: expected prognosis of 6 months or less if the disease runs its usual course.</p>`}],
pearls:[
["Apnea test threshold","No breathing with PaCO₂ ≥60 and ≥20 above baseline"],["Triple flexion response in a patient being evaluated for brain death","Spinal reflex; compatible with brain death"],
["Temperature that confounds a brain death exam","Below 36 °C"],["Eyes open, sleep-wake cycles, no awareness","Vegetative state"],
["Four elements of capacity","Understand, appreciate, reason, express a choice"],["Surrogate standard when patient wishes are known","Substituted judgment"],

<script>/* questions-1.js */
NEURO.questions.push(
{t:"localization",stem:"A 64-year-old man has sudden weakness of the right face and arm. His speech is slow, effortful, and halting, with frequent omission of small words. He follows three-step commands correctly but cannot repeat a simple phrase. He is visibly frustrated by his speech. Which structure is most likely damaged?",
opts:["Left superior temporal gyrus","Left arcuate fasciculus","Left inferior frontal gyrus","Right inferior frontal gyrus","Left angular gyrus"],a:2,
exp:"<p>Nonfluent speech with intact comprehension, impaired repetition, and insight is <b>Broca aphasia</b>, from the dominant inferior frontal gyrus (superior division of the left MCA), often with right face and arm weakness. Superior temporal gyrus lesions cause fluent Wernicke aphasia with poor comprehension. Arcuate fasciculus lesions cause conduction aphasia (fluent, comprehension intact). The angular gyrus produces Gerstmann syndrome.</p>"},
{t:"localization",stem:"A 58-year-old woman reports unsteadiness that is much worse in the dark and when she closes her eyes in the shower. Strength is normal. Vibration sense is absent at the toes and reduced at the ankles. She sways and nearly falls when standing with feet together and eyes closed, but finger-to-nose and heel-to-shin testing are accurate with eyes open. Dysfunction of which pathway best explains her findings?",
opts:["Cerebellar vermis","Dorsal columns","Lateral corticospinal tract","Lateral spinothalamic tract","Substantia nigra"],a:1,
exp:"<p>A positive Romberg sign with loss of vibration and proprioception indicates <b>sensory ataxia</b> from dorsal column or large-fiber peripheral nerve disease (B12 deficiency, tabes dorsalis, neuropathy). Cerebellar ataxia is present with eyes open and causes dysmetria. Corticospinal lesions cause weakness and spasticity; spinothalamic lesions cause pain and temperature loss.</p>"},
{t:"diagnostics",stem:"A 67-year-old man is brought to the emergency department with fever, severe headache, and neck stiffness for 1 day. He had a generalized seizure in the ambulance. Temperature is 39.4°C (103°F). He is drowsy but arousable with no focal deficits. Which of the following is the most appropriate next step?",
opts:["Lumbar puncture immediately, then antibiotics based on Gram stain","Noncontrast CT of the head, then lumbar puncture, then antibiotics","Blood cultures, dexamethasone, and empiric antibiotics, followed by CT of the head","MRI of the brain with gadolinium","Observation until CSF culture results return"],a:2,
exp:"<p>A recent seizure and altered consciousness are indications for CT before LP. When imaging must come first, <b>do not delay treatment</b>: draw blood cultures, give dexamethasone with the first antibiotic dose (vancomycin + ceftriaxone + ampicillin at his age), then obtain CT and LP. CSF cultures usually remain positive for a few hours after antibiotics, and delay in therapy increases mortality.</p>"},
{t:"diagnostics",stem:"A 7-year-old girl's teacher reports that she 'zones out' many times each day for a few seconds, with eyelid fluttering, then resumes what she was doing as if nothing happened. Her grades have fallen. In the office, an episode is provoked after 2 minutes of hyperventilation. Which EEG finding is most likely?",
opts:["Hypsarrhythmia","Generalized 3-Hz spike-and-wave discharges","Centrotemporal spikes activated by sleep","Periodic sharp-wave complexes at 1 Hz","Triphasic waves"],a:1,
exp:"<p>Frequent brief staring spells with no postictal state, provoked by hyperventilation, are <b>childhood absence epilepsy</b>, with 3-Hz generalized spike-and-wave discharges. Treatment is ethosuximide. Hypsarrhythmia is seen in infantile spasms; centrotemporal spikes in self-limited rolandic epilepsy; periodic sharp waves in CJD; triphasic waves in metabolic encephalopathy.</p>"},
{t:"stroke",stem:"A 72-year-old woman with atrial fibrillation who takes no anticoagulant develops sudden left hemiplegia, left hemineglect, and rightward gaze deviation. She was last known well 2 hours ago. BP is 204/108 mm Hg. Fingerstick glucose is 112 mg/dL. Noncontrast CT of the head shows no hemorrhage. Platelets and INR are normal. Which of the following is the most appropriate next step?",
opts:["Begin IV alteplase immediately","Give IV labetalol to lower BP below 185/110 mm Hg, then IV alteplase","Give aspirin 325 mg orally","Start a heparin infusion","Allow permissive hypertension and obtain MRI"],a:1,
exp:"<p>She is within 4.5 h with a disabling deficit and no hemorrhage, so she is a thrombolysis candidate, but BP must be <b>below 185/110</b> before alteplase and below 180/105 for 24 h afterward. Use IV labetalol or nicardipine, then treat. Aspirin and heparin are not given before or within 24 h of thrombolysis. Permissive hypertension (up to 220/120) applies only to patients who will not receive thrombolysis. She should also have CTA to evaluate for thrombectomy.</p>"},
{t:"stroke",stem:"A 68-year-old man wakes with left-sided weakness and dysarthria. He was last seen normal at bedtime, 9 hours earlier. NIHSS is 17. CT shows no hemorrhage. CT angiography shows occlusion of the right M1 segment of the middle cerebral artery, and CT perfusion shows a small infarct core with a large region of salvageable tissue. Which of the following is the most appropriate management?",
opts:["IV alteplase","Aspirin and clopidogrel","Heparin infusion","Mechanical thrombectomy","Decompressive hemicraniectomy"],a:3,
exp:"<p>Last known well 9 h ago is outside the IV thrombolysis window, but <b>mechanical thrombectomy</b> is indicated for a large-vessel occlusion up to 24 h when perfusion imaging shows a favorable mismatch. Hemicraniectomy is for malignant edema after a large infarct, not acute reperfusion. Heparin does not improve outcome in acute stroke.</p>"},
{t:"stroke",stem:"A 65-year-old man with hypertension and type 2 diabetes had 40 minutes of right hand weakness and slurred speech that resolved completely. BP is 152/90 mm Hg. Neurologic exam is now normal. MRI shows no infarct. Carotid duplex shows less than 30% stenosis bilaterally. ECG shows sinus rhythm. In addition to a high-intensity statin, which of the following is the most appropriate antithrombotic therapy?",
opts:["No antithrombotic therapy","Aspirin alone indefinitely","Aspirin plus clopidogrel for 21 days, then a single antiplatelet","Warfarin with target INR 2–3","Apixaban"],a:2,
exp:"<p>His ABCD² score is 6 (age 1, BP 1, unilateral weakness 2, duration 10–59 min 1, diabetes 1), a <b>high-risk TIA</b>. Short-term dual antiplatelet therapy for 21 days, then a single agent, lowers early stroke risk. Anticoagulation is for a cardioembolic source such as atrial fibrillation, which has not been found (he still needs prolonged rhythm monitoring). Carotid revascularization is not indicated for minimal stenosis.</p>"},
{t:"stroke",stem:"A 70-year-old man had transient right arm weakness and aphasia 5 days ago that resolved. CT angiography shows 80% stenosis of the left internal carotid artery and 40% stenosis of the right internal carotid artery. He is otherwise in good health. In addition to antiplatelet and statin therapy, which of the following is most appropriate?",
opts:["Left carotid endarterectomy within 2 weeks","Right carotid endarterectomy","Bilateral carotid stenting","Warfarin anticoagulation","Repeat duplex in 6 months"],a:0,
exp:"<p>Symptomatic stenosis of 70–99% in the artery supplying the affected hemisphere (left ICA for right arm weakness and aphasia) warrants <b>carotid endarterectomy</b>, ideally within 2 weeks of the event. The asymptomatic 40% right stenosis is managed medically. Stenting is reserved for high surgical risk. Anticoagulation is not indicated for atherosclerotic stenosis.</p>"},
{t:"syndromes",stem:"A 58-year-old man has sudden vertigo, vomiting, hoarseness, and difficulty swallowing. Examination shows left ptosis and miosis, reduced pain and temperature sensation on the left face and the right arm and leg, left limb ataxia, and decreased left palatal elevation. Strength is normal in all limbs. Occlusion of which artery is most likely?",
opts:["Left anterior inferior cerebellar artery","Left posterior inferior cerebellar artery","Left anterior spinal artery","Basilar artery","Right posterior cerebral artery"],a:1,
exp:"<p>This is <b>lateral medullary (Wallenberg) syndrome</b> from the PICA or vertebral artery: nucleus ambiguus (dysphagia, hoarseness), spinal trigeminal nucleus (ipsilateral face), spinothalamic tract (contralateral body), descending sympathetics (Horner), inferior cerebellar peduncle (ataxia), and vestibular nuclei. The pyramids are medial and spared, so there is no weakness. AICA occlusion causes facial paralysis and hearing loss; anterior spinal artery occlusion causes medial medullary syndrome with hemiparesis.</p>"},
{t:"syndromes",stem:"A 66-year-old woman develops sudden double vision and weakness. Her right eye is deviated down and out with ptosis and a dilated pupil that does not react to light. She has weakness of the left arm and leg with a left Babinski sign. Where is the lesion?",
opts:["Right midbrain","Left midbrain","Right pons","Right internal capsule","Right cavernous sinus"],a:0,
exp:"<p>Ipsilateral CN III palsy with contralateral hemiparesis is <b>Weber syndrome</b>: a lesion of the medial midbrain involving the CN III fascicles and the cerebral peduncle, usually from paramedian branches of the PCA. Crossed signs place the lesion in the brainstem on the side of the cranial nerve deficit. A cavernous sinus lesion affects several ocular nerves without hemiparesis.</p>"},
{t:"syndromes",stem:"A 74-year-old man with long-standing hypertension develops weakness of the right face, arm, and leg that is equal in severity. Sensation, language, and visual fields are normal, and there is no neglect. Which is the most likely site of the infarct?",
opts:["Left frontal cortex (MCA superior division)","Left ventral posterolateral thalamus","Left posterior limb of the internal capsule","Left anterior cerebral artery territory","Right medial pons"],a:2,
exp:"<p>Pure motor hemiparesis affecting face, arm, and leg equally without cortical signs is a <b>lacunar infarct</b> of the posterior limb of the internal capsule (or basis pontis, which would be the left side for right-sided weakness). Cortical MCA strokes spare the leg relatively and cause aphasia or field cuts. VPL thalamic lacunes cause pure sensory stroke. ACA infarcts affect the leg more than the arm.</p>"},
{t:"hemorrhage",stem:"A 45-year-old woman has a sudden severe headache that reached maximal intensity within seconds while lifting weights 8 hours ago. She vomited twice. Neurologic exam is normal; neck flexion is uncomfortable. Noncontrast CT of the head is normal. Which of the following is the most appropriate next step?",
opts:["Discharge with sumatriptan","Lumbar puncture","EEG","Oral prednisone","Repeat CT in 1 week"],a:1,
exp:"<p>Thunderclap headache is <b>subarachnoid hemorrhage</b> until proven otherwise. CT sensitivity falls after 6 h, so a normal CT at 8 h should be followed by <b>lumbar puncture</b> for xanthochromia and red cells that do not clear. A positive LP leads to CTA to find the aneurysm. Triptans are contraindicated until SAH and reversible cerebral vasoconstriction are excluded.</p>"},
{t:"hemorrhage",stem:"A 52-year-old woman had a ruptured anterior communicating artery aneurysm that was coiled on the day of admission. She has been receiving nimodipine. On day 6 she becomes confused and develops new weakness of the right arm. Temperature is normal. Serum sodium is 137 mEq/L. CT of the head shows no new hemorrhage and stable ventricle size. Which of the following is the most likely cause?",
opts:["Aneurysm rebleeding","Delayed cerebral ischemia from vasospasm","Obstructive hydrocephalus","Hyponatremia","Medication-induced encephalopathy"],a:1,
exp:"<p>A new focal deficit between days 3 and 14 after aneurysmal SAH with no new blood or hydrocephalus is <b>vasospasm causing delayed cerebral ischemia</b>. Confirm with transcranial Doppler or CTA, maintain euvolemia, induce hypertension, and consider intra-arterial vasodilators or angioplasty. Rebleeding is most likely in the first 24 h and would show on CT. Sodium is normal.</p>"},
{t:"hemorrhage",stem:"A 78-year-old man taking warfarin for atrial fibrillation develops left hemiparesis and lethargy. CT shows a 30-mL right putaminal hemorrhage. INR is 3.2. BP is 186/94 mm Hg. In addition to BP control, which of the following is the most appropriate treatment?",
opts:["Four-factor prothrombin complex concentrate and IV vitamin K","Oral vitamin K alone","Platelet transfusion","Protamine sulfate","Idarucizumab"],a:0,
exp:"<p>Warfarin-associated ICH requires rapid reversal with <b>4-factor PCC</b> (faster and more complete than fresh frozen plasma) plus <b>IV vitamin K</b> to sustain the effect. Protamine reverses heparin; idarucizumab reverses dabigatran. Platelet transfusion does not help patients on warfarin and is not recommended for antiplatelet users who are not having surgery.</p>"},
{t:"seizures",stem:"A 17-year-old boy has had sudden jerks of both arms each morning for several months, sometimes making him spill his cereal. Yesterday, after staying up all night, he had a generalized tonic-clonic seizure. Neurologic exam and MRI are normal. EEG shows generalized 4–6 Hz polyspike-and-wave discharges with photic stimulation. Which medication is most appropriate?",
opts:["Ethosuximide","Carbamazepine","Valproate","Phenytoin","Gabapentin"],a:2,
exp:"<p>Morning myoclonic jerks with generalized seizures provoked by sleep deprivation are <b>juvenile myoclonic epilepsy</b>. Valproate is the most effective option for a male patient (levetiracetam or lamotrigine are preferred for people who could become pregnant). Carbamazepine, phenytoin, and gabapentin can worsen myoclonic seizures. Ethosuximide treats absence seizures only.</p>"},
{t:"seizures",stem:"A 26-year-old woman with focal epilepsy has been seizure-free for 2 years on valproate. She plans to become pregnant within the next year. Which of the following is the most appropriate change in management?",
opts:["Continue valproate and add folic acid","Switch to lamotrigine and start folic acid","Switch to phenytoin","Stop all antiseizure medication","Switch to topiramate"],a:1,
exp:"<p>Valproate carries the highest risk of major malformations (neural tube defects) and lowers childhood IQ. <b>Lamotrigine or levetiracetam</b> have the lowest teratogenic risk; switch well before conception and give folic acid. Lamotrigine levels fall during pregnancy and need monitoring. Stopping therapy risks seizures, which are dangerous to mother and fetus. Phenytoin and topiramate are more teratogenic.</p>"},
{t:"seizures",stem:"A 30-year-old man with epilepsy is brought in having a generalized convulsion that started 15 minutes ago. He received IV lorazepam twice, 5 minutes apart, without effect. Glucose is normal. He is maintaining oxygen saturation with a nonrebreather mask. Which is the most appropriate next step?",
opts:["A third dose of IV lorazepam","IV levetiracetam","Oral carbamazepine via nasogastric tube","IV magnesium sulfate","Lumbar puncture"],a:1,
exp:"<p>After benzodiazepines fail in status epilepticus, give a <b>second-line IV agent</b>: levetiracetam, fosphenytoin, or valproate, which have similar efficacy. Further benzodiazepine doses add respiratory depression without benefit. If seizures continue, intubate and start a continuous midazolam or propofol infusion with EEG monitoring. Magnesium is for eclampsia.</p>"},
{t:"seizures",stem:"An 18-month-old boy has a 2-minute generalized tonic-clonic seizure at home during a febrile illness. In the emergency department, his temperature is 39.5°C (103.1°F). He is now alert and playful. He has a bulging, erythematous right tympanic membrane. Neck is supple and the neurologic exam is normal. Development is normal. Which is the most appropriate next step?",
opts:["Lumbar puncture","EEG","MRI of the brain","Start daily levetiracetam","Treat the otitis media and reassure the parents"],a:4,
exp:"<p>This is a <b>simple febrile seizure</b>: age 6 months to 5 years, generalized, under 15 minutes, a single event in 24 h, with a return to normal. Management is to identify and treat the fever source and educate the family. EEG, neuroimaging, and daily antiseizure medication are not indicated. LP is considered only with meningeal signs, an incomplete vaccine history, or pretreatment with antibiotics.</p>"},
{t:"headache",stem:"A 35-year-old man who smokes has had severe stabbing pain behind the right eye every night for 2 weeks. Each attack lasts about 45 minutes and wakes him from sleep. During attacks, his right eye tears, his nose runs, and he paces the room. He had a similar 6-week period last year. Which acute treatment is most appropriate?",
opts:["High-flow 100% oxygen via nonrebreather mask","Oral indomethacin","Oral ibuprofen","Propranolol","Verapamil"],a:0,
exp:"<p>This is <b>cluster headache</b>. Acute treatment is high-flow oxygen (12–15 L/min) or subcutaneous sumatriptan. Verapamil is the preventive treatment, started during a cluster period (with ECG monitoring). Indomethacin treats paroxysmal hemicrania, which has shorter, more frequent attacks, mostly in women. Oral analgesics act too slowly.</p>"},
{t:"headache",stem:"A 72-year-old woman has had a new right-sided headache for 3 weeks with scalp tenderness when combing her hair and pain in her jaw while chewing. This morning she had 5 minutes of blurred vision in the right eye. ESR is 88 mm/h. Which of the following is the most appropriate next step?",
opts:["Temporal artery biopsy before starting treatment","High-dose glucocorticoids now","MRI of the brain","Lumbar puncture","Naproxen and follow-up in 1 week"],a:1,
exp:"<p>Suspected <b>giant cell arteritis</b> with visual symptoms threatens permanent blindness. Start high-dose glucocorticoids immediately (IV methylprednisolone with active vision loss), then confirm with temporal artery biopsy or ultrasound; biopsy remains diagnostic for 1–2 weeks after steroids begin. Delaying treatment for biopsy is incorrect.</p>"},
{t:"headache",stem:"A 26-year-old woman has daily headaches for 2 months, brief episodes of graying-out of vision when she stands, and a whooshing sound in her ears. BMI is 38 kg/m². Fundoscopy shows bilateral papilledema. Visual acuity is normal; she has enlarged blind spots. MRI and MR venography are normal. Lumbar puncture opening pressure is 34 cm H₂O with normal CSF. Which of the following is the most appropriate treatment?",
opts:["Sumatriptan as needed","Acetazolamide and a weight-loss program","Ventriculoperitoneal shunt now","Oral prednisone","Repeat lumbar punctures weekly as the only therapy"],a:1,
exp:"<p>This is <b>idiopathic intracranial hypertension</b>. First-line therapy is weight loss and <b>acetazolamide</b>, with serial visual field monitoring. Surgery (optic nerve sheath fenestration, CSF shunt, venous sinus stenting) is reserved for progressive vision loss despite medical therapy. Steroids worsen weight gain; repeated LPs are not a sustainable treatment.</p>"},
{t:"headache",stem:"A 28-year-old woman has migraine without aura on 8 days each month despite appropriate acute treatment. She has obesity and would like to lose weight. She uses an IUD and does not plan pregnancy. Which preventive medication is most appropriate?",
opts:["Amitriptyline","Valproate","Propranolol","Topiramate","Daily sumatriptan"],a:3,
exp:"<p>Choose migraine prevention by comorbidity. <b>Topiramate</b> commonly causes weight loss, making it a good fit here; she needs reliable contraception because it is teratogenic. Amitriptyline, valproate, and propranolol tend to cause weight gain. Daily triptan use would cause medication overuse headache.</p>"}
);

</script>
<script>/* questions-2.js */
NEURO.questions.push(
{t:"neuropain",stem:"A 62-year-old woman has had brief, electric shock–like pains in the right cheek and upper lip for 2 months. Each lasts a few seconds and is triggered by brushing her teeth, chewing, or a cold breeze. Between attacks she is pain-free. Neurologic examination, including facial sensation and corneal reflexes, is normal. MRI shows no mass. Which of the following is the most appropriate initial treatment?",
opts:["Sumatriptan","Oral prednisone","Gabapentin","Microvascular decompression","Carbamazepine"],a:4,
exp:"<p>Paroxysmal, triggered V2/V3 pain with a normal exam is classic <b>trigeminal neuralgia</b>. First-line therapy is <b>carbamazepine</b> (or oxcarbazepine). Microvascular decompression is for medically refractory cases. Gabapentin is a second-line add-on. Sensory loss, bilateral symptoms, or young age should prompt a search for MS or a mass.</p>"},
{t:"neuropain",stem:"A 45-year-old woman had a distal radius fracture treated with casting 3 months ago. The fracture has healed on X-ray, but she has severe burning pain in the hand that is triggered by light touch. The hand is swollen, shiny, cooler and more sweaty than the other side, and she cannot fully close her fist. Which of the following is the most appropriate management?",
opts:["Long-term opioid therapy","Repeat casting for 6 weeks","Physical and occupational therapy with graded mobilization","Surgical exploration of the median nerve","Reassurance that this will resolve without treatment"],a:2,
exp:"<p>Pain out of proportion with allodynia plus vasomotor, sudomotor, edema, and motor or trophic changes after a fracture is <b>complex regional pain syndrome type I</b>. The mainstay is early <b>physical and occupational therapy</b> to restore function, with adjuncts such as NSAIDs, gabapentinoids, short steroid courses, bisphosphonates, or sympathetic blocks. Immobilization worsens it. Opioids are not first-line.</p>"},
{t:"dementia",stem:"A 74-year-old man has had 1 year of worsening memory and attention that varies widely from day to day. He describes seeing children playing in his living room. His wife says he has been punching and kicking in his sleep for years. Exam shows mild symmetric rigidity and bradykinesia. Last week, haloperidol given for hallucinations caused severe rigidity and confusion. Which is the most likely diagnosis?",
opts:["Alzheimer disease","Vascular dementia","Frontotemporal dementia","Dementia with Lewy bodies","Creutzfeldt-Jakob disease"],a:3,
exp:"<p><b>Dementia with Lewy bodies</b>: fluctuating cognition, well-formed visual hallucinations, parkinsonism, and REM sleep behavior disorder, with severe sensitivity to antipsychotics. Cognitive symptoms began before or within a year of parkinsonism. Treat cognition with a cholinesterase inhibitor; avoid typical antipsychotics.</p>"},
{t:"dementia",stem:"A 78-year-old woman has had 1 year of a slow, wide-based, shuffling gait in which her feet seem stuck to the floor. More recently she has urinary urgency with incontinence and slowed thinking. CT of the head shows enlarged lateral ventricles out of proportion to sulcal atrophy. Which of the following is the most appropriate next step?",
opts:["High-volume lumbar puncture with gait assessment before and after","Donepezil","Trial of carbidopa-levodopa","Oxybutynin","MRI of the lumbar spine"],a:0,
exp:"<p>Gait disturbance first, then urinary incontinence and cognitive decline, with ventriculomegaly, suggests <b>normal pressure hydrocephalus</b>. Removing 30–50 mL of CSF (tap test) and documenting gait improvement predicts response to a ventriculoperitoneal shunt. Oxybutynin or donepezil would treat symptoms without addressing the cause.</p>"},
{t:"dementia",stem:"A 56-year-old man has become increasingly tactless over 2 years. He makes inappropriate sexual comments, eats large amounts of sweets, has stopped showering, and seems indifferent to his family. He scores near normal on memory testing and is oriented. MRI shows atrophy of the frontal and anterior temporal lobes. Which medication is most appropriate for his behavioral symptoms?",
opts:["Donepezil","Memantine","Sertraline","Haloperidol","Lecanemab"],a:2,
exp:"<p>This is <b>behavioral-variant frontotemporal dementia</b>. Cholinesterase inhibitors and memantine do not help and can worsen behavior. <b>SSRIs</b> (or trazodone) can reduce disinhibition and compulsions. Antipsychotics are a last resort. Anti-amyloid antibodies are for Alzheimer disease with confirmed amyloid.</p>"},
{t:"dementia",stem:"A 70-year-old woman has 1 year of progressive forgetfulness. She repeats questions and recently needed help paying bills. She remains independent in bathing and dressing. Neurologic exam is otherwise normal. MoCA is 21/30. In addition to screening for depression and reviewing her medications, which evaluation is most appropriate?",
opts:["APOE genotyping","EEG","Lumbar puncture for amyloid and tau","TSH, vitamin B12, metabolic panel, CBC, and brain imaging","Amyloid PET scan"],a:3,
exp:"<p>Every patient with new cognitive decline needs evaluation for <b>reversible contributors</b>: CBC, metabolic panel, TSH, B12, and CT or MRI (to exclude subdural hematoma, tumor, NPH, strokes). APOE genotyping is not diagnostic. CSF biomarkers and amyloid PET are reserved for atypical or early-onset cases or before anti-amyloid therapy.</p>"},
{t:"encephalopathy",stem:"An 84-year-old woman is 2 days after surgical repair of a hip fracture. Nurses report she is drowsy during the day and pulls at her IV at night. She cannot list the months backward, and her attention wanders mid-sentence. She was given diphenhydramine each night for sleep. A bladder scan shows 800 mL of urine. Vital signs are normal. Which of the following is the most appropriate next step?",
opts:["Lorazepam at bedtime","Scheduled haloperidol every 6 hours","Stop diphenhydramine and decompress the bladder","Bilateral wrist restraints","CT of the head"],a:2,
exp:"<p>Acute fluctuating inattention with altered alertness is <b>delirium</b>. The obvious contributors are an anticholinergic drug and urinary retention (which diphenhydramine also causes). Remove the cause and use nonpharmacologic measures. Benzodiazepines and restraints worsen delirium; antipsychotics are only for agitation that endangers the patient. Imaging is reserved for focal signs, a fall, or anticoagulation.</p>"},
{t:"encephalopathy",stem:"A 59-year-old man is comatose 2 days after a large left hemispheric hemorrhage. With his head elevated 30°, 50 mL of ice water is instilled into the right ear canal. Both eyes slowly and tonically deviate toward the right ear, without a fast corrective phase. How should this response be interpreted?",
opts:["Severe brainstem dysfunction","Psychogenic unresponsiveness","Consistent with brain death","Right vestibular nerve lesion","Intact brainstem vestibulo-ocular pathways in a comatose patient"],a:4,
exp:"<p>Cold calorics in a comatose patient with an intact brainstem produce <b>tonic deviation toward the irrigated ear</b>; the fast phase back (cortical) is lost. An awake patient would have nystagmus with the fast phase away from the cold ear (COWS), which is how psychogenic unresponsiveness is unmasked. No response indicates brainstem dysfunction and is one criterion for brain death.</p>"},
{t:"encephalopathy",stem:"A 60-year-old man had return of spontaneous circulation after 25 minutes of cardiac arrest and was treated with targeted temperature management. Twenty-four hours after rewarming, while still receiving propofol, he has absent corneal reflexes and no motor response. His family asks whether he will recover. Which response is most appropriate?",
opts:["Recommend withdrawal of life support now","Begin brain death testing today","Continue full support and reassess neurologic prognosis at least 72 hours after normothermia, off sedation","Tell the family that an EEG alone will determine his prognosis","Tell the family recovery is certain"],a:2,
exp:"<p>Prognosis after cardiac arrest should not be assigned until <b>at least 72 h after return to normothermia</b> and after sedatives clear. Early absent reflexes under sedation are unreliable. Multimodal assessment (exam, SSEPs, EEG, neuron-specific enolase, MRI) is used. Brain death testing requires that confounders such as sedation be excluded first.</p>"},
{t:"systemic",stem:"A 48-year-old man with alcohol use disorder is brought in confused. He has horizontal nystagmus, bilateral abduction weakness, and cannot walk without assistance. Fingerstick glucose is 62 mg/dL. Which of the following is the most appropriate next step?",
opts:["IV dextrose, then thiamine once glucose normalizes","IV thiamine, followed by IV dextrose","Oral thiamine at discharge","IV lorazepam","MRI of the brain before treatment"],a:1,
exp:"<p>Confusion, ophthalmoplegia, and ataxia indicate <b>Wernicke encephalopathy</b>. Give <b>IV thiamine before or with glucose</b>, because glucose metabolism consumes thiamine and can precipitate or worsen Wernicke. Do not delay treatment for imaging. Oral thiamine is poorly absorbed and inadequate for acute disease.</p>"},
{t:"systemic",stem:"A 52-year-old woman with alcohol use disorder and poor oral intake was admitted with a serum sodium of 108 mEq/L. Over the first 24 hours her sodium rose to 127 mEq/L. Three days later she develops slurred speech, difficulty swallowing, and weakness of all four limbs with hyperreflexia. Which is the most likely diagnosis?",
opts:["Wernicke encephalopathy","Basilar artery thrombosis","Guillain-Barré syndrome","Osmotic demyelination syndrome","Hepatic encephalopathy"],a:3,
exp:"<p>Correction of chronic hyponatremia by 19 mEq/L in 24 h far exceeds the safe limit (about 8–10). Days later, <b>osmotic demyelination</b> of the pons causes dysarthria, dysphagia, and spastic quadriparesis, sometimes a locked-in state. Alcohol use and malnutrition increase risk. GBS causes areflexia, not hyperreflexia.</p>"},
{t:"systemic",stem:"A 24-year-old man has 2 months of numbness in his feet and hands and unsteady gait. He frequently inhales nitrous oxide from whipped-cream canisters at parties. Exam shows absent vibration sense at the toes, a positive Romberg sign, brisk knee reflexes, and bilateral Babinski signs. Hemoglobin is normal. Which laboratory finding is most likely?",
opts:["Positive anti-aquaporin-4 antibodies","Low serum copper","Elevated creatine kinase","Positive serum RPR","Elevated methylmalonic acid"],a:4,
exp:"<p>Nitrous oxide inactivates vitamin B12, causing <b>subacute combined degeneration</b> (dorsal columns + corticospinal tracts) even when serum B12 and hemoglobin are normal. <b>Methylmalonic acid and homocysteine</b> are elevated. Treat with B12 and stop exposure. Copper deficiency causes an identical myelopathy but would follow bariatric surgery or zinc excess.</p>"},
{t:"parkinson",stem:"A 60-year-old man with Parkinson disease started pramipexole 1 year ago with good motor response. His wife reports he has lost $20,000 gambling online and has become preoccupied with sex, which is new for him. He is cognitively intact. Which of the following is the most appropriate next step?",
opts:["Add quetiapine","Add amantadine","Increase the pramipexole dose","Taper pramipexole and replace with carbidopa-levodopa","Refer for deep brain stimulation"],a:3,
exp:"<p><b>Impulse control disorders</b> (gambling, shopping, hypersexuality, binge eating) are a class effect of <b>dopamine agonists</b>. Taper the agonist and use levodopa for motor control. Screen for these behaviors whenever an agonist is prescribed. Antipsychotics are not the treatment.</p>"},
{t:"parkinson",stem:"A 70-year-old woman with Parkinson disease for 8 years on carbidopa-levodopa reports seeing strangers in her house at night. She is not delirious; infection and metabolic causes have been excluded, and amantadine and trihexyphenidyl were stopped without improvement. Her motor symptoms would worsen with a lower levodopa dose. Which medication is most appropriate?",
opts:["Haloperidol","Risperidone","Olanzapine","Pimavanserin","Metoclopramide"],a:3,
exp:"<p>For Parkinson disease psychosis, first remove offending drugs; if hallucinations persist, use an antipsychotic that does not block striatal D2 receptors strongly: <b>pimavanserin</b> (5-HT2A inverse agonist), low-dose quetiapine, or clozapine. Haloperidol, risperidone, and olanzapine worsen parkinsonism. Metoclopramide is a dopamine blocker that worsens it as well.</p>"},
{t:"parkinson",stem:"A 68-year-old man has fallen backward several times in the past year. He has a stiff, upright posture, a fixed 'surprised' facial expression, and slurred speech. He cannot look down voluntarily, but his eyes move fully when his head is passively tilted. A trial of carbidopa-levodopa produced little benefit. Which is the most likely diagnosis?",
opts:["Parkinson disease","Multiple system atrophy","Progressive supranuclear palsy","Corticobasal degeneration","Normal pressure hydrocephalus"],a:2,
exp:"<p>Early falls, axial rigidity, and a <b>supranuclear vertical gaze palsy</b> (voluntary downgaze lost, oculocephalic movements preserved) indicate <b>progressive supranuclear palsy</b>, a tauopathy with midbrain atrophy ('hummingbird' sign) and poor levodopa response. MSA features early autonomic failure; CBD causes asymmetric apraxia and alien limb.</p>"},
{t:"hyperkinetic",stem:"A 45-year-old man has a tremor of both hands that makes it difficult to drink coffee and sign checks. It has slowly worsened for 10 years and improves after a glass of wine. His father had the same problem. There is also a mild 'no-no' head tremor. Muscle tone, gait, and movement speed are normal. Which medication is most appropriate?",
opts:["Carbidopa-levodopa","Benztropine","Tetrabenazine","Haloperidol","Propranolol"],a:4,
exp:"<p>Bilateral action/postural tremor with head involvement, family history, and alcohol responsiveness is <b>essential tremor</b>. First-line drugs are <b>propranolol</b> and primidone. Levodopa and anticholinergics treat parkinsonian rest tremor. Tetrabenazine treats chorea.</p>"},
{t:"hyperkinetic",stem:"A 22-year-old man has 6 months of worsening hand tremor, slurred speech, and depression. When he holds his arms out, a coarse tremor develops at the shoulders. ALT and AST are mildly elevated. Which of the following is the most appropriate next step in diagnosis?",
opts:["Serum ceruloplasmin and slit-lamp examination","HTT gene CAG repeat testing","Dopamine transporter (DaT) scan","Serum ferritin","Lumbar puncture"],a:0,
